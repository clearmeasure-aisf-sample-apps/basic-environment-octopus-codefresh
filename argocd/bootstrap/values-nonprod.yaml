# argocd/bootstrap/values-nonprod.yaml
#
# Values for the argo/argo-cd Helm chart 10.9.2 (app v3.5.3; ADR-D3, E13), instance `argocd-nonprod`
# on aks-platform-nonprod (tdd, uat, previews; ADR-IR34).
#
# Two consumers, one file:
#   1. terraform/tier installs the chart once as Helm release `argocd` (repository
#      https://argoproj.github.io/argo-helm, chart argo-cd 10.9.2, namespace argocd) and ignores
#      changes afterwards (P1-07).
#   2. argocd/clusters/nonprod/addons/argocd.yaml then manages the same release with this file, so
#      Argo CD manages itself. Change the instance only by pull request to this file or to the chart
#      pin there; never with `helm upgrade` or kubectl.
#
# ADR-IR34 changes:
#   - The ApplicationSet `apps` sets applicationsSync: create-update, which needs the controller's
#     policy override: a removed descriptor never deletes a tenant.
#   - Applications report the health of their child Applications (app of apps), so tenant-<app>
#     creates a workload Application only once its database Application is Healthy (CAP-GIT-008).
#   - The gateway account reads every app project (`app-*/*`).
#   - Every Argo CD pod runs on the tainted system pool (ADR-IR34 decision 15).
#
# Contracts: §7.0 Argo CD and Kubernetes, §7.3 (configuration, RBAC), §7.8 (repository credential).
# Writer: H (platform owners; CODEOWNERS on argocd/**).

global:
  # UI host name: HTTPRoute argocd-server through Gateway platform-gateway, allow-listed by client IP
  # (gitops/platform/ingress/overlays/nonprod/argocd-ui.yaml; docs/argocd-ui-access.md).
  domain: argocd.20-114-71-237.sslip.io
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.azure.com/mode: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

crds:
  install: true
  # Deleting the release must never delete Application or AppProject objects.
  keep: true

configs:
  cm:
    # Public UI URL (TLS at the gateway). The redirect URI to register on <argocd-sso-app> when SSO is
    # finished: https://argocd.20-114-71-237.sslip.io/auth/callback
    url: https://argocd.20-114-71-237.sslip.io
    # Annotation tracking (the Argo CD 3 default), set explicitly so no chart default changes it.
    application.resourceTrackingMethod: annotation
    # Marks every managed object with this instance's ID.
    installationID: argocd-nonprod
    # 30s (was 120s, 2026-09-27): a pin commit waited 2.7 minutes on average for the next poll. Jitter kept small.
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
    # Local admin is off; platform operators sign in through Entra ID. Break-glass re-enables admin
    # by a reviewed change (docs/runbooks/break-glass.md).
    admin.enabled: false
    # Gateway account: API key only, no UI login (§7.3, §5.1 TB10).
    accounts.octopus: apiKey
    accounts.octopus.enabled: "true"
    # Owner account (interim, demo): UI login with a local password from the platform vault
    # (argocd-user-jeffrey-password*; ESO merges hash and mtime into argocd-secret). Reachable only from
    # the allow-listed IPs of the Argo CD HTTPRoute. Entra ID SSO below is the intended end state;
    # disable this account once SSO works (docs/argocd-ui-access.md).
    accounts.jeffrey: login
    accounts.jeffrey.enabled: "true"
    exec.enabled: false
    # Sync impersonation (beta since 3.5.0) stays off until the phase-4 hardening (§5.1 TB8).
    application.sync.impersonation.enabled: false
    # App of apps: an Application reports its child Applications' health, so sync waves wait for
    # them (Argo CD operator manual, sync waves of app-of-apps). The root keeps its add-ons in one
    # wave, so no add-on waits for another.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Entra ID SSO with workload identity federation (Q15 default; no client secret).
    # Source: https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/microsoft/
    # [VERIFY] <argocd-sso-app> needs a federated credential for
    # system:serviceaccount:argocd:argocd-server with this cluster's OIDC issuer; it is added after
    # each cluster build (the issuer changes on rebuild).
    oidc.config: |
      name: Entra ID
      issuer: https://login.microsoftonline.com/40645332-2e20-4bca-882c-b2706f93ce44/v2.0
      # Application (client) ID of the <argocd-sso-app> registration.
      clientID: <argocd-sso-app>
      azure:
        useWorkloadIdentity: true
      requestedIDTokenClaims:
        groups:
          essential: true
          value: "ApplicationGroup"
      requestedScopes:
        - openid
        - profile
        - email

  params:
    # Honour ApplicationSet-level applicationsSync (create-update on ApplicationSet `apps`).
    applicationsetcontroller.enable.policy.override: true
    # Plain HTTP/gRPC on argocd-server:80/443 (targetPort 8080): TLS terminates at Gateway
    # platform-gateway for the UI host. The Octopus Argo CD gateway therefore connects with
    # plaintext: true (argocd/clusters/<tier>/addons/octopus-argocd-gateway.yaml).
    server.insecure: true

  rbac:
    # Signed-in users outside the group below get nothing.
    policy.default: ""
    policy.matchMode: glob
    scopes: "[groups, email]"
    policy.csv: |
      # Account `octopus` (Octopus Argo CD gateway) is read-only. The tenant chart renders every
      # app Application in project app-<app>. Trigger sync is off (ADR-D4), so `applications, sync`
      # is not granted (E7).
      p, octopus, applications, get, app-*/*, allow
      p, octopus, logs, get, app-*/*, allow
      p, octopus, clusters, get, *, allow
      # People, by Entra group object ID: the operators (single-operator model, §13).
      g, 0f595422-4a87-465f-b3f8-2cdaf92d0272, role:admin
      # Local owner account (interim until SSO; IP allow-listed UI).
      g, jeffrey, role:admin

  # Helm repositories published as OCI artifacts (public; no credentials).
  # The environment repository is public too: Argo CD reads it anonymously, so no repository credential exists.
  repositories:
    octopusdeploy-oci:
      type: helm
      name: octopusdeploy
      url: registry-1.docker.io/octopusdeploy
      enableOCI: "true"
    envoyproxy-oci:
      type: helm
      name: envoyproxy
      url: docker.io/envoyproxy
      enableOCI: "true"

  secret:
    # argocd-secret holds only the server signing key, which Argo CD generates. No values here.
    createSecret: true

# Direct OIDC to Entra; Dex is not needed.
dex:
  enabled: false

server:
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    annotations:
      # Workload identity federation for the SSO app registration (client ID, not a UAMI).
      azure.workload.identity/client-id: <argocd-sso-app>
  podLabels:
    azure.workload.identity/use: "true"

# Runs ApplicationSet `apps` (one tenant per apps/*.yaml) and, in phase 6, preview generators.
applicationSet:
  replicas: 1

# No notification channel is part of the design; Octopus records deployment outcomes.
notifications:
  enabled: false
