# argocd/bootstrap/root-app-prod.yaml
#
# Values for the argo/argocd-apps Helm chart 2.0.5. terraform/tier installs it once, right after
# argo-cd, as Helm release `argocd-apps` in namespace argocd, then ignores changes (P1-07/P1-08).
#
# It creates:
#   - Application `platform-root` (§7.3): the only object Argo CD cannot create for itself. It syncs
#     argocd/clusters/prod (every file, recursively): namespaces, projects, storage, platform
#     secrets, ApplicationSet `apps` and the add-on Applications.
#   - A bootstrap copy of AppProject `platform-addons`: the root needs it before its first sync.
#     argocd/clusters/prod/projects.yaml is authoritative; Argo CD adopts the object on the first
#     sync and self-heals it from Git. Keep the two copies identical.
#
# Writer: H (platform owners). Contracts: §7.0 Roots, §7.3, ADR-D3.

projects:
  platform-addons:
    namespace: argocd
    description: Platform add-ons and the root app of argocd-prod
    sourceRepos:
      - https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
      - https://argoproj.github.io/argo-helm
      - https://charts.external-secrets.io
      - https://kyverno.github.io/kyverno/
      - https://charts.jetstack.io
      - docker.io/envoyproxy
      - registry-1.docker.io/octopusdeploy
    destinations:
      - server: https://kubernetes.default.svc
        namespace: argocd
      - server: https://kubernetes.default.svc
        namespace: external-secrets
      - server: https://kubernetes.default.svc
        namespace: kyverno
      - server: https://kubernetes.default.svc
        namespace: cert-manager
      - server: https://kubernetes.default.svc
        namespace: octopus-argocd-gateway
      - server: https://kubernetes.default.svc
        namespace: platform-ingress
      - server: https://kubernetes.default.svc
        namespace: platform-backup
      - server: https://kubernetes.default.svc
        namespace: argo-rollouts
    # The only project allowed every cluster-scoped kind (§7.0 AppProjects).
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    namespaceResourceWhitelist:
      - group: "*"
        kind: "*"

applications:
  platform-root:
    namespace: argocd
    # No finalizers: deleting the root never cascades into the platform.
    project: platform-addons
    source:
      repoURL: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
      targetRevision: main
      path: argocd/clusters/prod
      directory:
        recurse: true
    destination:
      server: https://kubernetes.default.svc
      namespace: argocd
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      # Objects that need add-on CRDs (platform-secrets.yaml) fail until the add-on syncs;
      # retries converge the root without manual steps.
      retry:
        limit: 10
        backoff:
          duration: 30s
          factor: 2
          maxDuration: 5m
