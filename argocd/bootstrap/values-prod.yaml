# argocd/bootstrap/values-prod.yaml
#
# Values for the argo/argo-cd Helm chart 10.9.2 (app v3.5.3; ADR-D3, E13), instance `argocd-prod` on
# aks-platform-prod (prod; ADR-IR34).
#
# Two consumers, one file:
#   1. terraform/tier installs the chart once as Helm release `argocd` (repository
#      https://argoproj.github.io/argo-helm, chart argo-cd 10.9.2, namespace argocd) and ignores
#      changes afterwards (P1-08).
#   2. argocd/clusters/prod/addons/argocd.yaml then manages the same release with this file, so
#      Argo CD manages itself. Change the instance only by pull request to this file.
#
# Differences from values-nonprod.yaml: host name, installationID, two replicas of the stateless
# server and repo server. An Argo CD outage pauses change only; running workloads are unaffected, so
# the controller and Redis stay single-instance. The ApplicationSet controller now runs in prod too:
# ApplicationSet `apps` renders the prod tenants (ADR-IR34).
#
# Contracts: §7.0 Argo CD and Kubernetes, §7.3 (configuration, RBAC), §7.8 (platform secrets).
# Writer: H (platform owners; CODEOWNERS on argocd/**).

global:
  # UI host name: HTTPRoute argocd-server through Gateway platform-gateway, allow-listed by client IP
  # (gitops/platform/ingress/overlays/prod/argocd-ui.yaml; docs/argocd-ui-access.md).
  domain: argocd.20-225-152-33.sslip.io
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.azure.com/mode: system
  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists
      effect: NoSchedule

crds:
  install: true
  # Deleting the release must never delete Application or AppProject objects.
  keep: true

configs:
  cm:
    # Public UI URL (TLS at the gateway). The redirect URI to register on <argocd-sso-app> when SSO is
    # finished: https://argocd.20-225-152-33.sslip.io/auth/callback
    url: https://argocd.20-225-152-33.sslip.io
    application.resourceTrackingMethod: annotation
    installationID: argocd-prod
    # 30s (was 120s, 2026-09-27): a pin commit waited 2.7 minutes on average for the next poll. Jitter kept small.
    timeout.reconciliation: 30s
    timeout.reconciliation.jitter: 10s
    # Local admin is off; see values-nonprod.yaml and docs/runbooks/break-glass.md.
    admin.enabled: false
    accounts.octopus: apiKey
    accounts.octopus.enabled: "true"
    # Owner account (interim, demo): UI login with a local password from the platform vault
    # (argocd-user-jeffrey-password*; ESO merges hash and mtime into argocd-secret). Reachable only from
    # the allow-listed IPs of the Argo CD HTTPRoute. Entra ID SSO below is the intended end state;
    # disable this account once SSO works (docs/argocd-ui-access.md).
    accounts.jeffrey: login
    accounts.jeffrey.enabled: "true"
    exec.enabled: false
    application.sync.impersonation.enabled: false
    # App of apps: see values-nonprod.yaml (CAP-GIT-008).
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Entra ID SSO with workload identity federation (Q15 default; no client secret).
    # [VERIFY] <argocd-sso-app> needs a federated credential for
    # system:serviceaccount:argocd:argocd-server with the prod cluster's OIDC issuer.
    oidc.config: |
      name: Entra ID
      issuer: https://login.microsoftonline.com/40645332-2e20-4bca-882c-b2706f93ce44/v2.0
      # Application (client) ID of the <argocd-sso-app> registration.
      clientID: <argocd-sso-app>
      azure:
        useWorkloadIdentity: true
      requestedIDTokenClaims:
        groups:
          essential: true
          value: "ApplicationGroup"
      requestedScopes:
        - openid
        - profile
        - email

  params:
    # Honour ApplicationSet-level applicationsSync (create-update on ApplicationSet `apps`).
    applicationsetcontroller.enable.policy.override: true
    # Plain HTTP/gRPC on argocd-server:80/443 (targetPort 8080): TLS terminates at Gateway
    # platform-gateway for the UI host. The Octopus Argo CD gateway therefore connects with
    # plaintext: true (argocd/clusters/<tier>/addons/octopus-argocd-gateway.yaml).
    server.insecure: true

  rbac:
    policy.default: ""
    policy.matchMode: glob
    scopes: "[groups, email]"
    policy.csv: |
      # Account `octopus` (Octopus Argo CD gateway) is read-only on every app project (§7.3, E7).
      p, octopus, applications, get, app-*/*, allow
      p, octopus, logs, get, app-*/*, allow
      p, octopus, clusters, get, *, allow
      # People, by Entra group object ID: the operators (single-operator model, §13).
      g, 0f595422-4a87-465f-b3f8-2cdaf92d0272, role:admin
      # Local owner account (interim until SSO; IP allow-listed UI).
      g, jeffrey, role:admin

  # Helm repositories published as OCI artifacts (public; no credentials). No environment-repo
  # credential is defined: the repository is public and Argo CD reads it anonymously (R11 retired, ADR-IR15).
  repositories:
    octopusdeploy-oci:
      type: helm
      name: octopusdeploy
      url: registry-1.docker.io/octopusdeploy
      enableOCI: "true"
    envoyproxy-oci:
      type: helm
      name: envoyproxy
      url: docker.io/envoyproxy
      enableOCI: "true"

  secret:
    createSecret: true

dex:
  enabled: false

server:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false
  serviceAccount:
    annotations:
      azure.workload.identity/client-id: <argocd-sso-app>
  podLabels:
    azure.workload.identity/use: "true"

repoServer:
  replicas: 2
  pdb:
    enabled: true
    minAvailable: 1

# Runs ApplicationSet `apps` (the prod tenants). Previews stay nonprod only (ADR-C4).
applicationSet:
  replicas: 1

notifications:
  enabled: false
