# argocd/clusters/prod/platform-secrets.yaml
#
# Platform secrets of argocd-prod, pulled from the platform vault kv-platform-pr-i3aldz (in
# rg-platform-prod-aks, created by terraform/tier) by ESO (§7.8, ADR-IR34). Synced by `platform-root`
# at wave 0 with the add-ons; the ESO CRDs arrive with addons/external-secrets.yaml, so the dry run
# is skipped until they exist and the root's retry converges.
#
# Vault secrets, seeded by a platform-operators member after env-apply (P1-07), never by Git:
#   argocd-repo-read-credential         JSON with Argo CD repo-creds fields. Interim credential
#                                       (ADR-IR34, R11): the stored org PAT, as
#                                       {"username": "x-access-token", "password": "<PAT>"}, until the
#                                       read-only GitHub App exists; then {"githubAppID": "...",
#                                       "githubAppInstallationID": "...", "githubAppPrivateKey": "..."}.
#   argocd-octopus-gateway-token        API token of Argo CD account `octopus` (docs/bootstrap.md)
#   octopus-gateway-registration-token  the Space Manager API key for gateway registration (ADR-IR32)
#   argocd-user-jeffrey-password[-bcrypt|-mtime]  local UI account jeffrey (docs/argocd-ui-access.md)
#   argocd-sso-client-secret            only if workload identity federation is unavailable (Q15)
#
# Writer: H (platform owners). Contracts: §7.0 Identities, §7.8, ADR-IR34 decision 6, ADR-IR15.

# Cluster-wide store, usable only from the two platform namespaces that need it. App stores are
# ClusterSecretStores <app>-<env> rendered by the tenant chart.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - argocd
        - octopus-argocd-gateway
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-platform-pr-i3aldz.vault.azure.net
      # Federated to id-eso-platform-prod (subject system:serviceaccount:external-secrets:external-secrets).
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
# Argo CD read access to the environment repo. terraform/tier seeds a Secret with this name once
# (no ownerReference) so the first sync can read the repo; ESO then adopts and refreshes it from the
# vault. Orphan plus Prune=false: removing this object never cuts Argo CD off from its own source.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-repo-creds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-repo-creds
    creationPolicy: Orphan
    template:
      engineVersion: v2
      # Keep the extracted credential fields and add the repo-creds metadata.
      mergePolicy: Merge
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repo-creds
      data:
        type: git
        url: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
  dataFrom:
    - extract:
        key: argocd-repo-read-credential
---
# Gateway -> Argo CD API token (account `octopus`, read-only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-octopus-token
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-octopus-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd-octopus-gateway-token
---
# Gateway -> Octopus registration: the Space Manager API key (ADR-IR32).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: octopus-gateway-registration
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: octopus-gateway-registration
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: octopus-gateway-registration-token
---
# Local account jeffrey (UI login, IP allow-listed; docs/argocd-ui-access.md): ESO merges the bcrypt hash and its
# RFC3339 mtime from the vault into argocd-secret, which the chart creates (argocd-secret /data is ignoreDifferences'd).
# The plaintext argocd-user-jeffrey-password stays in the vault for the owner only. Merge never deletes argocd-secret.
# Unlike nonprod, prod does not persist server.secretkey or the octopus tokens here. Last wave, as in nonprod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-persisted
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: accounts.jeffrey.password
      remoteRef:
        key: argocd-user-jeffrey-password-bcrypt
    - secretKey: accounts.jeffrey.passwordMtime
      remoteRef:
        key: argocd-user-jeffrey-password-mtime
