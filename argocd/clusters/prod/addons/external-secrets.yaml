# argocd/clusters/prod/addons/external-secrets.yaml
#
# External Secrets Operator (ADR-D9, ADR-IR34 decision 6). One controller identity per tier:
# service account external-secrets/external-secrets, federated to id-eso-platform-prod (Key Vault
# Secrets User on rg-platform-prod-aks and rg-platform-prod-apps). It serves
#   - ClusterSecretStore platform-keyvault (argocd/clusters/prod/platform-secrets.yaml);
#   - one ClusterSecretStore <app>-<env> per app-environment (tenant chart), whose conditions admit
#     only that app-environment's namespaces and platform-backup.
# No app namespace holds an Azure identity for ESO.
#
# Writer: H (platform owners). Contracts: §7.0 Identities, §7.8, ADR-IR34 decision 6.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-addons
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    # Chart 2.11.0 (appVersion v2.11.0), checked 2026-09-24. API external-secrets.io/v1.
    targetRevision: 2.11.0
    helm:
      releaseName: external-secrets
      valuesObject:
        installCRDs: true
        global:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        serviceAccount:
          create: true
          # Fixed name: it is the federated credential subject (§7.0 Identities).
          name: external-secrets
          annotations:
            # Client ID of UAMI id-eso-platform-prod (terraform/foundation output).
            azure.workload.identity/client-id: f54f89d2-cea8-44ce-ae3a-a4f7d628c97f
            azure.workload.identity/tenant-id: 40645332-2e20-4bca-882c-b2706f93ce44
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The ESO CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
