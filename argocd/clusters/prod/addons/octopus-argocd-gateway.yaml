# argocd/clusters/prod/addons/octopus-argocd-gateway.yaml
#
# Octopus Argo CD gateway for argocd-prod (ADR-D14). Registers this instance with Octopus as
# `argocd-prod` for environment(s) `prod` (§7.0 Wake and pins). Octopus then finds the
# Applications by their argo.octopus.com/* annotations, which only the tenant chart renders, one
# project per deployable (ADR-IR34).
#
# Secrets are existing-secret references only; ESO writes both from kv-platform-pr-i3aldz
# (argocd/clusters/prod/platform-secrets.yaml):
#   argocd-octopus-token          key `token`: API token of Argo CD account `octopus` (read-only)
#   octopus-gateway-registration  key `token`: the Space Manager API key (ADR-IR32)
# Until they exist the gateway pods wait; the retry converges. Pinned to the system pool with the
# other add-ons (ADR-IR34 decision 15: the key is exposed to a cluster compromise).
#
# Value names: https://octopus.com/docs/argo-cd/instances/helm-chart-values (E8), chart 2.1.0.
# Writer: H (platform owners). Contracts: §7.0 Wake and pins, §7.3, §7.8, ADR-D14.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: octopus-argocd-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-addons
  source:
    # oci://registry-1.docker.io/octopusdeploy/octopus-argocd-gateway-chart, served through the OCI
    # Helm repository `octopusdeploy` declared in argocd/bootstrap/values-prod.yaml.
    repoURL: registry-1.docker.io/octopusdeploy
    chart: octopus-argocd-gateway-chart
    # Chart 2.1.0 (appVersion 2.0.1), checked 2026-09-24. Upgrades by pull request only.
    targetRevision: 2.1.0
    helm:
      releaseName: octopus-argocd-gateway
      valuesObject:
        nodeSelector:
          kubernetes.azure.com/mode: system
        tolerations:
          - key: CriticalAddonsOnly
            operator: Exists
            effect: NoSchedule
        gateway:
          argocd:
            # <release>-server.<namespace>.svc.cluster.local:443 for an in-cluster instance.
            serverGrpcUrl: argocd-server.argocd.svc.cluster.local:443
            # argocd-server serves its generated self-signed certificate inside the cluster: traffic
            # stays encrypted, verification is skipped. For a self-signed Argo CD certificate the
            # documented setting is insecure=true (https://octopus.com/docs/argo-cd/troubleshooting,
            # "Self Signed Certificate"; checked 2026-09-28).
            insecure: true
            # argocd-server runs with server.insecure (TLS at the platform gateway).
            plaintext: true
            authenticationTokenSecretName: argocd-octopus-token
            authenticationTokenSecretKey: token
          octopus:
            # gRPC endpoint of Octopus Cloud: host of https://clearmeasure.octopus.app, port 8443 (not the web URL).
            serverGrpcUrl: clearmeasure.octopus.app:8443
        registration:
          # Registration runs as Helm hooks, which Argo CD maps to sync hooks and reruns on syncs.
          # Verified 2026-09-26: registering again under an existing name fails. Prod is never rebuilt;
          # after a lost cluster follow docs/runbooks/credential-rotation.md, section 5, "Prod after a lost cluster".
          register: true
          octopus:
            name: argocd-prod
            serverApiUrl: https://clearmeasure.octopus.app
            spaceId: Spaces-335
            # Environment slugs (§7.0 Octopus).
            environments:
              - prod
            serverAccessTokenSecretName: octopus-gateway-registration
            serverAccessTokenSecretKey: token
          argocd:
            webUiUrl: https://argocd.20-225-152-33.sslip.io
        # The chart's default CronJob upgrades the release with Helm, which would fight Argo CD.
        autoUpdate:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: octopus-argocd-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
