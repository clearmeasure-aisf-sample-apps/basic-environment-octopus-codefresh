# argocd/clusters/nonprod/namespaces.yaml
#
# Platform namespaces of aks-platform-nonprod (§7.0 Naming), synced by `platform-root` at wave -10,
# before every Application of the root. Not here, by design:
#   - argocd: created by the terraform/tier bootstrap;
#   - octopus-worker-<env>: created by terraform/tier with the Octopus workers (ADR-D14);
#   - app namespaces <app>-<env> and <app>-<part>-<env>: rendered by the tenant chart (ADR-IR34);
#   - argo-rollouts: created by the phase-6 add-on (CreateNamespace).
# Label tier: platform. Pod Security: baseline enforced (restricted warned) for the add-ons;
# restricted for platform-backup, whose Jobs are platform-written.
# Writer: H (platform owners). Contracts: §7.0 Naming, §7.4.
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
apiVersion: v1
kind: Namespace
metadata:
  name: octopus-argocd-gateway
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
# Envoy Gateway controller, Envoy proxies, Gateway platform-gateway, the ListenerSets and the ACME
# HTTP-01 solvers (gitops/platform/ingress).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-ingress
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
---
# Database backup and restore Jobs (gitops/platform/components/backup/mssql and the tenant chart).
apiVersion: v1
kind: Namespace
metadata:
  name: platform-backup
  labels:
    tier: platform
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
