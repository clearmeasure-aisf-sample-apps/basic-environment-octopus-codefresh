# argocd/clusters/nonprod/projects.yaml
#
# AppProjects of argocd-nonprod (§7.0 AppProjects), synced by `platform-root` at wave -5 (after the
# namespaces, before every Application). `platform-addons` here is authoritative; the copy in
# argocd/bootstrap/root-app-nonprod.yaml exists only so the root can sync the first time. Keep them
# identical.
#   platform-addons   the root and the add-ons; the only project with every cluster-scoped kind.
#   platform-tenants  tenant-<app> Applications of ApplicationSet `apps`: exactly the kinds the tenant
#                     chart renders, in argocd, platform-ingress, platform-backup and the app
#                     namespaces of this cluster. Admin-equivalent for app namespaces, so the chart
#                     guards its input (reserved names, patterns) and descriptors are reviewed.
#   app-<app>         rendered per app by the tenant chart (not here).
#   default           locked.
# Writer: H (platform owners; CODEOWNERS on argocd/**).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-addons
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  description: Platform add-ons and the root app of argocd-nonprod
  sourceRepos:
    - <ENV_REPO_URL>
    - https://argoproj.github.io/argo-helm
    - https://charts.external-secrets.io
    - https://kyverno.github.io/kyverno/
    - https://charts.jetstack.io
    - docker.io/envoyproxy
    - registry-1.docker.io/octopusdeploy
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: external-secrets
    - server: https://kubernetes.default.svc
      namespace: kyverno
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: octopus-argocd-gateway
    - server: https://kubernetes.default.svc
      namespace: platform-ingress
    - server: https://kubernetes.default.svc
      namespace: platform-backup
    - server: https://kubernetes.default.svc
      namespace: argo-rollouts
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-tenants
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  description: Tenants of argocd-nonprod, one per apps/<app>.yaml (gitops/platform/tenant)
  sourceRepos:
    - <ENV_REPO_URL>
  destinations:
    - server: https://kubernetes.default.svc
      namespace: "argocd"
    - server: https://kubernetes.default.svc
      namespace: "platform-ingress"
    - server: https://kubernetes.default.svc
      namespace: "platform-backup"
    - server: https://kubernetes.default.svc
      namespace: "*-tdd"
    - server: https://kubernetes.default.svc
      namespace: "*-uat"
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
    - group: external-secrets.io
      kind: ClusterSecretStore
    - group: policies.kyverno.io
      kind: ImageValidatingPolicy
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: AppProject
    - group: argoproj.io
      kind: Application
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: gateway.networking.k8s.io
      kind: ListenerSet
    - group: external-secrets.io
      kind: ExternalSecret
    - group: batch
      kind: CronJob
---
# Locked: every Application must name a real project (§7.0 AppProjects).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  description: Locked. No sources, no destinations.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
