# argocd/clusters/nonprod/platform-secrets.yaml
#
# Platform secrets of argocd-nonprod, pulled from the platform vault kv-platform-np-i3aldz (in
# rg-platform-nonprod-aks, created by terraform/tier) by ESO (§7.8, ADR-IR34). Synced by `platform-root`
# at wave 0 with the add-ons; the ESO CRDs arrive with addons/external-secrets.yaml, so the dry run
# is skipped until they exist and the root's retry converges.
#
# Vault secrets, seeded by a platform-operators member after env-apply (P1-07), never by Git:
#   argocd-octopus-gateway-token        API token of Argo CD account `octopus` (docs/bootstrap.md)
#   octopus-gateway-registration-token  the Space Manager API key for gateway registration (ADR-IR32)
#   zerossl-eab-hmac-key                HMAC key of ZeroSSL's External Account Binding (public ACME issuer, nonprod)
#   argocd-user-jeffrey-password[-bcrypt|-mtime]  local UI account jeffrey (docs/argocd-ui-access.md)
#   argocd-sso-client-secret            only if workload identity federation is unavailable (Q15)
#
# Writer: H (platform owners). Contracts: §7.0 Identities, §7.8, ADR-IR34 decision 6, ADR-IR15.

# Cluster-wide store, usable only from the two platform namespaces that need it. App stores are
# ClusterSecretStores <app>-<env> rendered by the tenant chart.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform-keyvault
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        - argocd
        - octopus-argocd-gateway
        - cert-manager
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: https://kv-platform-np-i3aldz.vault.azure.net
      # Federated to id-eso-platform-nonprod (subject system:serviceaccount:external-secrets:external-secrets).
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
---
# Gateway -> Argo CD API token (account `octopus`, read-only).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-octopus-token
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-octopus-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: argocd-octopus-gateway-token
---
# Gateway -> Octopus registration: the Space Manager API key (ADR-IR32).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: octopus-gateway-registration
  namespace: octopus-argocd-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: octopus-gateway-registration
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: octopus-gateway-registration-token
---
# Argo CD signing key and the token list of account `octopus`, kept across a nonprod rebuild. env-destroy deletes the
# cluster with argocd-secret; the new Argo CD would sign with a fresh `server.secretkey` and know no token, so the
# gateway token in the vault would answer "token signature is invalid" and no pin would reach an Application
# (CAP-GIT-010). ESO merges both keys from the vault into argocd-secret, which the chart creates; Argo CD reloads its
# settings when the Secret changes. Merge never deletes argocd-secret. Seeded once by a platform owner after minting the
# gateway token (docs/runbooks/credential-rotation.md, section 5). Last wave: until the vault holds both secrets this
# ExternalSecret reports an error, and no later wave may wait for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret-persisted
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: argocd-secret
    creationPolicy: Merge
    deletionPolicy: Retain
  data:
    - secretKey: server.secretkey
      remoteRef:
        key: argocd-server-secretkey
    - secretKey: accounts.octopus.tokens
      remoteRef:
        key: argocd-octopus-tokens
    # Local account jeffrey (UI login, IP allow-listed): bcrypt hash and its RFC3339 mtime. The plaintext
    # argocd-user-jeffrey-password stays in the vault for the owner only (docs/argocd-ui-access.md).
    - secretKey: accounts.jeffrey.password
      remoteRef:
        key: argocd-user-jeffrey-password-bcrypt
    - secretKey: accounts.jeffrey.passwordMtime
      remoteRef:
        key: argocd-user-jeffrey-password-mtime
---
# ZeroSSL External Account Binding HMAC key for ClusterIssuer letsencrypt-http01, which nonprod points at ZeroSSL
# (gitops/platform/ingress/overlays/nonprod/kustomization.yaml). cert-manager reads it from its own namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zerossl-eab
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-keyvault
  target:
    name: zerossl-eab
    creationPolicy: Owner
  data:
    - secretKey: secret
      remoteRef:
        key: zerossl-eab-hmac-key
