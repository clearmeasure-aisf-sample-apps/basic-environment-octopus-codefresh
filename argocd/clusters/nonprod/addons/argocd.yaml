# argocd/clusters/nonprod/addons/argocd.yaml
#
# Argo CD manages itself (ADR-D3). Same chart, release name (`argocd`) and namespace as the
# terraform/tier bootstrap, and the same values file, read from the environment repo through a
# `ref` source. After bootstrap, a pull request to argocd/bootstrap/values-nonprod.yaml or to the chart
# pin below is the only way to change the instance. The pin must equal the version terraform/tier
# installs.
#
# No finalizer: deleting this Application never deletes Argo CD.
# Writer: H (platform owners). Contracts: §7.3 (add-on Applications), ADR-D3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-addons
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      # Chart 10.9.2 carries appVersion v3.5.3 (argo-helm index, checked 2026-09-24).
      targetRevision: 10.9.2
      helm:
        releaseName: argocd
        valueFiles:
          - $values/argocd/bootstrap/values-nonprod.yaml
    - repoURL: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # argocd-secret: the chart renders it without keys, and ESO (argocd-secret-persisted, platform-secrets.yaml) merges the
  # signing key and the octopus token list into it. Without this a self-heal sync re-applied the chart's Secret and dropped
  # both ("server.secretkey is missing"), so the gateway could not reach Argo CD after a rebuild (CAP-GIT-010).
  ignoreDifferences:
    - kind: Secret
      name: argocd-secret
      namespace: argocd
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      # The Argo CD CRDs are too large for client-side apply annotations.
      - ServerSideApply=true
      # Sync keeps the live data of argocd-secret (ignoreDifferences above).
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
