# argocd/clusters/nonprod/addons/kyverno.yaml
#
# Two Applications (§7.3):
#   kyverno           the engine, chart 3.9.1 (app v1.19.1)
#   kyverno-policies  the policies, from policies/kyverno/overlays/nonprod (sre-security; the per-app
#                     signer policies come from the tenant chart)
#
# AKS stop and start (ADR-IR34 decision 22, V9, Q37): admission webhooks that match AKS-managed or
# wildcard cluster-scoped resources can make `az aks stop` fail, and a Fail webhook on Node blocks
# node registration while Kyverno is down after a start. So:
#   - config.webhooks.namespaceSelector excludes kube-system and kube-node-lease (kyverno itself is
#     excluded by excludeKyvernoNamespace);
#   - config.matchConditions sends Kyverno namespaced requests only: a cluster-scoped object never
#     reaches a resource webhook (the policies match namespaced kinds only);
#   - features.excludeBootstrapResources keeps Node and CertificateSigningRequest out of every Fail
#     webhook, evaluated by the API server even with no Kyverno pod running;
#   - the cleanup controller is off: its TTL webhook matches */* (wildcard) and the platform uses no
#     cleanup policy.
# CAP-AZ-005 proves the stop. Fallback, only if a stop is still rejected: env-sleep removes Kyverno's
# webhook configurations just before `az aks stop` (decision 22).
#
# Argo CD notes (https://kyverno.io/docs/installation/platform-notes/#notes-for-argocd-users):
# server-side apply, server-side diff with mutation webhooks, config.preserve false, aggregated
# ClusterRole rules ignored; annotation tracking is set in argocd/bootstrap/values-nonprod.yaml.
#
# Writer: H (platform owners); policy content: sre-security. Contracts: §7.3, §7.8, ADR-IR34 decision 22.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: platform-addons
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    # Chart 3.9.1 carries appVersion v1.19.1 (checked 2026-09-24).
    targetRevision: 3.9.1
    helm:
      releaseName: kyverno
      valuesObject:
        crds:
          install: true
        config:
          preserve: false
          webhooks:
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - kube-node-lease
          matchConditions:
            - name: platform-namespaced-requests-only
              expression: "request.namespace != ''"
        features:
          excludeBootstrapResources:
            enabled: true
          # Break-glass PolicyExceptions (ADR-IR2, docs/runbooks/break-glass.md), honoured only in
          # namespace kyverno. [VERIFY Q18] whether the flags also govern the CEL PolicyException kind.
          policyExceptions:
            enabled: true
            namespace: kyverno
        cleanupController:
          enabled: false
        # No pre-delete hooks: Argo CD turns them into PreDelete hooks and finalizers on this Application, and
        # env-destroy uninstalls Argo CD first, so namespace argocd never finished deleting (2026-09-26,
        # ServerTasks-11914069). The cluster goes with the destroy; nothing else removes Kyverno.
        webhooksCleanup:
          enabled: false
        admissionController:
          # One replica in nonprod: its policies audit, and the signer policy fails open.
          replicas: 1
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
          rbac:
            serviceAccount:
              # Fixed name: federated credential subject
              # system:serviceaccount:kyverno:kyverno-admission-controller -> id-kyverno-nonprod (§7.0),
              # used to read signatures and attestations from acrplatformi3aldz.azurecr.io.
              name: kyverno-admission-controller
              annotations:
                azure.workload.identity/client-id: 07cfc1de-7d85-4c73-b0fa-4b6fd7233b7d
          podLabels:
            azure.workload.identity/use: "true"
        backgroundController:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        reportsController:
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jqPathExpressions:
        - select(.aggregationRule != null) | .rules
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
# Policies. Until the Kyverno CRDs exist the dry run is skipped and the retry converges the sync.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-addons
  source:
    repoURL: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
    targetRevision: main
    path: policies/kyverno/overlays/nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
