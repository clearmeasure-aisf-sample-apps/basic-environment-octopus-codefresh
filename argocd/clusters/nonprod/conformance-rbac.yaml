# argocd/clusters/nonprod/conformance-rbac.yaml
#
# Read access to the platform's custom resources for sp-platform-conformance (object id
# b9bc5a2d-2cfb-4fcc-90f5-3c20b23505f1, terraform/foundation/entra.tf). Its Azure grant after P1-03 is Azure
# Kubernetes Service RBAC Reader, which covers the built-in kinds but no CRD, and an Azure custom role cannot
# name these API groups (they are not provider operations). AKS checks Kubernetes RBAC before Azure RBAC and
# names a service principal by its object id, so this binding adds exactly these reads: the kinds that
# tests/Platform.Conformance.Harness and Platform.Conformance.Tests list or get (CustomResourceKind), plus the
# admission webhooks, and one write (below: create Jobs in platform-backup). Synced by platform-root. Writer: H (platform owners). Contracts: §7.0 Identities.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-conformance-reader
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
      - appprojects
    verbs:
      - get
      - list
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - clustersecretstores
    verbs:
      - get
      - list
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - listenersets
    verbs:
      - get
      - list
  - apiGroups:
      - policies.kyverno.io
    resources:
      - validatingpolicies
      - imagevalidatingpolicies
    verbs:
      - get
      - list
  - apiGroups:
      - kyverno.io
    resources:
      - clusterpolicies
    verbs:
      - get
      - list
  # TenantTests (CAP-GIT-002) read the database disk's PersistentVolume; AKS RBAC Reader does not cover this
  # cluster-scoped kind.
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-conformance-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-conformance-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: b9bc5a2d-2cfb-4fcc-90f5-3c20b23505f1
---
# The one write: RestoreTests (CAP-AZ-010) starts a backup now from the CronJob's own template instead of waiting for
# the nightly schedule (a rebuild resets the CronJob's history). Create on Jobs in platform-backup only; the Job runs as
# the template's service account, not as the principal. Nonprod only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-conformance-backup-runner
  namespace: platform-backup
rules:
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-conformance-backup-runner
  namespace: platform-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-conformance-backup-runner
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: b9bc5a2d-2cfb-4fcc-90f5-3c20b23505f1
---
# Admission and sync tests create, change and remove their own fixtures of these CRD kinds, which the namespace's AKS RBAC
# Writer does not cover: EsoSyncTests (CAP-GIT-007) and SecretStoreIsolationTests (CAP-GIT-004) ExternalSecrets,
# HostnameOwnershipTests (CAP-GIT-013) HTTPRoutes, all in sandbox-tdd. A ClusterRoleBinding, because platform-root's
# project (platform-addons) may not deploy into app namespaces. Nonprod cluster only; every fixture carries
# conformance-run and is removed by the harness.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-conformance-fixture-writer
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - delete
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - create
      - patch
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-conformance-fixture-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-conformance-fixture-writer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: b9bc5a2d-2cfb-4fcc-90f5-3c20b23505f1
