# argocd/optional/argo-rollouts.yaml
#
# Phase-6 add-on (ADR-C3): Argo Rollouts app 1.10.0. Staged outside argocd/clusters/, so
# `platform-root` does not sync it. Enable per cluster by pull request that copies this file to
# argocd/clusters/<tier>/addons/argo-rollouts.yaml, after the entry criteria in ADR-C3 (at least two
# replicas; WI-09 done for app #1). Only then may an app overlay use a Rollout, for example
# gitops/apps/workorders/components/bluegreen; the tenant chart's app-<app> projects allow the kind.
#
# Namespace `argo-rollouts` is created by Argo CD; `platform-addons` already lists it as a
# destination. Argo CD ships Rollout health checks. Placed on the system pool with the other add-ons
# (ADR-IR34 decision 15).
#
# Writer: H (platform owners). Contracts: §7.0 AppProjects, §7.3, ADR-C3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: platform-addons
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # argo-helm chart 2.43.2 carries appVersion v1.10.0 (checked 2026-09-24).
    targetRevision: 2.43.2
    helm:
      releaseName: argo-rollouts
      valuesObject:
        installCRDs: true
        # Removing the add-on must not delete the Rollout CRDs and with them every Rollout.
        keepCRDs: true
        controller:
          replicas: 2
          nodeSelector:
            kubernetes.azure.com/mode: system
          tolerations:
            - key: CriticalAddonsOnly
              operator: Exists
              effect: NoSchedule
        # No dashboard: the Argo CD UI shows Rollouts, and nothing else is exposed.
        dashboard:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      labels:
        tier: platform
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
    syncOptions:
      - CreateNamespace=true
      # The Rollout CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
