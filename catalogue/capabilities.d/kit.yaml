# Capability catalogue fragment of the onboarding kit (role pragmatist, area Kit, prefix CAP-KIT; design ADR-IR34
# "First full capability list"). Schema: catalogue/capabilities.d/harness.yaml and tests/README.md. Owner `onboarding`
# is the catalogue's spelling of the onboarding kit.
#
# Tests live in tests/Platform.Conformance.Offline/Kit/ (Offline) and tests/Platform.Conformance.Tests/Kit/ (Live).
# The offline tests run the kit's command line (the onboarding tool, tools/Platform.Onboarding, built once per run) and
# gitleaks, and hold the consistency checks (Kit/Consistency) and the tool-boundary rules (Kit/Boundaries) in C#.
capabilities:
  - id: CAP-KIT-001
    statement: "The onboarding tool scaffolds a valid app from every starter"
    owner: onboarding
    adr: "ADR-IR34 (onboarding kit, decisions 10 and 19); docs/onboarding.md"
    observed_by: >-
      Platform.Onboarding new, scaffold, render and check on generated apps in a temporary copy, each Codefresh,
      Octopus and GitOps starter used at least once; kustomize build of every scaffolded Kustomize folder when
      kustomize is installed
    tests:
      - Platform.Conformance.Offline.Kit.OnboardingToolTests.Should_NewScaffoldRenderCheck_EveryStarter_ChecksClean
    live: false
    destructive: false
    tier: all
    why_offline: "A live onboarding creates licensed Octopus projects; CAP-KIT-003 checks the live side"

  - id: CAP-KIT-002
    statement: "Descriptors are validated: invalid descriptors are rejected and the committed ones accepted"
    owner: onboarding
    adr: "ADR-IR34 decision 10; design §7.0 Naming; apps/schema.json"
    observed_by: >-
      Platform.Onboarding check --scope descriptors on the committed apps/*.yaml and on the invalid fixtures of
      tests/Platform.Conformance.Offline/Kit/TestData/descriptors/invalid, each with its expected message
    tests:
      - Platform.Conformance.Offline.Kit.DescriptorValidationTests.Should_Check_CommittedDescriptors_AreAccepted
      - Platform.Conformance.Offline.Kit.DescriptorValidationTests.Should_Check_InvalidDescriptor_IsRejected
    live: false
    destructive: false
    tier: all
    why_offline: "Pure validation of files against apps/schema.json and the cross-descriptor rules"

  - id: CAP-KIT-003
    statement: "Every descriptor's live objects exist and match"
    owner: onboarding
    adr: "ADR-IR34 (decisions 8, 11, 26, 28); design §7.0"
    observed_by: >-
      Live: Octopus project groups app-<app> and projects (disabled when frozen), Codefresh projects, Applications
      tenant-<app> and namespaces <app>-<env> on both clusters, vaults kv-<app>-<e>-<hash4> in rg-platform-<tier>-apps
      (the Terraform formula) and disks disk-<app>-<env>-db in rg-platform-<tier>-data. Offline: the requests of
      codefresh/register.ps1 --app to a stubbed Codefresh API: a frozen app's pipelines with every git and cron trigger
      off and no build started, an active app's with the triggers of its specs and the webhook check, and a dry run
      without any request or context value. The Codefresh Git integration github-aisf-sample-apps is declared as an
      owner-only GitHub App without any value and verified only, never written (pending when absent, ok, or a WARN when
      it is still a token integration; planned without any request in a dry run), and every git: and context: reference
      to a github-* integration under codefresh/ names a declared one
    tests:
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterApp_FrozenApp_RegistersEveryTriggerOffAndStartsNoBuild
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterApp_ActiveApp_RegistersTheTriggersOfTheSpecsAndChecksTheWebhook
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterDryRun_FrozenApp_PlansEveryTriggerOffWithoutApiCallOrValue
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterFull_GitIntegrationAbsent_ReportsPendingAndWritesNothingForIt
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterFull_GitIntegrationIsAGitHubApp_ReportsOkAndPrintsNoValue
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterFull_GitIntegrationIsStillAToken_WarnsWithoutFailingOrWriting
      - Platform.Conformance.Offline.Kit.RegisterScriptTests.Should_RegisterDryRun_GitIntegration_PlansVerifyOnlyWithoutApiCallOrValue
      - Platform.Conformance.Offline.Codefresh.GitIntegrationDeclarationTests.Should_ReadIntegrations_GitIntegration_IsAnOwnerOnlyGitHubAppWithoutValue
      - Platform.Conformance.Offline.Codefresh.GitIntegrationDeclarationTests.Should_ReadCodefreshYaml_EveryGithubIntegrationReference_NamesADeclaredGitIntegration
      - Platform.Conformance.Tests.Kit.LiveInventoryTests.Should_LiveObjects_EveryDescriptor_ExistAndMatch
    live: true
    destructive: false
    tier: all

  - id: CAP-KIT-004
    statement: "An onboarding change touches only app-scoped paths"
    owner: onboarding
    adr: "ADR-IR34 (directive §5: one pull request, nothing platform-wide changes); design §7.0"
    observed_by: >-
      Platform.Onboarding check --changes on the fixture diffs of
      tests/Platform.Conformance.Offline/Kit/TestData/changes: fail-* touch platform paths or another app, pass-*
