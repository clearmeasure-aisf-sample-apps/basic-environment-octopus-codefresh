  - id: CAP-KIT-007
    statement: "The repository holds no secret"
    owner: onboarding
    adr: "ADR-IR4; design §11.0 (no secrets in files)"
    observed_by: >-
      gitleaks dir over the repository with .gitleaks.toml (exit code 0); and no tracked PowerShell script or OCL file
      passes a secret as an argument (curl Authorization headers, az passwords, client secrets and federated tokens,
      cosign identity tokens, sqlcmd -P), which other processes could read; and, because the repository is public (#47),
      no tracked file holds a high-confidence credential shape (private key PEM block, GitHub token, Octopus API key,
      Azure storage account key, Slack token, AWS access key ID), with the placeholder exception of .gitleaks.toml,
      shown on temporary trees whose fixtures are assembled at run time and on the real tree; and the committed terraform *.tfvars files (not the .example files) hold no operator IP range (api_server_authorized_ip_ranges, key_vault_allowed_ip_ranges) and no e-mail address (oncall_email_receivers or anywhere in the file), ADR-IR14 (#51); and the retired-credential guard
      (Kit/Boundaries/RetiredCredentialGuard): no tracked text file, Markdown included, names a retired credential (the
      personal access tokens replaced by the GitHub Apps aisf-board and aisf-conformance: the board tokens, and since #44 the
      conformance suite's organization token with its Octopus variable and Terraform input) outside the allow-list, which is
      the marker-delimited history section of docs/runbooks/credential-rotation.md and the guard itself (no Codefresh-context
      file may name any of them any more); small trees show each name failing outside the allow-list, the history markers
      passing and failing, and a stale allow-list entry failing
