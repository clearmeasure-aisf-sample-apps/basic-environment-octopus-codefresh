      the listed board-only workflows), over the repository tree,
      one test per rule, and a parse of every PowerShell script step of the OCL files; no finding. Small trees in a
      temporary folder show that TB14, TB16, TB17 and TB18 find their forbidden uses written in PowerShell and exempt
      only the .ps1 conformance scripts, that TB23 no longer lists them, and that TB24 fails an unlisted workflow and
      every way a listed one leaves its lane (including a pull_request trigger without the same-repository guard, and pull_request_target), and that its secret allow-list is the two GitHub App secrets and nothing else (no personal access token); the real board workflow reads only those, has no fallback and fails loudly, naming both secrets, when the App token is unavailable. The inline PowerShell of the platform
