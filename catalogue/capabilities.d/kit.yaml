      - Platform.Conformance.Offline.Kit.NoSecretsInTrackedFilesTests.Should_ScanTrackedFiles_RepositoryTree_FindNoSecretShape
      - Platform.Conformance.Offline.Kit.NoSecretsInTrackedFilesTests.Should_ScanTrackedFiles_SecretShapedFixtures_AreFoundWithoutTheValue
