  - id: CAP-KIT-010
    statement: "Unattended tooling gets its GitHub token from the GitHub Apps aisf-board and aisf-conformance, never from a personal access token"
    owner: onboarding
    adr: "ADR-IR34 (least privilege, decision 16); design E48 (installation tokens narrowed to repositories and permissions) and TB15 (the conformance App); docs/tool-boundaries.md, Board automation; docs/runbooks/credential-rotation.md, sections 11 and 12"
    observed_by: >-
      scripts/github/GitHubAppAuth.ps1 in a real pwsh with a key generated at test time and a stub GitHub API behind
      GITHUB_API_URL (no live call): the App JWT is RS256 with the documented header and claims (exp - iat within ten
      minutes) and its signature verifies with the public key and equals the signature of an independent openssl; the key comes
      from a file, the environment or (-PrivateKey) memory alone, and is never echoed or written to disk; the installation token
      request carries exactly the repositories and permissions asked for; the token order is a pre-minted token, a token
      minted from the App id and key, then the GitHub CLI token, with a retired personal access token variable ignored; and
      no transcript holds a PEM marker, key material, a JWT or a token. The same helper serves the conformance App
      aisf-conformance (#44) through -Prefix AISF_CONFORMANCE_APP and Resolve-GitHubAppToken (states app, unset, failed with
      the HTTP status only, no fallback), and the wrapper codefresh/platform/scripts/conformance-github.ps1 mints its token
      narrowed to the three repositories (the environment repository, the sandbox repository, 20260923-001) and Contents rw,
      Pull requests rw, Commit statuses read and Metadata read, sets GITHUB_TOKEN in the process and a mode-0600
      GITHUB_TOKEN_FILE, re-mints it, prints the PENDING owner setup message when the App is not configured and drops any
      GITHUB_TOKEN of the environment. The Octopus step report-commit-status carries the marked
      region of the helper verbatim (a drift test compares the copy with the helper; no openssl, no temporary key file, no inline
      JWT and no dollar-brace, percent-brace or hash-brace sequence is left in it) and runs it under the stub Octopus runtime in
      a real pwsh against the stub GitHub API: the exchange is signed by a real RS256 JWT, is narrowed to the one repository and
      statuses=write, the status is still posted through curl, a refused exchange or a malformed key ends in the Fail-Step
      naming the App id only, and no key, JWT or token reaches the log, a recorded call or a temporary file. The feature-loop helper board.ps1 and the stall
      watchdog Check-StalledLanes.ps1 run whole against the stub: the minted token is the Bearer of every later call, a call
      the App cannot make (the dispatch needs Contents write, statuses need Commit statuses read) is retried once with the
      GitHub CLI token, a dispatch refused everywhere posts the board-status fallback comment, and no token is printed.
      Full-system (browser) tests do not apply: there is no UI, so the whole scripts against the stub are the system-level
      layer, and the post-merge board-status dispatch run and the deployments that post platform/tdd, platform/uat and platform/prod are the live evidence
