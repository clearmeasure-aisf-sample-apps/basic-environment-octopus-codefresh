# Capability catalogue fragment of the conformance harness (owner: platform). See tests/README.md.
#
# The catalogue is catalogue/capabilities.yaml (optional) merged with every catalogue/capabilities.d/*.yaml,
# in file-name order. Each role owns one fragment; an ID defined in two files is an error naming both files.
# CatalogueConsistencyTests (tests/Platform.Conformance.Offline) enforces the one-to-one mapping between this
# catalogue and the tests, and `Platform.Conformance.Report render-catalogue` renders it to docs/capabilities.md.
#
# Schema: one top-level key, capabilities, holding a list of entries with these keys:
#   id           CAP-<AREA>-<NNN>, unique across all files, for example CAP-SLEEP-001
#   statement    one sentence: what the platform guarantees
#   owner        codefresh | octopus | argocd | azure | kyverno | onboarding | platform
#   adr          design reference: an ADR, a design section or a document path
#   observed_by  how the capability is observed: the API, object or signal the tests read
#   tests        fully qualified test names (Namespace.Class.Method, no arguments); each test carries
#                [Capability("<id>")], and the list matches those attributes exactly
#   live         true when a test needs the live platform (category Live); false when every test is Offline
#   destructive  true when proving it changes platform state: its tests are categorised Destructive and
#                NonProd, never Prod, and its tier is never prod
#   tier         build | nonprod | prod | all; a live test of a build, nonprod or prod capability also
#                carries the category Build, NonProd or Prod
#   why_offline  required when live is false, not allowed when live is true
capabilities:
  - id: CAP-HARNESS-001
