      - Platform.Conformance.Offline.CatalogueConsistencyTests.WhenCheckingCatalogue_EveryOfflineCapability_SaysWhyItIsOffline
      - Platform.Conformance.Offline.CatalogueConsistencyTests.WhenCheckingCatalogue_EveryRule_IsCoveredByATestOfThisFixture
      - Platform.Conformance.Offline.CatalogueConsistencyTests.WhenCheckingCatalogue_TestLists_MatchTheCapabilityAttributesExactly
      - Platform.Conformance.Offline.CatalogueConsistencyTests.WhenCheckingTests_Categories_AgreeWithTheLiveAndTierFlags
      - Platform.Conformance.Offline.CatalogueConsistencyTests.WhenCheckingTests_EveryDestructiveTest_IsCategorisedDestructiveAndNonProdAndNeverProd
