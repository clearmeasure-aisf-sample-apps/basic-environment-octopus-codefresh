# gitops/apps/sandbox/app/base/network.yaml
#
# HTTPRoute web on the HTTPS listener of the namespace (ListenerSet sandbox-<env> in platform-ingress,
# tenant chart; the config overlays set the name). No host name: it inherits
# sandbox-<env>.<apps-domain-<tier>> (CAP-GIT-012, CAP-GIT-013).
#
# Writer: H (platform owners). Contracts: §7.0 Ingress.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: platform-ingress
      # sandbox-<env>, set by envs/<env>/app/config.
      name: set-by-environment
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
