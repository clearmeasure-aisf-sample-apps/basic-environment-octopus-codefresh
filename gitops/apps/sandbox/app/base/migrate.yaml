# gitops/apps/sandbox/app/base/migrate.yaml
#
# PreSync hook Job db-migrate (ADR-IR34 decision 1; CAP-GIT-009, CAP-GIT-010): the sandbox migrator
# (apps/sandbox/migrator, pinned with the web image) applies the scripts not yet journaled, before
# the new web pods start. The image entrypoint migrate.sh retries until
# MIGRATION_DB_READY_TIMEOUT_SECONDS, so a database still starting is waited for; a failing script
# (the failing-migration toggle of fixtures/sandbox-app) fails the Job and the sync, and the old
# version keeps serving (CAP-GIT-010). The migrator validates the server certificate against
# platform-internal-ca (SSL_CERT_FILE).
#
# Writer: H (platform owners). Contracts: §7.0 Migrations and Conformance.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  # 10 minutes: a missing image (the bootstrap placeholder tag) fails the hook fast enough for the
  # retry to reach the pinned revision inside the Octopus verification window (900 s).
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: <acr-name>.azurecr.io/apps/sandbox/migrator
          args:
            - update
          env:
            - name: MIGRATION_DB_READY_TIMEOUT_SECONDS
              value: "600"
            - name: SSL_CERT_FILE
              value: /etc/platform/ca/ca.crt
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ca
              mountPath: /etc/platform/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          secret:
            secretName: db-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
