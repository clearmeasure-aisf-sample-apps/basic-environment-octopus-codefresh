# gitops/apps/sandbox/envs/uat/app/config/kustomization.yaml
#
# Configuration of the sandbox in uat (writer H; Octopus writes only ../kustomization.yaml).
# Host: sandbox-uat.<apps-domain-nonprod>.
#
# Writer: H (platform owners). Contracts: §7.0 Conformance and Ingress.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox-uat
resources:
  - ../../../../app/base
patches:
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: sandbox-uat
  # The platform hides diagnostic paths in uat and prod (§7.9, ADR-IR34 decision 21; CAP-GIT-012):
  # /_diagnostics is answered at the Gateway with a redirect to /, so it never reaches the app.
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: web
    patch: |-
      - op: add
        path: /spec/rules/0
        value:
          matches:
            - path:
                type: PathPrefix
                value: /_diagnostics
          filters:
            - type: RequestRedirect
              requestRedirect:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /
                statusCode: 302
