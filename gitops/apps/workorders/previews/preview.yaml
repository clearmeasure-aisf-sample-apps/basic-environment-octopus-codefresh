# gitops/apps/workorders/previews/preview.yaml
#
# The fence of a preview namespace workorders-pr-<n> (phase 6, ADR-C4), which the tenant chart does
# not render: a quota, the same default-deny ingress as the named environments (traffic within the
# namespace and from platform-ingress only), and the generator of the preview's API validation key.
#
# Writer: H (platform owners). Contracts: §7.0 Quotas and NetworkPolicy, ADR-C4.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: preview
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  hard:
    # SQL Server, ui-server and worker with one rolling surge pod each, plus the hook Jobs.
    requests.cpu: "2"
    requests.memory: 5Gi
    pods: "10"
    services.loadbalancers: "0"
    services.nodeports: "0"
    persistentvolumeclaims: "0"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-default-deny-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: preview-allow-namespace-and-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: platform-ingress
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: app-validation-key
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
