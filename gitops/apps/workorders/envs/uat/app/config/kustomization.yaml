# gitops/apps/workorders/envs/uat/app/config/kustomization.yaml
#
# Configuration of deployable `app` in uat, changed by pull request only (writer H). Octopus never
# writes here; it writes only the three newTag fields of ../kustomization.yaml (§7.6).
# Configuration follows expand/contract: a key a release needs lands here before that release
# reaches uat. A change that must roll through the environments is a component under
# ../../../../components/, enabled in tdd first, then uat, then prod (ADR-D6).
# Host: workorders-uat.<apps-domain-nonprod>, from the ListenerSet the tenant chart renders.
#
# Writer: H (platform owners). Contracts: §7.0, §7.9, ADR-D6, ADR-D12, ADR-D16, ADR-IR34.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workorders-uat
resources:
  - ../../../../app/base
configMapGenerator:
  - name: workorders-config
    literals:
      # [VERIFY] parity with the legacy environment settings (§7.9).
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - AI_OpenAI_Url=
      - AI_OpenAI_Model=
      # Read by the worker only.
      - RemotableBus__ApiUrl=http://ui-server.workorders-uat.svc.cluster.local:8080/api/blazor-wasm-single-api
      # Until WI-10 (the worker cannot send the API key yet).
      - ApiKeyAuthentication__Enabled=false
patches:
  # App secrets from the app vault through store workorders-uat (ADR-IR34 decision 6).
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: workorders-app
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: workorders-uat
  # The HTTPS listener of namespace workorders-uat (tenant chart).
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ui-server
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: workorders-uat
  # Diagnostic and demo paths are answered with a redirect to / at the Gateway, so they never reach
  # the app in uat (§7.9, ADR-D12, ADR-IR34 decision 21; CAP-GIT-012). Envoy Gateway supports the
  # RequestRedirect path modifier (Gateway API v1.6 conformance).
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ui-server
    patch: |-
      - op: add
        path: /spec/rules/0
        value:
          matches:
            - path:
                type: PathPrefix
                value: /_healthcheck/detailed
            - path:
                type: PathPrefix
                value: /_demo
            - path:
                type: PathPrefix
                value: /_diagnostics
            - path:
                type: PathPrefix
                value: /mcp
          filters:
            - type: RequestRedirect
              requestRedirect:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /
                statusCode: 302
  # Worker stays at 0 until enabled in uat (phase 3, ADR-D16); enabling is a one-line pull request.
  - target:
      group: apps
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
