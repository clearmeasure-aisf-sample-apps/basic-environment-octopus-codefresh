# gitops/apps/workorders/envs/prod/app/config/kustomization.yaml
#
# Configuration of deployable `app` in prod, changed by pull request only (writer H). Octopus never
# writes here; it writes only the three newTag fields of ../kustomization.yaml (§7.6).
# Configuration follows expand/contract: a key a release needs lands here before that release
# reaches prod. A change that must roll through the environments is a component under
# ../../../../components/, enabled in tdd first, then uat, then prod (ADR-D6).
# Host: workorders-prod.<apps-domain-prod>, from the ListenerSet the tenant chart renders.
#
# Writer: H (platform owners). Contracts: §7.0, §7.9, ADR-D6, ADR-D12, ADR-D16, ADR-IR34.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workorders-prod
resources:
  - ../../../../app/base
configMapGenerator:
  - name: workorders-config
    literals:
      # [VERIFY] parity with the legacy environment settings (§7.9).
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - AI_OpenAI_Url=https://jeffr-mlq3cayr-swedencentral.services.ai.azure.com
      - AI_OpenAI_Model=gpt-5.2-chat
      # Read by the worker only.
      - RemotableBus__ApiUrl=http://ui-server.workorders-prod.svc.cluster.local:8080/api/blazor-wasm-single-api
      # Until WI-10 (the worker cannot send the API key yet).
      - ApiKeyAuthentication__Enabled=false
      # The health dashboard reads /_healthcheck and /api/v1.0/version from the viewer's browser
      # (clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh-dashboard); only its origin is allowed.
      - Cors__Enabled=true
      - Cors__AllowedOrigins__0=https://clearmeasure-aisf-sample-apps.github.io
patches:
  # App secrets from the app vault through store workorders-prod (ADR-IR34 decision 6).
  - target:
      group: external-secrets.io
      kind: ExternalSecret
      name: workorders-app
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: workorders-prod
  # The HTTPS listener of namespace workorders-prod (tenant chart).
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ui-server
    patch: |-
      - op: replace
        path: /spec/parentRefs/0/name
        value: workorders-prod
  # Diagnostic and demo paths are answered with a redirect to / at the Gateway, so they never reach
  # the app in prod (§7.9, ADR-D12, ADR-IR34 decision 21; CAP-GIT-012). Envoy Gateway supports the
  # RequestRedirect path modifier (Gateway API v1.6 conformance).
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: ui-server
    patch: |-
      - op: add
        path: /spec/rules/0
        value:
          matches:
            - path:
                type: PathPrefix
                value: /_healthcheck/detailed
            - path:
                type: PathPrefix
                value: /_demo
            - path:
                type: PathPrefix
                value: /_diagnostics
            - path:
                type: PathPrefix
                value: /mcp
          filters:
            - type: RequestRedirect
              requestRedirect:
                path:
                  type: ReplaceFullPath
                  replaceFullPath: /
                statusCode: 302
  # Worker stays at 0 in prod until product-owner sign-off, because the AI bot saga goes live
  # then (ADR-D16).
  - target:
      group: apps
      kind: Deployment
      name: worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
