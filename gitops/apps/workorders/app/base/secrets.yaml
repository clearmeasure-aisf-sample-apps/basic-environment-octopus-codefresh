# gitops/apps/workorders/app/base/secrets.yaml
#
# App secrets from the app vault kv-workorders-<e>-<hash4> through ClusterSecretStore
# workorders-<env> (ADR-IR34 decisions 6 and 8; the config overlays set the store name). No
# identity lives in the namespace: the tier's ESO controller reads the vault, and the store admits
# only this app-environment's namespaces. Sync wave -1: the Deployments start after the Secret.
#
# Vault key (apps/workorders.yaml `secrets`, terraform/apps/tier)   -> key in Secret workorders-app
#   ai-openai-apikey                (stand-in until an operator sets it) -> AI_OpenAI_ApiKey
#   api-validation-key              (generated)                          -> ApiKeyAuthentication__ValidationKey
#   appinsights-connection-string   (platform key)                       -> ApplicationInsights__ConnectionString,
#                                                                           APPLICATIONINSIGHTS_CONNECTION_STRING
# The database credentials are Secrets db-app and db-migrator of Application workorders-db-<env>.
#
# Writer: H (platform owners). Contracts: §7.0, §7.8, §7.9.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workorders-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # workorders-<env>, set by envs/<env>/app/config.
    name: workorders-set-by-environment
  target:
    name: workorders-app
    creationPolicy: Owner
  data:
    - secretKey: AI_OpenAI_ApiKey
      remoteRef:
        key: ai-openai-apikey
    - secretKey: ApiKeyAuthentication__ValidationKey
      remoteRef:
        key: api-validation-key
    - secretKey: ApplicationInsights__ConnectionString
      remoteRef:
        key: appinsights-connection-string
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: appinsights-connection-string
