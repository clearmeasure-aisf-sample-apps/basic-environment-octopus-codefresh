# gitops/apps/workorders/app/base/secrets.yaml
#
# App secrets from the app vault kv-workorders-<e>-<hash4> through ClusterSecretStore
# workorders-<env> (ADR-IR34 decisions 6 and 8; the config overlays set the store name). No
# identity lives in the namespace: the tier's ESO controller reads the vault, and the store admits
# only this app-environment's namespaces. Sync wave -1: the Deployments start after the Secret.
#
# Vault key (apps/workorders.yaml `secrets`, terraform/apps/tier)   -> key in Secret workorders-app
#   ai-openai-apikey                (stand-in until an operator sets it) -> AI_OpenAI_ApiKey
#   api-validation-key              (generated)                          -> ApiKeyAuthentication__ValidationKey
#   appinsights-connection-string   (platform key)                       -> ApplicationInsights__ConnectionString,
#                                                                           APPLICATIONINSIGHTS_CONNECTION_STRING
# The database credentials are Secrets db-app and db-migrator of Application workorders-db-<env>.
#
# The AI key: until a platform-operators member sets it, the vault holds terraform/apps/tier's stand-in
# `not-set-see-credential-rotation-runbook` (docs/runbooks/credential-rotation.md §9). The template maps any
# `not-set-…` value to an empty AI_OpenAI_ApiKey, which the app treats as "chat feature off" (LlmGateway check
# Healthy). Passed through, the stand-in would count as a configured key: every LLM probe fails, /_healthcheck
# answers 503 Unhealthy and the Octopus smoke test fails in every environment. A real key flows through unchanged;
# pods read it at their next restart.
#
# Writer: H (platform owners). Contracts: §7.0, §7.8, §7.9.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: workorders-app
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # workorders-<env>, set by envs/<env>/app/config.
    name: workorders-set-by-environment
  target:
    name: workorders-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AI_OpenAI_ApiKey: '{{ if hasPrefix "not-set-" .aiOpenAiApiKey }}{{ else }}{{ .aiOpenAiApiKey }}{{ end }}'
        ApiKeyAuthentication__ValidationKey: "{{ .apiValidationKey }}"
        ApplicationInsights__ConnectionString: "{{ .appInsightsConnectionString }}"
        APPLICATIONINSIGHTS_CONNECTION_STRING: "{{ .appInsightsConnectionString }}"
  data:
    - secretKey: aiOpenAiApiKey
      remoteRef:
        key: ai-openai-apikey
    - secretKey: apiValidationKey
      remoteRef:
        key: api-validation-key
    - secretKey: appInsightsConnectionString
      remoteRef:
        key: appinsights-connection-string
