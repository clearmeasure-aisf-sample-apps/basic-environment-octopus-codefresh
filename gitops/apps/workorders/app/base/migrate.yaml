# gitops/apps/workorders/app/base/migrate.yaml
#
# PreSync hook Job db-migrate (ADR-IR34 decision 1, §7.0 Migrations; CAP-GIT-009, CAP-GIT-010):
# every sync of workorders-app-<env> first migrates the database, then rolls out. The image is
# apps/workorders/db-migrator, pinned by Octopus with the two app images in
# envs/<env>/app/kustomization.yaml, so each release migrates with its own scripts.
#   - The image's entrypoint migrate.sh (containers/apps/workorders/db-migrator) runs the DbUp
#     console `update db <database> /app/scripts <user> <password>` (positional arguments, F9) and
#     retries it until MIGRATION_DB_READY_TIMEOUT_SECONDS: after a wake or on first creation, the
#     database and the logins (PostSync db-init of workorders-db-<env>) may still be starting.
#   - A migration that still fails then fails the Job (backoffLimit 0), the sync and with it the
#     Octopus deployment, while the old pods keep serving.
# TLS: the console validates the server certificate of every non-local server (ADR-IR24); the Job
# trusts platform-internal-ca through SSL_CERT_FILE (ca.crt of Secret db-tls). Checked locally with
# .NET 10 and Microsoft.Data.SqlClient 6.1 on Linux against SQL Server 2022 CU27 Express,
# 2026-09-24 (Q43; V13 confirms in P1-10).
# The password is a process argument until WI-05 (DB_PASSWORD environment variable).
#
# Writer: H (platform owners). Contracts: §7.0 Migrations, ADR-IR34 decisions 1 and 8, ADR-IR24.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    # The last run stays until the next sync, for its log.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Retries happen inside the pod (migrate.sh), within the time budget.
  backoffLimit: 0
  # 10 minutes: a missing image (the bootstrap placeholder tag) fails the hook fast enough for the
  # retry to reach the pinned revision inside the Octopus verification window (900 s).
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # Untagged: the tag comes from envs/<env>/app/kustomization.yaml (§7.6).
          image: <acr-name>.azurecr.io/apps/workorders/db-migrator
          # /app/scripts is where the image keeps the scripts.
          args:
            - update
            - db
            - $(DB_DATABASE)
            - /app/scripts
            - $(DB_USERNAME)
            - $(DB_PASSWORD)
          env:
            - name: MIGRATION_DB_READY_TIMEOUT_SECONDS
              value: "600"
            - name: SSL_CERT_FILE
              value: /etc/platform/ca/ca.crt
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: username
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: database
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-migrator
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ca
              mountPath: /etc/platform/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: ca
          secret:
            secretName: db-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
