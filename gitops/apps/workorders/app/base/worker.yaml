# gitops/apps/workorders/app/base/worker.yaml
#
# Worker (app:src/Worker, in the application repo): NServiceBus endpoint `WorkOrderProcessing` on the SQL Server
# transport. A competing consumer, so never a Rollout (ADR-C3).
#   - replicas: 0 here and in every overlay until enabled: tdd in phase 2, uat in phase 3,
#     prod only after product-owner sign-off (ADR-D16).
#   - No HTTP endpoint, so no probes until WI-04 adds a liveness signal (§7.9). The Deployment carries
#     platform/probe-exempt=true: Kyverno's require-probes (policies/kyverno/base/workload-baseline.yaml)
#     denies a probe-less Deployment in an app namespace otherwise, even at 0 replicas, which fails the
#     whole sync of workorders-app-<env>. Remove the label with the probes of WI-04.
#   - Requires RemotableBus__ApiUrl (it calls ui-server in-cluster; the tenant NetworkPolicy
#     admits traffic within the app's namespaces) and the SQL connection string, composed from
#     Secret db-app as in ui-server.yaml.
# Image: untagged; the tag comes from envs/<env>/app/kustomization.yaml (§7.6).
#
# Writer: H (platform owners). Contracts: §7.0, §7.6, §7.9, ADR-D16, ADR-IR34 decision 8.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: message-handler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/component: message-handler
    platform/probe-exempt: "true"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 0
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/component: message-handler
    spec:
      serviceAccountName: worker
      automountServiceAccountToken: false
      # Time for in-flight messages to finish before the host stops.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # USER $APP_UID in containers/apps/workorders/worker/Dockerfile; entrypoint `dotnet Worker.dll`.
          image: <acr-name>.azurecr.io/apps/workorders/worker
          # Explicit so a missing key stops the pod at creation instead of at first message.
          env:
            - name: RemotableBus__ApiUrl
              valueFrom:
                configMapKeyRef:
                  name: workorders-config
                  key: RemotableBus__ApiUrl
            - name: DB_APP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
            - name: ConnectionStrings__SqlConnectionString
              value: Server=tcp:db,1433;Database=workorders;User ID=$(DB_APP_USERNAME);Password=$(DB_APP_PASSWORD);Encrypt=True;TrustServerCertificate=True;
          envFrom:
            - configMapRef:
                name: workorders-config
            - secretRef:
                name: workorders-app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # NServiceBus startup diagnostics (N5, ADR-IR31) [VERIFY the path in the phase-2 spike].
            - name: nsb-diagnostics
              mountPath: /app/.diagnostics
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: nsb-diagnostics
          emptyDir:
            sizeLimit: 16Mi
