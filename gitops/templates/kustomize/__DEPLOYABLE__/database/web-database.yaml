# Database settings of web (login <app>_app, roles db_datareader and db_datawriter).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      containers:
        - name: web
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
