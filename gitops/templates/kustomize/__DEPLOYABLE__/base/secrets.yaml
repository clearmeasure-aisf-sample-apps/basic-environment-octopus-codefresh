# App secrets from the app vault kv-<app>-<e>-<hash4> through ClusterSecretStore <app>-<env>, which the
# tenant chart renders; no identity lives in the namespace (ADR-IR34 decision 6).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
  annotations:
    # Before the Deployment that reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    # <app>-<env>, set by envs/<env>/<deployable>/config.
    name: <app>-set-by-environment
  target:
    name: web-secrets
    creationPolicy: Owner
  data:
    # Every app vault holds appinsights-connection-string. The descriptor's secrets[] names become
    # further vault keys: map each to an environment variable here.
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: appinsights-connection-string
