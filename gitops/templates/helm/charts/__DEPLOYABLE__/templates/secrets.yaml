# App secrets from the app vault kv-<app>-<e>-<hash4> through ClusterSecretStore <app>-<env> (tenant chart;
# ADR-IR34 decision 6). Every app vault holds appinsights-connection-string; the descriptor's secrets[]
# names become further vault keys: map each to an environment variable here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: web-secrets
  labels:
    {{- include "starter.labels" . | nindent 4 }}
  annotations:
    # Before the Deployment that reads it.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ required "secretStore (<app>-<env>) is set in envs/<env>/<deployable>/values.yaml" .Values.secretStore | quote }}
  target:
    name: web-secrets
    creationPolicy: Owner
  data:
    - secretKey: APPLICATIONINSIGHTS_CONNECTION_STRING
      remoteRef:
        key: appinsights-connection-string
