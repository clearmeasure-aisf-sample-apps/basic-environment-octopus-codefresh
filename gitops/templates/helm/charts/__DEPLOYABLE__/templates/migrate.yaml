{{- if .Values.database.enabled }}
# PreSync hook Job db-migrate (ADR-IR34 decision 1; CAP-GIT-009, CAP-GIT-010): every sync first runs the
# migrator of the pinned release as login <app>_migrator, then rolls out web. A failed migration fails the
# Job and the sync; the old pods keep serving. Secrets db-migrator and db-tls come from Application
# <app>-db-<env>.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
    app.kubernetes.io/component: migration
    {{- include "starter.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    # The last run stays until the next sync, for its log.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  # Retries happen inside the migrator (MIGRATION_DB_READY_TIMEOUT_SECONDS), within the deadline.
  backoffLimit: 0
  # 10 minutes: a missing image (the bootstrap placeholder tag) fails the hook fast enough for the
  # retry to reach the pinned revision inside the Octopus verification window (900 s).
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: db-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "starter.image" (dict "name" "migrator" "image" .Values.migrator) | quote }}
          env:
            - name: MIGRATION_DB_READY_TIMEOUT_SECONDS
              value: {{ .Values.database.readyTimeoutSeconds | quote }}
            - name: SSL_CERT_FILE
              value: /etc/platform/ca/ca.crt
            {{- include "starter.dbEnv" (dict "secret" "db-migrator") | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: ca
              mountPath: /etc/platform/ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # platform-internal-ca, the issuer of the database server certificate.
        - name: ca
          secret:
            secretName: db-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
