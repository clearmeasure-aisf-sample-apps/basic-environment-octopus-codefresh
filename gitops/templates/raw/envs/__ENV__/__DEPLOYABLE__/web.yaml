# Deployable <deployable> of <app> in <env>: Deployment web, rolling update without downtime, probes on
# /healthz (port 8080). Octopus rewrites only the image tag (a version or 0.0.0-bootstrap).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: <acr-name>.azurecr.io/apps/<app>/web:0.0.0-bootstrap
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: APP_ENVIRONMENT
              value: <env>
            - name: APPLICATIONINSIGHTS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: web-secrets
                  key: APPLICATIONINSIGHTS_CONNECTION_STRING
            # Database settings (login <app>_app). An app without a database removes them.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: database
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-app
                  key: password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
