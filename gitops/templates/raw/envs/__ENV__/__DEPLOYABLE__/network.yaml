# Exposure: HTTPRoute web on the HTTPS listener of namespace <namespace>, ListenerSet <namespace> in
# platform-ingress (tenant chart; Let's Encrypt certificate; HTTP redirects to HTTPS at the Gateway).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: <namespace>
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/component: web
spec:
  # No hostnames: the route serves the host of its listener, <namespace>.<apps-domain-<tier>>.
  # A host name, if listed, must start with the namespace name (CAP-GIT-013).
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      namespace: platform-ingress
      name: <namespace>
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          port: 8080
