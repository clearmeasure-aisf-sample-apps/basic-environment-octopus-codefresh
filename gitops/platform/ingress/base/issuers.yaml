# gitops/platform/ingress/base/issuers.yaml
#
# ClusterIssuers of §7.0 Ingress:
#   letsencrypt-http01    Let's Encrypt production, HTTP-01 through Gateway platform-gateway
#                         (listener http). One certificate per host <app>-<env>.<apps-domain-<tier>>,
#                         requested by the tenant chart's ListenerSets (cert-manager 1.20+
#                         ListenerSet support). No account e-mail: Let's Encrypt no longer sends
#                         expiry mail, and the field is optional. Limit: 50 certificates a week per
#                         <ingress-ip-dashed-<tier>>.sslip.io [VERIFY Q48].
#   platform-internal-ca  CA issuer for in-cluster TLS (database server certificates, db-tls). Its
#                         root is Certificate platform-internal-ca in namespace cert-manager, issued
#                         once by the bootstrap issuer platform-selfsigned. Each cluster has its own
#                         root; a rebuilt cluster issues a new one and every db-tls follows.
#
# Writer: H (platform owners). Contracts: §7.0 Ingress and Database, ADR-IR34 decisions 8 and 21.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-http01
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-http01-account
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - group: gateway.networking.k8s.io
                kind: Gateway
                name: platform-gateway
                namespace: platform-ingress
                sectionName: http
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: platform-internal-ca
  # The cluster resource namespace of cert-manager: where CA ClusterIssuers read their secret.
  namespace: cert-manager
spec:
  isCA: true
  commonName: platform-internal-ca
  secretName: platform-internal-ca
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: platform-selfsigned
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: platform-internal-ca
spec:
  ca:
    secretName: platform-internal-ca
