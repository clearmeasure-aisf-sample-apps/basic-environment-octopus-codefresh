# yamllint disable-file
{{- /*
ClusterSecretStore <app>-<env> per app-environment (ADR-IR34 decision 6; CAP-GIT-004, CAP-GIT-007).
  - Reads the app vault kv-<app>-<e>-<hash4> (decision 8; created by terraform/apps/tier) as the
    tier's ESO controller identity id-eso-platform-<tier> (service account
    external-secrets/external-secrets; Key Vault Secrets User on rg-platform-<tier>-apps).
  - Conditions admit only the app-environment's namespaces and platform-backup (the backup Jobs'
    sa password). An ExternalSecret elsewhere that names this store is refused by ESO.
  - Apps cannot create stores: app-<app> denies SecretStore and ClusterSecretStore.
*/ -}}
{{- include "tenant.validate" . }}
{{- $app := .Values.name }}
{{- range $env := include "tenant.envs" . | fromJsonArray }}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "%s-%s" $app $env }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
    environment: {{ $env }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  conditions:
    - namespaces:
        {{- range $namespace := include "tenant.namespaces" (dict "root" $ "env" $env) | fromJsonArray }}
        - {{ $namespace }}
        {{- end }}
        - platform-backup
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: {{ printf "https://%s.vault.azure.net" (include "tenant.vaultName" (dict "root" $ "env" $env)) | quote }}
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
{{- end }}
