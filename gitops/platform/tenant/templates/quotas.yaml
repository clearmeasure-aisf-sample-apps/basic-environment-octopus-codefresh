# yamllint disable-file
{{- /*
ResourceQuota and LimitRange `tenant` in every app namespace (§7.0 Quotas; CAP-GIT-006).
Default per namespace: 4 GiB of memory requests, 2 CPU of requests, 3 claims, 50 GiB of storage,
no LoadBalancer or NodePort Service. Descriptor `quotas` may only lower the numbers (the chart takes
the smaller value). Requests, not limits, are counted, so rolling updates and hook Jobs fit.
The LimitRange gives containers without resources a default request and memory limit and caps a
single container at platform.limitRange.maxMemory, so one pod cannot take a node.
*/ -}}
{{- include "tenant.validate" . }}
{{- $quota := include "tenant.quota" . | fromJson }}
{{- $limits := .Values.platform.limitRange }}
{{- range $env := include "tenant.envs" . | fromJsonArray }}
{{- range $namespace := include "tenant.namespaces" (dict "root" $ "env" $env) | fromJsonArray }}
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant
  namespace: {{ $namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
    environment: {{ $env }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  hard:
    requests.memory: {{ printf "%dMi" (int $quota.memoryMi) | quote }}
    requests.cpu: {{ printf "%dm" (int $quota.cpuMilli) | quote }}
    persistentvolumeclaims: {{ printf "%d" (int $quota.pvcs) | quote }}
    requests.storage: {{ printf "%dGi" (int $quota.storageGi) | quote }}
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant
  namespace: {{ $namespace }}
  labels:
    {{- include "tenant.labels" $ | nindent 4 }}
    environment: {{ $env }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: {{ $limits.defaultRequestCpu | quote }}
        memory: {{ $limits.defaultRequestMemory | quote }}
      default:
        memory: {{ $limits.defaultLimitMemory | quote }}
      max:
        memory: {{ $limits.maxMemory | quote }}
{{- end }}
{{- end }}
