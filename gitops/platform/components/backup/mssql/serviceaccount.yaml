# gitops/platform/components/backup/mssql/serviceaccount.yaml
#
# Identity of the backup and restore Jobs. The add-on Application of each cluster sets
# azure.workload.identity/client-id to the client ID of id-db-backup-<tier>.
# Writer: H (platform owners). Contracts: §7.0 Identities.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
  labels:
    app.kubernetes.io/name: db-backup
# The Jobs mount only the projected workload identity token; no Kubernetes API access.
automountServiceAccountToken: false
