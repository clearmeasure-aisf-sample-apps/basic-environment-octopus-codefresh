# gitops/platform/components/db/mssql-2022-express/kustomization.yaml
#
# Platform database component: SQL Server 2022 Express in a pod (ADR-IR34 decisions 1, 8; §7.0
# Database). Opt-in per app: gitops/apps/<app>/envs/<env>/db/kustomization.yaml lists this
# component plus one db-credentials component, and the tenant chart renders Application
# <app>-db-<env> for that folder (label platform/role: database, Octopus scope of the app, never pinned).
#
# Objects: Services db (1433) and db-hl (headless), StatefulSet db, Certificate db-tls from
# ClusterIssuer platform-internal-ca, PostSync Job db-init (database and SQL logins).
#
# Input: ConfigMap db-settings, generated by the app's db folder (literals, all required):
#   DB_NAME            the database, <app> (apps/schema.json)
#   DB_MIGRATOR_USER   <app>_migrator: db_owner, used by the app's PreSync migration Job
#   DB_APP_USER        <app>_app: DB_APP_ROLES plus EXECUTE, used by the app
#   DB_APP_ROLES       space-separated database roles of DB_APP_USER, for example
#                      "db_datareader db_datawriter"
#   DB_SECRET_STORE    ClusterSecretStore <app>-<env> (read by the db-credentials components)
#   DB_VOLUME          PersistentVolume disk-<app>-<env>-db, rendered by the tenant chart; the
#                      claim binds to it only, so a missing volume leaves the claim Pending and
#                      never provisions an empty disk (Q38)
#
# Contract for workloads in the namespace: Service db:1433; Secrets db-migrator and db-app with
# keys host, port, database, username, password; Secret db-tls key ca.crt (the CA to trust,
# SSL_CERT_FILE, Q43). Pods: app.kubernetes.io/component=database, which the tenant NetworkPolicies
# open to platform-backup (and octopus-worker-<env> on opt-in).
#
# Writer: H (platform owners). Contracts: §7.0 Database and Storage, ADR-IR34 decisions 1, 8, 11.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - db.yaml
  - db-init.yaml
replacements:
  # The claim binds only to the static PersistentVolume of this app-environment.
  - source:
      kind: ConfigMap
      name: db-settings
      fieldPath: data.DB_VOLUME
    targets:
      - select:
          group: apps
          kind: StatefulSet
          name: db
        fieldPaths:
          - spec.volumeClaimTemplates.0.spec.volumeName
