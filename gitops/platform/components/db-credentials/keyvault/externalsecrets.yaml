# gitops/platform/components/db-credentials/keyvault/externalsecrets.yaml
#
# Sync wave -1: Argo CD applies the StatefulSet (wave 0) only after the three Secrets are synced.
# The store name, database and user names are set by the component's replacements.
# Writer: H (platform owners). Contracts: §7.0 Database, §7.8.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-sa
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: DB_SECRET_STORE
  target:
    name: db-sa
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: db
        port: "1433"
        database: master
        username: sa
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-sa-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migrator
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: DB_SECRET_STORE
  target:
    name: db-migrator
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: db
        port: "1433"
        database: DB_NAME
        username: DB_MIGRATOR_USER
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-migrator-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-app
  labels:
    app.kubernetes.io/name: db
    app.kubernetes.io/component: database
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: DB_SECRET_STORE
  target:
    name: db-app
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        host: db
        port: "1433"
        database: DB_NAME
        username: DB_APP_USER
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: db-app-password
