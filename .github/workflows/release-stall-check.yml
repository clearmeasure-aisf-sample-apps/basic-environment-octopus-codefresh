# Alert-only workflow: tells people when a release stalls between environments (issue #86). The second GitHub Actions
# workflow of this repository, admitted by tool-boundary rule TB24 as alert-only (docs/tool-boundaries.md, section
# "Release stall alert"): it reads the pin commits of main and writes GitHub issues, and nothing else. It builds nothing,
# deploys nothing and reaches no cluster, registry or cloud, and it changes no file and no Octopus or Argo CD state.
#
# Every hour it runs scripts/release/release-stall-check.ps1 -Issues, which holds all the logic:
# - a release that is pinned in one environment, not in the next one, for longer than the threshold (90 minutes; the
#   prod weekend freeze does not count) gets ONE issue "Release <version> of <app> has not left <environment>";
# - an open issue of this workflow whose release moved on (pinned in the next environment, replaced by a newer release,
#   rolled back) gets a comment saying which, and is closed.
#
# Credential: the default GITHUB_TOKEN only, at contents: read and issues: write. No secret is read. The checkout is
# pinned to a full commit SHA and keeps no credential in the work tree (persist-credentials: false). The triggers are
# the schedule and a manual run: no pull request, issue or push event starts it, so no fork code ever runs here.
# An issue written with GITHUB_TOKEN starts no other workflow (GitHub's rule), so project-board.yml does not see it.
name: release-stall-check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be opened or closed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: release-stall-check
  cancel-in-progress: false

jobs:
  check:
    name: Report stalled releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pin history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile the stall issues
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: ./scripts/release/release-stall-check.ps1 -Issues -Ref origin/main -DryRun:($env:DRY_RUN -eq 'true')
