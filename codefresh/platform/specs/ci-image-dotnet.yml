# Pipeline spec: platform-env/ci-image-dotnet (contract §7.0 "Codefresh"; §11.8: replaces
# workorders/ci-image). Registered by codefresh/register.sh --full.
# Run it once by hand in P1-05 to mint the first <ci-image-version>.
version: "1.0"
kind: pipeline
metadata:
  name: platform-env/ci-image-dotnet
  project: platform-env
spec:
  triggers:
    - type: git
      name: ci-image-change
      description: Pushes to main of the environment repo that change a platform tool image
      repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
      provider: github
      context: github-aisf-sample-apps
      events:
        - push.heads
      branchRegex: /^main$/
      branchRegexInput: regex
      # Glob relative to the repository root (git trigger "modified files").
      modifiedFilesGlob: "containers/platform/**"
      pullRequestAllowForkEvents: false
      disabled: false
  # Weekly rebuild for patched packages; cron expressions are UTC [VERIFY Q41].
  cronTriggers:
    - name: weekly-rebuild
      type: cron
      expression: "0 6 * * 1"
      message: weekly rebuild of platform/ci-dotnet and platform/db-tools-mssql
      branch: main
      disabled: false
  # No contexts: the image build needs no secret. Registry integration acr-platform-ci is
  # named by the build step.
  contexts: []
  runtimeEnvironment:
    name: aks-platform-build/codefresh
  specTemplate:
    location: git
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    path: codefresh/platform/pipelines/ci-image-dotnet.yml
    revision: main
    context: github-aisf-sample-apps
  # Builds queue; each produces its own tag.
  concurrency: 1
