# platform-env/conformance-arm: arms a conformance run (ADR-IR34 "Test harness", Scheduling;
# §11.7.1 item 4). Cron on weekdays at 07:00 UTC (01:00 or 02:00 America/Chicago) and manual;
# spec codefresh/platform/specs/conformance-arm.yml.
#   1. mints the run ID (PLATFORM_RUN_ID, unless the run passes one);
#   2. force-sleeps both app clusters through runbook env-sleep (platform-infrastructure,
#      Sleep.Force=true), waits until both are Stopped and the stop has settled, at most
#      CONFORMANCE_STOP_GRACE_MINUTES (E50);
#   3. holds the hourly env-sleep for the run: runbook sleep-hold in both tiers (Sleep.HoldMinutes
#      CONFORMANCE_HOLD_MINUTES, default 480; Sleep.HoldBy conformance:<run id>); no hold, no run;
#   4. pushes the run's sandbox commits to <sandbox-app-repo>: a failing-test branch, a green
#      branch and a release commit on main (the canary), which queue sandbox/ci and sandbox/release;
#   5. queues platform-env/conformance with the run ID and the commit SHAs. With one build at a
#      time (BASIC_1) the sandbox builds run before it [VERIFY Q41].
# The work is codefresh/platform/scripts/conformance-arm.ps1; this file only wires it.
#
# Contexts (spec): platform-octopus (runbook runs), platform-conformance (the GitHub App aisf-conformance,
# AISF_CONFORMANCE_APP_*, whose installation token is minted for the sandbox pushes; sp-platform-conformance for the
# power state). Never deploys: the runbooks and
# the sandbox's own pipelines do the work.
# Placeholders: acrplatformi3aldz, 20260924.2333-f91765f, 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 (platform/ci-dotnet).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - arm

steps:
  main_clone:
    title: Clone the environment repo (main)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    depth: 1

  arm:
    title: Force-sleep, push the sandbox commits, queue platform-env/conformance
    stage: arm
    image: "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    working_directory: "${{main_clone}}"
    # Two runbook waits (60 minutes each, in parallel), the Stopped wait (30), the grace (15) and two
    # sleep-hold runs (10 each, one after the other).
    timeout: 140m
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
    commands:
      - pwsh -NoProfile -File codefresh/platform/scripts/conformance-arm.ps1
