# platform-env/conformance-destructive: the destructive capability tests, nonprod only (ADR-IR34
# "Test harness"; §11.7.1 item 4). Cron on Sunday at 08:00 UTC and manual; spec
# codefresh/platform/specs/conformance-destructive.yml. TEST_FILTER defaults to
# TestCategory=Destructive&TestCategory=NonProd: stopped clusters, deleted objects and the other
# state changes the harness restores through its cleanup registry. The harness rejects any
# destructive test that is not NonProd, and no destructive capability has tier prod.
#   run       dotnet build and test of tests/Platform.Conformance.sln with TEST_FILTER, TRX only
#             (no JUnit), then Platform.Conformance.Report: summary.md and summary.json in the log
#             and as build annotations (counts and failed capability IDs);
#   publish   TRX and summaries to branch conformance-results of <sandbox-app-repo>
#             (results/<date>-<run id>/);
#   teardown  force-sleeps the clusters the run woke, unless CONFORMANCE_SLEEP_AFTER=false.
# A failed test fails the build (strict_fail_fast); publish and teardown still run.
# Results stay on the build volume under conformance/<build id> (the newest 10 are kept).
#
# Contexts (spec): platform-octopus, platform-conformance. Never deploys by itself.
# Placeholders: acrplatformi3aldz, 20260924.2333-f91765f, 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 (platform/ci-dotnet).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - test
  - report

steps:
  main_clone:
    title: Clone the environment repo (main)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    depth: 1

  run:
    title: dotnet test (TEST_FILTER) and the capability report
    stage: test
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    working_directory: "${{main_clone}}"
    # Suite budget: each live test carries its own [CancelAfter]; this bounds the whole run.
    timeout: 4h
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
    commands:
      # Exports CONFORMANCE_RESULTS_DIR and keeps the newest 10 results folders on the volume.
      - >-
        pwsh -NoProfile -File codefresh/platform/scripts/conformance-run.ps1
        -ResultsDirectory "${{CF_VOLUME_PATH}}/conformance/${{CF_BUILD_ID}}" -KeepResults 10

  publish:
    title: Push the results to conformance-results of the sandbox repo
    stage: report
    image: *ci_dotnet
    registry_context: acr-platform-pull
    working_directory: "${{main_clone}}"
    fail_fast: false
    when:
      steps:
        - name: run
          on:
            - finished
    commands:
      - pwsh -NoProfile -File codefresh/platform/scripts/conformance-publish.ps1 -ResultsDirectory "${CONFORMANCE_RESULTS_DIR}"

  teardown:
    title: Force-sleep the clusters the run woke
    stage: report
    image: *ci_dotnet
    registry_context: acr-platform-pull
    working_directory: "${{main_clone}}"
    timeout: 45m
    fail_fast: false
    when:
      steps:
        - name: run
          on:
            - finished
    commands:
      - pwsh -NoProfile -File codefresh/platform/scripts/conformance-teardown.ps1 -ResultsDirectory "${CONFORMANCE_RESULTS_DIR}"
