# platform-env/env-checks: every check of the environment repo, on every branch push (contract
# §7.0 "Codefresh"; ADR-IR34 §11.7.1 item 3). Its status codefresh/env-checks is required on `main`.
#
# Spec codefresh/platform/specs/env-checks.yml. Git integration github-aisf-sample-apps (read,
# trigger, status); runtime <cf-runtime>; no contexts; nothing is published and nothing is
# written back.
#
# One step per scripts/checks/validate-all.ps1 sub-command (docs/scripting.md), each on
# platform/ci-dotnet, which carries pwsh 7 and every tool the checks need. CI=true on every step
# turns a missing tool into a failure. `mermaid` stays local-only (it needs a Node validator).
# The `dotnet` step runs the Offline category of tests/Platform.Conformance.sln (TRX only), which
# holds the tool-boundary rules (Kit.Boundaries), the consistency checks against the contracts and
# descriptors (Kit.Consistency) and, with the full history of main_clone, the bot-path audit (PLATFORM_BOT_AUTHORS, a variable of the spec, not re-mapped here, so an unset
# variable can never arrive as literal text); then the onboarding tool's `check` and the freshness
# of docs/capabilities.md (ADR-IR34 "Capability catalogue"). `diagrams_syntax` parses every
# design diagram in the plantuml/plantuml image that scripts/diagrams/render.ps1 pins.
#
# platform/ci-dotnet is pinned by tag and digest; a commit after each platform-env/ci-image-dotnet
# build moves the pin in every pipeline.
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - checks

steps:
  main_clone:
    title: Clone the environment repo (full history for the bot-path audit)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: "${{CF_REVISION}}"
    git: github-aisf-sample-apps

  yaml:
    title: yamllint (.yamllint.yaml)
    stage: checks
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: &after_clone
      steps:
        - name: main_clone
          on:
            - success
    environment:
      - CI=true
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 yaml

  kustomize:
    title: kustomize build of every overlay
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
      # Each rendering step gets its own folder: the steps run in parallel.
      - "RENDER_DIR=${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh-render/kustomize"
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 kustomize

  kubeconform:
    title: kubeconform on rendered overlays and Argo CD manifests
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
      - "RENDER_DIR=${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh-render/kubeconform"
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 kubeconform

  terraform:
    title: terraform fmt -check
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 terraform

  diagrams:
    title: Design diagrams rendered, current and embedded
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
      # diagrams_syntax parses the sources in the PlantUML image.
      - DIAGRAMS_SYNTAX=skip
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 diagrams

  diagrams_syntax:
    title: PlantUML syntax of every design diagram
    stage: checks
    # The PlantUML release that scripts/diagrams/render.ps1 pins (Ubuntu, Java 21).
    image: "plantuml/plantuml:1.2026.8@sha256:d08610df482510844382caa4e016ba2bf7e3231f630f02ee12f250f3416c62b1"
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    commands:
      - java -jar /opt/plantuml.jar -checkonly design/diagrams/*.puml

  powershell:
    title: PSScriptAnalyzer and the script preamble (docs/scripting.md)
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 powershell

  secrets:
    title: Gitleaks (.gitleaks.toml)
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
    commands:
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 secrets

  dotnet:
    title: Offline conformance tests (boundaries, contracts, bot-path audit), onboarding check, catalogue freshness
    stage: checks
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when: *after_clone
    environment:
      - CI=true
      - "TEST_RESULTS_DIR=${{CF_VOLUME_PATH}}/env-checks/${{CF_BUILD_ID}}/offline"
    commands:
      # All three run; the step fails if any fails.
      - pwsh -NoProfile -File scripts/checks/validate-all.ps1 dotnet-offline onboarding catalogue
