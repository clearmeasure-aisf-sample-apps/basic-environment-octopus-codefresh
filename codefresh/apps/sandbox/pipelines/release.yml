# sandbox/release: the release build of the conformance fixture app (contract §7.0
# "Conformance" and "Handshake"; CAP-CF-006 to CAP-CF-009). Scaffolded from the multi-image
# starter, then owned by the platform (ADR-IR34 §11.7.1 item 7). Triggered by pushes to main of
# clearmeasure-aisf-sample-apps/platform-sandbox, including the release commits that platform-env/conformance-arm pushes.
#
# Flow:
#   1. prepare: VERSION = 0.1.<first-parent height of main> (scripts/version.ps1).
#   2. wake_nonprod: env-wake in infra-nonprod, early and non-blocking (CAP-CF-009).
#   3. build_test: build and unit tests (TRX).
#   4. stage_images; web_image and migrator_image push apps/sandbox/{web,migrator} (M1) and sign
#      keyless (M2). The marker toggles/failing-migration ships a failing script (CAP-GIT-010).
#   5. supply_chain: SBOM and provenance attestations; tag lock (CAP-CF-006, CAP-CF-007).
#   6. Handoff (M3): one Octopus release of project sandbox, channel Default, numbered VERSION,
#      with explicit packages and --ignore-existing, so a rerun creates none (CAP-CF-008).
# It never deploys (M4). The images apps/sandbox/unsigned:0.0.0-fixture come from
# platform-env/fixtures, never from here.
#
# Placeholders: acrplatformi3aldz, 20260924.2333-f91765f, 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 (platform/ci-dotnet).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - prepare
  - wake
  - test
  - images
  - supply-chain
  - handoff

steps:
  main_clone:
    title: Clone the sandbox repo at the triggering commit (full history)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: "${{CF_REPO_OWNER}}/${{CF_REPO_NAME}}"
    revision: "${{CF_REVISION}}"
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/app"

  platform_clone:
    title: Clone the environment repo (main) for the pipeline scripts
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    depth: 1

  prepare:
    title: Version and artifact folder
    stage: prepare
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
        - name: platform_clone
          on:
            - success
    environment:
      - RELEASE_BRANCH=main
    # scripts/prepare.ps1 exports VERSION and ARTIFACTS_DIR, the per-build artifact folder (the ten
    # newest build folders are kept on the volume).
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/prepare.ps1"

  # ---------------------------------------------------------------- early wake (release only)
  # ADR-IR33: run runbook env-wake of project platform-infrastructure in infra-nonprod,
  # fire-and-forget, in parallel with the gates, when this build will release. Non-blocking
  # three times over: fail_fast false, no strict_fail_fast, and every path exits 0. A missed
  # wake costs only time: step 0 of the tdd deployment (Deploy a Release of platform-wake)
  # wakes the cluster and waits. env-wake is idempotent.
  # Credential: the Space Manager key of context platform-octopus, sent from a private header
  # file so that it never appears in a process list or the log. The runbook is config as code,
  # so the run route carries the Git ref (refs/heads/main) of the Octopus project [VERIFY:
  # Octopus's RunConfigAsCodeRunbook.ps1 example is marked early access].
  wake_nonprod:
    title: Wake the nonprod cluster early (runbook env-wake, non-blocking)
    stage: wake
    image: *ci_dotnet
    registry_context: acr-platform-pull
    timeout: 3m
    fail_fast: false
    when:
      branch:
        only:
          - main
      steps:
        - name: prepare
          on:
            - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/wake-nonprod.ps1"

  build_test:
    title: Build and unit tests (TRX)
    stage: test
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: prepare
          on:
            - success
    environment:
      - "NUGET_PACKAGES=${{CF_VOLUME_PATH}}/.nuget/packages"
    commands:
      - dotnet build Sandbox.sln --configuration Release -p:Version="${VERSION}" -p:InformationalVersion="${VERSION}"
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/run-tests.ps1" -Title "sandbox/release ${VERSION}"

  stage_images:
    title: Stage the web and migrator contexts
    stage: test
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: build_test
          on:
            - success
    environment:
      - "NUGET_PACKAGES=${{CF_VOLUME_PATH}}/.nuget/packages"
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/stage-images.ps1" -Out "${CF_VOLUME_PATH}/image-contexts"

  # A re-run of a release for the same commit finds VERSION and sha-<commit> pushed, signed,
  # attested and locked by the first run, and a push to a locked tag fails. image_reuse then
  # skips the image builds and supply_chain, and supply_chain_reuse confirms the lock instead, so
  # the re-run goes on to the handoff. supply-chain.ps1 -CheckReuse answers reuse or build,
  # and fails on a mixed state (some tags locked, others not), for example two commits that
  # computed the same VERSION.
  image_reuse:
    title: Reuse the released images when VERSION is already locked (re-run)
    stage: images
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: stage_images
          on:
            - success
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/supply-chain-step.ps1"
        -Step image_reuse -Repository apps/sandbox/web,apps/sandbox/migrator

  web_image:
    title: Build, push and sign apps/sandbox/web
    type: build
    stage: images
    working_directory: "${{CF_VOLUME_PATH}}/image-contexts/web"
    dockerfile: Dockerfile
    image_name: apps/sandbox/web
    # The primary tag; without it Codefresh also pushes the branch name (master).
    tag: "${{VERSION}}"
    tags: &release_tags
      - "${{VERSION}}"
      - "sha-${{CF_SHORT_REVISION}}"
    registry: acr-apps-release
    build_arguments: &oci_build_arguments
      - "VERSION=${{VERSION}}"
      - "REVISION=${{CF_REVISION}}"
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when: &build_images
      steps:
        - name: image_reuse
          on:
            - success
      condition:
        all:
          imagesNotReused: '"${{IMAGES_REUSED}}" == "false"'

  migrator_image:
    title: Build, push and sign apps/sandbox/migrator
    type: build
    stage: images
    working_directory: "${{CF_VOLUME_PATH}}/image-contexts/migrator"
    dockerfile: Dockerfile
    image_name: apps/sandbox/migrator
    # The primary tag; without it Codefresh also pushes the branch name (master).
    tag: "${{VERSION}}"
    tags: *release_tags
    registry: acr-apps-release
    build_arguments: *oci_build_arguments
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when: *build_images

  supply_chain:
    title: SBOM and provenance attestations, tag lock
    stage: supply-chain
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: web_image
          on:
            - success
        - name: migrator_image
          on:
            - success
    # The cf-apps-release token of context platform-registry, as a step-local Docker config.
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/supply-chain-step.ps1"
        -Step supply_chain -Repository apps/sandbox/web,apps/sandbox/migrator

  # The reuse path of a re-run (image_reuse answered reuse): the image builds and supply_chain do not
  # run; this step confirms again that every tag is locked (the first run's supply chain completed)
  # and names the digests the handoff releases. Its condition is the complement of the image steps'
  # ("${{IMAGES_REUSED}}" != "false"), so exactly one of supply_chain and supply_chain_reuse runs.
  supply_chain_reuse:
    title: Confirm the reused images are signed, attested and locked (re-run)
    stage: supply-chain
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: image_reuse
          on:
            - success
      condition:
        all:
          imagesReused: '"${{IMAGES_REUSED}}" != "false"'
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/supply-chain-step.ps1"
        -Step supply_chain_reuse -Repository apps/sandbox/web,apps/sandbox/migrator

  # ---------------------------------------------------------------- handoff (M3)
  # The Space Manager key of context platform-octopus reaches the Octopus CLI through its
  # environment only (§7.0 decision 4).
  octopus_preflight:
    title: Check the Octopus context and CLI (no network call)
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    # Either path: the image builds with supply_chain, or supply_chain_reuse on a re-run.
    when:
      steps:
        any:
          - name: supply_chain
            on:
              - success
          - name: supply_chain_reuse
            on:
              - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/octopus-preflight.ps1"

  octopus_build_info:
    title: Push build information
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: octopus_preflight
          on:
            - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/sandbox/scripts/buildinfo.ps1" -Out "${ARTIFACTS_DIR}/octopus-buildinfo.json" -ReleaseNotesOut "${ARTIFACTS_DIR}/octopus-release-notes.md"
      - >-
        octopus build-information upload --space "${OCTOPUS_SPACE_ID}"
        --package-id apps/sandbox/web
        --package-id apps/sandbox/migrator
        --version "${VERSION}"
        --file "${ARTIFACTS_DIR}/octopus-buildinfo.json"
        --overwrite-mode overwrite
        --no-prompt

  octopus_release:
    title: Create Octopus release VERSION (project sandbox, channel Default)
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: octopus_build_info
          on:
            - success
    # Explicit packages and no default package version (step 0 deploys platform-wake);
    # --ignore-existing: a rerun of the same commit creates no second release (CAP-CF-008).
    commands:
      - |-
        octopus release create --space "${OCTOPUS_SPACE_ID}" \
          --project sandbox \
          --channel Default \
          --version "${VERSION}" \
          --package "apps\/sandbox\/web:${VERSION}" \
          --package "apps\/sandbox\/migrator:${VERSION}" \
          --git-ref refs/heads/main \
          --release-notes-file "${ARTIFACTS_DIR}/octopus-release-notes.md" \
          --ignore-existing \
          --no-prompt

hooks:
  on_finish:
    exec:
      image: "alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8"
      commands:
        - cat "${{CF_VOLUME_PATH}}/artifacts/${{CF_BUILD_ID}}/test-summary.md" 2>/dev/null || echo "No test summary was written."
        # Shell variables with defaults: a build that stops before prepare has no VERSION, and an
        # unresolved ${{VERSION}} reaches /bin/sh as a bad substitution.
        - echo "sandbox/release ${VERSION:-(no version)} for ${CF_REVISION:-(no revision)}"
