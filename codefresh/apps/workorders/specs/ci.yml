# Pipeline spec: workorders/ci (contract §7.0 "Codefresh"; ADR-C6, ADR-IR26).
# Registered by codefresh/register.sh (--full or --app workorders), which creates or replaces
# it by name and sets runtimeEnvironment. Field names follow the Codefresh pipeline spec
# (https://codefresh-io.github.io/cli/pipelines/spec/) and the JSON tags of
# codefresh-io/terraform-provider-codefresh (codefresh/cfclient/pipeline.go).
#
# The trigger watches the app repo; the YAML loads from `main` of the environment repo, which
# app-repo branch authors cannot change (ADR-D18).
version: "1.0"
kind: pipeline
metadata:
  name: workorders/ci
  project: workorders
spec:
  triggers:
    - type: git
      name: branch-push
      description: Every same-repo branch push of the app repo except master; posts codefresh/ci, the required status
      repo: clearmeasure-aisf-sample-apps/20260923-001
      provider: github
      # The stored Git integration of the org: read, trigger and commit status.
      context: github-aisf-sample-apps
      events:
        - push.heads
      # Negative lookahead is supported by the branch filter [VERIFY].
      branchRegex: "/^(?!master$).+/"
      branchRegexInput: regex
      # Fork pull requests never start a pipeline (handshake; CAP-CF-005): a maintainer pushes
      # a reviewed fork's commits to a branch of the app repo, and this trigger reports on them.
      pullRequestAllowForkEvents: false
      commitStatusTitle: codefresh/ci
      disabled: false
  # App-owned, optional (§7.0): the CI-only AI key of app #1. register.sh leaves it off while
  # it does not exist; the LLM tests then skip.
  contexts:
    - app-workorders-ci
  runtimeEnvironment:
    name: aks-platform-build/codefresh
  specTemplate:
    location: git
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    path: codefresh/apps/workorders/pipelines/ci.yml
    revision: main
    context: github-aisf-sample-apps
  # A newer build cancels the older builds of the same branch (terraform
  # termination_policy.on_create_branch maps to type branch, event onCreate).
  terminationPolicy:
    - type: branch
      event: onCreate
