# workorders/ci: the gates of app #1 for every same-repo branch push except master.
#
# Contracts: §7.0 "Codefresh" (runtime <cf-runtime>, context app-workorders-ci), §7.7 (gate step
# names), ADR-C6 and ADR-IR26 (codefresh/ci is the only required status of the app repo).
# Nothing is published: no image, no package, no Octopus call, no deploy (handshake M4).
#
# Layout (ADR-D18, ADR-IR34 decision 19): the spec codefresh/apps/workorders/specs/ci.yml,
# this YAML and the scripts live in the environment repo; the spec loads this file from
# `main`, and platform_clone checks out `main` for the scripts. The trigger watches the app
# repo clearmeasure-aisf-sample-apps/20260923-001; main_clone checks out the triggering commit.
#
# The build is app #1's own, as its GitHub workflow runs it: dot-source build.ps1, then call
# its functions (Build, Build -UseSqlite, Invoke-AcceptanceTests), then the CRAP audit.
# SQL Server 2022 runs in the build's Docker daemon (dind) as a step service container that
# shares the step's network, so build.ps1 reaches it on localhost through its external-server
# switch (SQL_EXTERNAL=true), exactly as its GitHub job reaches the container it starts.
# Its sa password is minted per build in `prepare` and masked, so no context holds it.
#
# Results: TRX only (no JUnit anywhere). Every test gate copies build/test (TRX and Cobertura)
# and crap-metrics into ${CF_VOLUME_PATH}/artifacts/<build id>/<gate>/, and `gate` prints a
# Markdown summary of all TRX files (scripts/trx-summary.ps1). The last ten builds' artifacts
# stay on the pipeline volume of the build node.
#
# Parallelism: one Standard_D4as_v6 build node (dind 3-4 CPU, 11-12 GiB; Q40). The gates run as
# two chains, never more than two SQL Servers at once, with qodana and the light advisory
# security_scan beside them from prepare on:
#   chain B: build_sql -> code_analysis -> build_sqlite   (build_sql: SQL Server on 1433)
#   chain A: build_sql -> acceptance                      (its own SQL Server on 1433 once build_sql's is gone)
#   beside:  qodana, security_scan
# Acceptance ran beside build_sql on port 1434 for one build (6ab7072c718b2dc51632cc3c): its SQL
# Server service never became ready, so it went back after build_sql on 1433 (2026-09-26). The
# timed build of criterion 8 excludes acceptance, so the rollback does not lengthen it.
# Until 2026-09-25 chain A was build_sql -> acceptance (about 19 min) and chain B code_analysis ->
# build_sqlite -> qodana -> security_scan; then qodana ended chain B (14.8 min) until it moved
# beside the chains. docs/runbooks/build-duration.md has the timings.
# Gate semantics (build-result parity, scripts/gate.ps1): a docs-only change set
# (CODE_CHANGED=false) skips every gate and passes; otherwise every gate but security_scan
# (advisory) must succeed. fail_fast false keeps the other gates running after a failure.
#
# Placeholders: acrplatformi3aldz, 20260924.2333-f91765f and 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 (the platform/ci-dotnet
# reference, pinned by pull request after platform-env/ci-image-dotnet runs; ADR-IR19).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - prepare
  - gates
  - result

steps:
  main_clone:
    title: Clone the app repo at the triggering commit (full history)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/20260923-001
    revision: "${{CF_REVISION}}"
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/app"
    # No `depth`: version.ps1 counts first-parent commits and changed-paths.ps1 needs the
    # merge base with origin/master (ADR-C7).

  platform_clone:
    title: Clone the environment repo (main) for the pipeline scripts
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    depth: 1

  prepare:
    title: Version, change detection, SQL password, worktrees
    stage: prepare
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    # Four registry integrations share the registry domain; pull step images with the
    # pull-only platform/* token (ADR-IR19).
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
        - name: platform_clone
          on:
            - success
    # scripts/prepare.ps1 exports VERSION, BUILD_BUILDNUMBER and IS_RELEASE; CODE_CHANGED from
    # changed-paths.ps1 and the app repo's own classifier (.github/scripts/, unchanged; fail open:
    # anything but an explicit code=false counts as a code change); a throwaway sa password for this
    # build's SQL Server containers (masked); ARTIFACTS_DIR, the per-build artifact folder (the ten
    # newest build folders are kept on the volume); and one worktree per parallel gate.
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/prepare.ps1"

  # ---------------------------------------------------------------- chain B (starts with build_sql)
  # Chain A is build_sql -> acceptance (below); chain B is build_sql -> code_analysis -> build_sqlite
  # (9.8 min measured on 2026-09-25, docs/runbooks/build-duration.md). qodana (5.0 min) and the
  # light security_scan run beside the two chains, each right after prepare.
  build_sql:
    title: Build (SQL Server in dind), unit and integration tests, CRAP gate
    stage: gates
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when: &after_prepare
      steps:
        - name: prepare
          on:
            - success
      condition:
        all:
          codeChanged: '"${{CODE_CHANGED}}" == "true"'
    environment: &sql_environment
      - DATABASE_ENGINE=SQL-Container
      # The server exists already (the service below), so build.ps1 creates no container of
      # its own; it still drops and recreates the build's database. SQL_SERVER_HOST stays
      # unset: build.ps1 then uses `localhost`, the only kind of server whose self-signed
      # certificate app #1's DbUp console trusts (ADR-IR24), as in its own CI.
      - SQL_EXTERNAL=true
      - "SQL_SA_PASSWORD=${{CI_SQL_SA_PASSWORD}}"
      - DATABASE_NAME=ChurchBulletin
      # As build.yml sets for the whole job: crap4dotnet 0.1.1 targets .NET 8 and dotnet-octo
      # .NET 6, and the image carries only the .NET 10 runtime.
      - DOTNET_ROLL_FORWARD=LatestMajor
      - "AI_OpenAI_ApiKey=${{AI_OPENAI_APIKEY}}"
      - "AI_OpenAI_Url=${{AI_OPENAI_URL}}"
      - "AI_OpenAI_Model=${{AI_OPENAI_MODEL}}"
    services: &mssql_service
      # The step and its SQL Server share one network namespace, so the server answers on
      # localhost:1433 (Codefresh service containers, "Accessing containers via localhost")
      # [VERIFY on the hybrid runner]. acceptance starts only after build_sql
      # has finished, so the two SQL Servers never compete for port 1433.
      shared_host_network: true
      composition:
        mssql:
          # The major that build.ps1 starts locally (2022-latest); CU pinned by digest.
          image: &mssql_image "mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090"
          environment:
            - ACCEPT_EULA=Y
            - MSSQL_PID=Developer
            - "MSSQL_SA_PASSWORD=${{CI_SQL_SA_PASSWORD}}"
            # Two SQL Servers share the dind memory while the chains overlap; without a cap
            # each may grow its buffer pool to 80 % of the node.
            - MSSQL_MEMORY_LIMIT_MB=2048
          ports:
            - 1433
      readiness:
        image: *mssql_image
        timeoutSeconds: 240
        periodSeconds: 10
        commands:
          - >-
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{CI_SQL_SA_PASSWORD}}" -C -Q "SELECT 1"
            || /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "${{CI_SQL_SA_PASSWORD}}" -C -Q "SELECT 1"
    commands:
      # Outside GitHub Actions build.ps1 pins NUGET_PACKAGES=/tmp/nuget-packages; the link puts
      # that cache on the pipeline volume, which survives between builds on the same node.
      - ln -sfn "${CF_VOLUME_PATH}/.nuget/packages" /tmp/nuget-packages
      # Without the optional context app-workorders-ci the AI settings arrive as unresolved
      # ${{...}} text; unset them so the LLM tests skip instead of calling with junk.
      - for v in AI_OpenAI_ApiKey AI_OpenAI_Url AI_OpenAI_Model; do case "${!v:-}" in *'$''{{'*) unset "$v" ;; esac; done
      # dotnet global tools (crap4dotnet, dotnet-script) resolve from the user's tool folder.
      - export PATH="${HOME}/.dotnet/tools:${PATH}"
      - |-
        status=0
        pwsh -NoProfile -Command '. ./build.ps1; Build' || status=$?
        if [ "${status}" -eq 0 ]; then
          # CRAP gate: threshold from scripts/crap/crap-gate-threshold.json, as in build.yml.
          pwsh -NoProfile -File scripts/crap/run-crap-audit.ps1 -SkipTests -FailOnViolations || status=$?
        fi
        mkdir -p "${ARTIFACTS_DIR}/build_sql"
        cp -R build/test "${ARTIFACTS_DIR}/build_sql/" 2>/dev/null || true
        cp -R crap-metrics "${ARTIFACTS_DIR}/build_sql/" 2>/dev/null || true
        cat crap-metrics/crap-summary.md 2>/dev/null || true
        [ "${status}" -eq 0 ] || exit "${status}"
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/build_sql"

  acceptance:
    title: Acceptance tests (Playwright; SQL Server in dind)
    stage: gates
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    working_directory: "${{CF_VOLUME_PATH}}/wt/acceptance"
    timeout: 45m
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: build_sql
          on:
            - finished
      condition:
        all:
          codeChanged: '"${{CODE_CHANGED}}" == "true"'
    environment: *sql_environment
    # Its own SQL Server: service containers belong to the step that declares them.
    services: *mssql_service
    commands:
      - ln -sfn "${CF_VOLUME_PATH}/.nuget/packages" /tmp/nuget-packages
      # Without the optional context app-workorders-ci the AI settings arrive as unresolved
      # ${{...}} text; unset them so the LLM tests skip instead of calling with junk.
      - for v in AI_OpenAI_ApiKey AI_OpenAI_Url AI_OpenAI_Model; do case "${!v:-}" in *'$''{{'*) unset "$v" ;; esac; done
      # Chromium for Playwright 1.54 is baked into the image (/ms-playwright); build.ps1's
      # `playwright install chromium --with-deps` finds it and only checks the OS packages.
      # The test fixture starts UI.Server on https://localhost:7174 (the app's
      # appsettings.acceptancetests.json), which needs the ASP.NET Core development certificate.
      # The SDK base image generates none (DOTNET_GENERATE_ASPNET_CERTIFICATE=false) and Kestrel
      # then refuses to start, so the step creates it for this container; a certificate baked
      # into the pinned image would expire after a year.
      - dotnet dev-certs https
      - |-
        status=0
        pwsh -NoProfile -Command '. ./build.ps1; Invoke-AcceptanceTests' || status=$?
        mkdir -p "${ARTIFACTS_DIR}/acceptance"
        cp -R build/test "${ARTIFACTS_DIR}/acceptance/" 2>/dev/null || true
        [ "${status}" -eq 0 ] || exit "${status}"
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/acceptance"

  code_analysis:
    title: Code analysis (format, analyzers, warnings as errors)
    stage: gates
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    working_directory: "${{CF_VOLUME_PATH}}/wt/analysis"
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: build_sql
          on:
            - finished
      condition:
        all:
          codeChanged: '"${{CODE_CHANGED}}" == "true"'
    environment:
      - "NUGET_PACKAGES=${{CF_VOLUME_PATH}}/.nuget/packages"
    # The four commands of the build.yml code-analysis job.
    commands:
      - dotnet restore src/ChurchBulletin.sln
      - dotnet format style src/ChurchBulletin.sln --verify-no-changes --verbosity normal
      - dotnet format analyzers src/ChurchBulletin.sln --verify-no-changes --verbosity normal
      - >-
        dotnet build src/ChurchBulletin.sln --configuration Release --no-restore
        /p:TreatWarningsAsErrors=true
        /p:MSBuildTreatAllWarningsAsErrors=true
        /p:EnforceCodeStyleInBuild=true
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/code_analysis"

  build_sqlite:
    title: Build and tests (SQLite)
    stage: gates
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    working_directory: "${{CF_VOLUME_PATH}}/wt/sqlite"
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: code_analysis
          on:
            - finished
      condition:
        all:
          codeChanged: '"${{CODE_CHANGED}}" == "true"'
    environment:
      - DATABASE_ENGINE=SQLite
      - "AI_OpenAI_ApiKey=${{AI_OPENAI_APIKEY}}"
      - "AI_OpenAI_Url=${{AI_OPENAI_URL}}"
      - "AI_OpenAI_Model=${{AI_OPENAI_MODEL}}"
    commands:
      - ln -sfn "${CF_VOLUME_PATH}/.nuget/packages" /tmp/nuget-packages
      # Without the optional context app-workorders-ci the AI settings arrive as unresolved
      # ${{...}} text; unset them so the LLM tests skip instead of calling with junk.
      - for v in AI_OpenAI_ApiKey AI_OpenAI_Url AI_OpenAI_Model; do case "${!v:-}" in *'$''{{'*) unset "$v" ;; esac; done
      - |-
        status=0
        pwsh -NoProfile -Command '. ./build.ps1; Build -UseSqlite' || status=$?
        mkdir -p "${ARTIFACTS_DIR}/build_sqlite"
        cp -R build/test "${ARTIFACTS_DIR}/build_sqlite/" 2>/dev/null || true
        [ "${status}" -eq 0 ] || exit "${status}"
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/build_sqlite"

  qodana:
    title: Qodana Community for .NET (baseline, fail threshold 0)
    stage: gates
    # The linter release that produced qodana.sarif.json (QDNETC 2026.2); build.yml floats
    # this tag. Bump the tag, the digest and the app's baseline together.
    image: "jetbrains/qodana-cdnet:2026.2@sha256:81f2009055ed7e9ace4ed4a1c3519d3a818aed95bb7433247c789f1a4c4f5558"
    working_directory: "${{CF_VOLUME_PATH}}/wt/qodana"
    fail_fast: false
    strict_fail_fast: true
    # Beside the chains, right after prepare: it analyses its own worktree and needs nothing from
    # the other gates. It runs no SQL Server, so the node still carries at most two of them.
    when: *after_prepare
    environment:
      - "NUGET_PACKAGES=${{CF_VOLUME_PATH}}/.nuget/packages"
    # `cmd` keeps the image entry point (the linter). The solution comes from qodana.yaml.
    cmd:
      - "--project-dir=${{CF_VOLUME_PATH}}/wt/qodana"
      - "--results-dir=${{CF_VOLUME_PATH}}/artifacts/${{CF_BUILD_ID}}/qodana"
      - "--cache-dir=${{CF_VOLUME_PATH}}/.qodana-cache"
      - "--baseline=${{CF_VOLUME_PATH}}/wt/qodana/qodana.sarif.json"
      - "--fail-threshold=0"

  security_scan:
    title: Security scan (advisory)
    stage: gates
    image: *ci_dotnet
    registry_context: acr-platform-pull
    working_directory: "${{CF_VOLUME_PATH}}/wt/security"
    # Advisory: no strict_fail_fast; a failure shows on the step and in the gate summary.
    fail_fast: false
    # Light (Gitleaks, a restore from the warm cache, two package listings; about 1.2 min), so it
    # runs beside the two chains instead of lengthening chain B.
    when: *after_prepare
    environment:
      - "NUGET_PACKAGES=${{CF_VOLUME_PATH}}/.nuget/packages"
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/security-scan.ps1"
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/security_scan"

  # ---------------------------------------------------------------- result
  qodana_result:
    title: Record the Qodana result for the gate
    stage: gates
    image: alpine:3.20
    when:
      steps:
        - name: qodana
          on:
            - success
    commands:
      - mkdir -p "${ARTIFACTS_DIR}/gates" && echo success > "${ARTIFACTS_DIR}/gates/qodana"

  gate:
    title: Gate (build-result semantics) and TRX summary
    stage: result
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    # `finished` covers success, failure and skipped, so the gate always reports. It joins every
    # branch: chain B (build_sqlite), chain A (acceptance), qodana (through qodana_result) and
    # security_scan. gate.ps1 then requires each gate's success marker, qodana's included.
    when:
      steps:
        - name: build_sqlite
          on:
            - finished
        - name: qodana_result
          on:
            - finished
        - name: acceptance
          on:
            - finished
        - name: security_scan
          on:
            - finished
    environment:
      - "GATE_DIR=${{ARTIFACTS_DIR}}/gates"
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/trx-summary.ps1"
        -Path "${ARTIFACTS_DIR}" -Out "${ARTIFACTS_DIR}/test-summary.md" -Title "workorders/ci ${VERSION}"
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/gate.ps1"
        -Advisory security_scan -SummaryFile "${ARTIFACTS_DIR}/gate-summary.md"
        build_sql build_sqlite code_analysis qodana security_scan acceptance
