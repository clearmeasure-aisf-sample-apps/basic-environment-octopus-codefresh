# workorders/preview (phase 6): pull request preview images (ADR-C4; contract §7.0: previews
# push to apps-previews/<app>/<image>, ADR-IR34 decision 26).
#
# Builds acrplatformi3aldz.azurecr.io/apps-previews/workorders/{ui-server,worker,db-migrator} tagged
# pr-<number>-<40-hex head sha>, pushes them with registry integration
# acr-apps-preview and signs them keyless. The migrator carries the pull
# request's own scripts, so a preview tests its schema change (ADR-IR8). The Argo CD pull request
# generator (gitops package) deploys them; this pipeline never deploys and never
# talks to Octopus.
#
# Triggered by pull requests of the application repo
# clearmeasure-aisf-sample-apps/20260923-001; this YAML and the scripts come from
# `main` of the environment repo, so pull request authors cannot change the guard.
#
# Guard: the build exits early, successfully, unless the pull request
#   - carries the `preview` label, and
#   - comes from a branch of the application repo (the spec also sets
#     pullRequestAllowForkEvents: false, so fork events never trigger it).
# No contexts are attached; the runtime <cf-runtime> has no cloud identity.
# No tests run here: workorders/ci already gates the same branch push.
#
# Sleep and wake (sleep/wake contract): previews run in the nonprod cluster, which
# sleeps by default. When previews are enabled in phase 6, the cluster must be awake
# for Argo CD to deploy them; see the commented wake_nonprod step below. Nothing
# wakes the cluster from this pipeline today, and no context is attached.
#
# Placeholders: acrplatformi3aldz, 20260924.2333-f91765f, 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 (see ci.yml).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - guard
  - build
  - images

steps:
  main_clone:
    title: Clone the pull request head of the application repo
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/20260923-001
    revision: "${{CF_REVISION}}"
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/app"

  platform_clone:
    title: Clone the environment repo (main) for the pipeline scripts
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    depth: 1

  guard:
    title: Label and same-repository guard
    stage: guard
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
        - name: platform_clone
          on:
            - success
    commands:
      # CF_PULL_REQUEST_LABELS: a JSON array or a comma-separated list [VERIFY format];
      # both are accepted, and only an exact `preview` label counts.
      - |-
        raw="${CF_PULL_REQUEST_LABELS:-}"
        if printf '%s' "${raw}" | jq -e 'type == "array"' >/dev/null 2>&1; then
          labels="$(printf '%s' "${raw}" | jq -r '.[] | if type == "object" then .name else . end')"
        else
          labels="$(printf '%s' "${raw}" | tr ',' '\n')"
        fi
        has_label=false
        while IFS= read -r label; do
          label="$(printf '%s' "${label}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
          if [ "${label}" = "preview" ]; then has_label=true; fi
        done <<<"${labels}"
      # Same repository: the head branch must exist in the application repo and point at the triggering commit.
      - |-
        same_repo=false
        head_branch="${CF_PULL_REQUEST_HEAD_BRANCH:-}"
        if [ -n "${head_branch}" ] && git fetch --no-tags --quiet origin "refs/heads/${head_branch}"; then
          if [ "$(git rev-parse FETCH_HEAD)" = "${CF_REVISION}" ]; then same_repo=true; fi
        fi
      - |-
        if [ "${has_label}" = "true" ] && [ "${same_repo}" = "true" ]; then build=true; else build=false; fi
        echo "PR #${CF_PULL_REQUEST_NUMBER}: preview label ${has_label}, same repository ${same_repo}, build ${build}"
        VERSION="$(bash "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/version.sh")"
        cf_export PREVIEW_BUILD="${build}" VERSION="${VERSION}" BUILD_BUILDNUMBER="${VERSION}"

  # Phase 6 (commented out): wake the nonprod cluster when a preview will be built.
  # Same request as wake_nonprod in release.yml: run Octopus runbook env-wake
  # (project platform-infrastructure) in infra-nonprod, fire-and-forget, never
  # failing the build. Do NOT attach platform-octopus to this pipeline to enable it:
  # a context reaches every step, and `build` runs pull-request code, so the Space
  # Manager key would be exposed to pull-request authors. The phase-6 decision picks
  # the credential: a separate wake-only pipeline with the context and no application
  # checkout, triggered by the same pull request events, or an Octopus key that can
  # only run env-wake.
  #
  # wake_nonprod:
  #   title: Wake the nonprod cluster for the preview (non-blocking)
  #   stage: guard
  #   image: *ci_dotnet
  #   registry_context: acr-platform-pull
  #   shell: bash
  #   timeout: 3m
  #   fail_fast: false
  #   when:
  #     steps:
  #       - name: guard
  #         on:
  #           - success
  #     condition:
  #       all:
  #         previewRequested: '"${{PREVIEW_BUILD}}" == "true"'
  #   commands:
  #     - <the wake_nonprod commands of release.yml>

  build:
    title: Compile and stage preview contexts
    stage: build
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: guard
          on:
            - success
      condition:
        all:
          previewRequested: '"${{PREVIEW_BUILD}}" == "true"'
    environment:
      # Compile only; no database is touched, so SQLite avoids any SQL Server dependency.
      - DATABASE_ENGINE=SQLite
    commands:
      - ln -sfn "${CF_VOLUME_PATH}/.nuget/packages" /tmp/nuget-packages
      - pwsh -NoProfile -Command '. ./build.ps1; Init; Compile'
      # No Package-Everything for previews: built/ comes from dotnet publish of the same build.
      - bash "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/workorders/scripts/stage-built.sh" --version "${VERSION}" --ui-source publish --only ui,worker,db-migrator --out "${CF_VOLUME_PATH}/image-contexts"

  ui_image:
    title: Build, push and sign apps-previews/workorders/ui-server
    type: build
    stage: images
    working_directory: "${{CF_VOLUME_PATH}}/image-contexts/ui"
    dockerfile: Dockerfile
    image_name: apps-previews/workorders/ui-server
    tag: &preview_tag "pr-${{CF_PULL_REQUEST_NUMBER}}-${{CF_REVISION}}"
    registry: acr-apps-preview
    build_arguments: &oci_build_arguments
      - "VERSION=${{VERSION}}"
      - "REVISION=${{CF_REVISION}}"
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when: &after_build
      steps:
        - name: build
          on:
            - success

  worker_image:
    title: Build, push and sign apps-previews/workorders/worker
    type: build
    stage: images
    working_directory: "${{CF_VOLUME_PATH}}/image-contexts/worker"
    dockerfile: Dockerfile
    image_name: apps-previews/workorders/worker
    tag: *preview_tag
    registry: acr-apps-preview
    build_arguments: *oci_build_arguments
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when: *after_build

  migrator_image:
    title: Build, push and sign apps-previews/workorders/db-migrator
    type: build
    stage: images
    working_directory: "${{CF_VOLUME_PATH}}/image-contexts/db-migrator"
    dockerfile: Dockerfile
    image_name: apps-previews/workorders/db-migrator
    tag: *preview_tag
    registry: acr-apps-preview
    build_arguments: *oci_build_arguments
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when: *after_build
