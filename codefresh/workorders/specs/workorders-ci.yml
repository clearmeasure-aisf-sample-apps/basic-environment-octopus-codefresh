# Pipeline spec: workorders/ci (contract §7.7, ADR-C6, ADR-D17).
#   Register once (from the environment repo root):
#     codefresh create pipeline -f codefresh/workorders/specs/workorders-ci.yml
#   Apply a change:
#     codefresh replace pipeline -f codefresh/workorders/specs/workorders-ci.yml
# Field names follow the Codefresh pipeline spec (CLI docs "Pipelines > Spec",
# https://codefresh-io.github.io/cli/pipelines/spec/, and the JSON tags of
# codefresh-io/terraform-provider-codefresh codefresh/cfclient/pipeline.go).
#
# All-in-environment-repo layout: the trigger watches the application repo; the
# YAML loads from `main` of the environment repo, which application-repo branch
# authors cannot change.
version: "1.0"
kind: pipeline
metadata:
  name: workorders/ci
  project: workorders
spec:
  triggers:
    - type: git
      name: branch-push
      description: Every same-repo branch push of the application repo except master; posts codefresh/ci, the required status
      repo: clearmeasure-aisf-sample-apps/20260923-001
      provider: github
      # The stored Git integration for the org (read, trigger, commit status) [VERIFY token permissions].
      context: github-aisf-sample-apps
      events:
        - push.heads
      # Negative lookahead is supported in the branch regex filter
      # (https://codefresh.io/docs/docs/pipelines/triggers/git-triggers/).
      branchRegex: "/^(?!master$).+/"
      branchRegexInput: regex
      # Fork pull requests never trigger Codefresh (ADR-IR26): a maintainer reviews the fork
      # and pushes the same commits to a branch of the application repo, so this trigger
      # posts codefresh/ci on that SHA. GitHub Actions stays disabled in the application repo.
      pullRequestAllowForkEvents: false
      commitStatusTitle: codefresh/ci
      disabled: false
  # Branch code (build.ps1, tests) still runs in the gates, so only the CI context is attached.
  contexts:
    - workorders-ci
  runtimeEnvironment:
    name: "<cf-runtime-ci>"
  specTemplate:
    location: git
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    path: codefresh/workorders/pipelines/ci.yml
    revision: main
    context: github-aisf-sample-apps
  # A newer build cancels the older builds of the same branch (Terraform
  # termination_policy.on_create_branch maps to type branch, event onCreate).
  terminationPolicy:
    - type: branch
      event: onCreate
