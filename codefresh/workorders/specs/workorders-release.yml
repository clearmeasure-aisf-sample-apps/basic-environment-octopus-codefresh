# Pipeline spec: workorders/release (contract §7.7, ADR-C6, ADR-C7, ADR-D8, ADR-D17).
#   Register once (from the environment repo root):
#     codefresh create pipeline -f codefresh/workorders/specs/workorders-release.yml
#   Apply a change:
#     codefresh replace pipeline -f codefresh/workorders/specs/workorders-release.yml
# After the first build, copy the exact OIDC `sub` into the Octopus OIDC identity of
# svc-codefresh-release (<CF_RELEASE_PIPELINE_ID> is this pipeline's ID).
version: "1.0"
kind: pipeline
metadata:
  name: workorders/release
  project: workorders
spec:
  triggers:
    - type: git
      name: master-push
      description: Pushes to master of the application repo only; the build of record for the new platform
      repo: clearmeasure-aisf-sample-apps/20260923-001
      provider: github
      context: github-aisf-sample-apps
      events:
        - push.heads
      branchRegex: /^master$/
      branchRegexInput: regex
      pullRequestAllowForkEvents: false
      commitStatusTitle: codefresh/release
      disabled: false
  # Release credentials live only here (ADR-D17). Registry integration
  # acr-workorders-release is named by the build steps in release.yml. workorders-release is a
  # secret context: it also holds ACR_TOKEN_NAME and ACR_TOKEN_PASSWORD for supply_chain (ADR-IR10).
  contexts:
    - workorders-ci
    - workorders-release
  runtimeEnvironment:
    name: "<cf-runtime-release>"
  specTemplate:
    location: git
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    path: codefresh/workorders/pipelines/release.yml
    # The reviewed branch of the environment repo: nobody with only application-repo
    # access can change the YAML that runs with release credentials.
    revision: main
    context: github-aisf-sample-apps
  # One build at a time; later builds queue and are never cancelled
  # (no terminationPolicy), so every master commit gets its own release.
  concurrency: 1
