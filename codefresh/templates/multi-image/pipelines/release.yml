# STARTER multi-image (codefresh/templates/): `Platform.Onboarding scaffold <app> --codefresh multi-image`
# copies this folder to codefresh/apps/<app>/ and replaces <app>, <app-repo> and <app-branch>; the
# copy then belongs to the app (scaffold, then own). Placeholders acrplatformi3aldz, 20260924.2333-f91765f
# and 1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67 are pinned with the other pipelines (platform/ci-dotnet).
#
# <app>/release: N images, one build step each (the example shows web and migrator),
# each from containers/apps/<app>/<image>/Dockerfile over the app checkout, one Octopus release
# listing them all.
# Handshake (contract §7.0): M1 images under apps/<app>/, M2 a keyless signature and an SBOM from
# this release pipeline, M3 the Octopus release through octopus_release with explicit packages,
# M4 never deploy. wake_nonprod asks Octopus to wake nonprod early (ADR-IR33).
version: "1.0"
mode: parallel
fail_fast: false

stages:
  - clone
  - prepare
  - wake
  - test
  - images
  - supply-chain
  - handoff

steps:
  main_clone:
    title: Clone the app repo at the triggering commit (full history)
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: <app-repo>
    revision: "${{CF_REVISION}}"
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/app"

  platform_clone:
    title: Clone the environment repo (main) for the pipeline scripts
    type: git-clone
    fail_fast: false
    strict_fail_fast: true
    stage: clone
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    revision: main
    git: github-aisf-sample-apps
    working_directory: "${{CF_VOLUME_PATH}}/platform"
    depth: 1

  prepare:
    title: Version and artifact folder
    stage: prepare
    image: &ci_dotnet "acrplatformi3aldz.azurecr.io/platform/ci-dotnet:20260924.2333-f91765f@sha256:1fd09acf036affd0a1a7676ddb57117098f809a1286674343985c1dab4e72d67"
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: main_clone
          on:
            - success
        - name: platform_clone
          on:
            - success
    environment:
      - RELEASE_BRANCH=<app-branch>
    # scripts/prepare.ps1 exports VERSION and ARTIFACTS_DIR, the per-build artifact folder (the ten
    # newest build folders are kept on the volume).
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/prepare.ps1"

  test:
    title: Tests (the app's own command)
    stage: test
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: prepare
          on:
            - success
    # EDIT: the app's test command. The platform CI image carries .NET 10, pwsh 7, the docker
    # CLI (the build's dind daemon) and git; any other image works too. Results stay TRX or the
    # language's native format; nothing emits JUnit.
    commands:
      - |-
        if [ -x ci/test.sh ]; then
          ci/test.sh
        else
          echo "<app>: no ci/test.sh in the app repo; the image build below is the only gate. Put the test command here."
        fi

  # ---------------------------------------------------------------- early wake (release only)
  # ADR-IR33: run runbook env-wake of project platform-infrastructure in infra-nonprod,
  # fire-and-forget, in parallel with the gates, when this build will release. Non-blocking
  # three times over: fail_fast false, no strict_fail_fast, and every path exits 0. A missed
  # wake costs only time: step 0 of the tdd deployment (Deploy a Release of platform-wake)
  # wakes the cluster and waits. env-wake is idempotent.
  # Credential: the Space Manager key of context platform-octopus, sent from a private header
  # file so that it never appears in a process list or the log. The runbook is config as code,
  # so the run route carries the Git ref (refs/heads/main) of the Octopus project [VERIFY:
  # Octopus's RunConfigAsCodeRunbook.ps1 example is marked early access].
  wake_nonprod:
    title: Wake the nonprod cluster early (runbook env-wake, non-blocking)
    stage: wake
    image: *ci_dotnet
    registry_context: acr-platform-pull
    timeout: 3m
    fail_fast: false
    when:
      branch:
        only:
          - <app-branch>
      steps:
        - name: prepare
          on:
            - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/wake-nonprod.ps1"

  stage_dockerfiles:
    title: Copy the Dockerfiles of containers/apps/<app>/ into the build context
    stage: images
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: test
          on:
            - success
    # The app repo holds only its source (ADR-D18); each image's Dockerfile lives in the
    # environment repo and builds from the app checkout (multi-stage builds work).
    # scripts/stage-dockerfiles.ps1 copies them to .platform/<image>.Dockerfile.
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/stage-dockerfiles.ps1" -Image web,migrator

  # A re-run of a release for the same commit finds VERSION and sha-<commit> pushed, signed,
  # attested and locked by the first run, and a push to a locked tag fails. image_reuse then
  # skips the image builds and supply_chain, and supply_chain_reuse confirms the lock instead, so
  # the re-run goes on to the handoff. supply-chain.ps1 -CheckReuse answers reuse or build,
  # and fails on a mixed state (some tags locked, others not), for example two commits that
  # computed the same VERSION.
  image_reuse:
    title: Reuse the released images when VERSION is already locked (re-run)
    stage: images
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: stage_dockerfiles
          on:
            - success
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/supply-chain-step.ps1"
        -Step image_reuse -Repository apps/<app>/web,apps/<app>/migrator

  web_image:
    title: Build, push and sign apps/<app>/web
    type: build
    stage: images
    working_directory: "${{main_clone}}"
    dockerfile: .platform/web.Dockerfile
    image_name: apps/<app>/web
    # The primary tag; without it Codefresh also pushes the branch name (master).
    tag: "${{VERSION}}"
    tags: &release_tags
      - "${{VERSION}}"
      - "sha-${{CF_SHORT_REVISION}}"
    registry: acr-apps-release
    build_arguments: &oci_build_arguments
      - "VERSION=${{VERSION}}"
      - "REVISION=${{CF_REVISION}}"
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: image_reuse
          on:
            - success
      condition:
        all:
          imagesNotReused: '"${{IMAGES_REUSED}}" == "false"'

  migrator_image:
    title: Build, push and sign apps/<app>/migrator
    type: build
    stage: images
    working_directory: "${{main_clone}}"
    dockerfile: .platform/migrator.Dockerfile
    image_name: apps/<app>/migrator
    # The primary tag; without it Codefresh also pushes the branch name (master).
    tag: "${{VERSION}}"
    tags: *release_tags
    registry: acr-apps-release
    build_arguments: *oci_build_arguments
    cosign:
      sign: true
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: image_reuse
          on:
            - success
      condition:
        all:
          imagesNotReused: '"${{IMAGES_REUSED}}" == "false"'

  supply_chain:
    title: SBOM and provenance attestations, tag lock
    stage: supply-chain
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: web_image
          on:
            - success
        - name: migrator_image
          on:
            - success
    # The cf-apps-release token of context platform-registry, as a step-local Docker config.
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/supply-chain-step.ps1"
        -Step supply_chain -Repository apps/<app>/web,apps/<app>/migrator

  # The reuse path of a re-run (image_reuse answered reuse): the image builds and supply_chain do not
  # run; this step confirms again that every tag is locked (the first run's supply chain completed)
  # and names the digests the handoff releases. Its condition is the complement of the image steps'
  # ("${{IMAGES_REUSED}}" != "false"), so exactly one of supply_chain and supply_chain_reuse runs.
  supply_chain_reuse:
    title: Confirm the reused images are signed, attested and locked (re-run)
    stage: supply-chain
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: image_reuse
          on:
            - success
      condition:
        all:
          imagesReused: '"${{IMAGES_REUSED}}" != "false"'
    commands:
      - >-
        pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/supply-chain-step.ps1"
        -Step supply_chain_reuse -Repository apps/<app>/web,apps/<app>/migrator

  # ---------------------------------------------------------------- handoff (M3)
  # The Space Manager key of context platform-octopus reaches the Octopus CLI through its
  # environment only (§7.0 decision 4).
  octopus_preflight:
    title: Check the Octopus context and CLI (no network call)
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    # Either path: the image builds with supply_chain, or supply_chain_reuse on a re-run.
    when:
      steps:
        any:
          - name: supply_chain
            on:
              - success
          - name: supply_chain_reuse
            on:
              - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/octopus-preflight.ps1"

  octopus_build_info:
    title: Push build information
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: octopus_preflight
          on:
            - success
    commands:
      - pwsh -NoProfile -File "${{CF_VOLUME_PATH}}/platform/basic-environment-octopus-codefresh/codefresh/apps/<app>/scripts/buildinfo.ps1" -Out "${ARTIFACTS_DIR}/octopus-buildinfo.json" -ReleaseNotesOut "${ARTIFACTS_DIR}/octopus-release-notes.md"
      - >-
        octopus build-information upload --space "${OCTOPUS_SPACE_ID}"
        --package-id apps/<app>/web
        --package-id apps/<app>/migrator
        --version "${VERSION}"
        --file "${ARTIFACTS_DIR}/octopus-buildinfo.json"
        --overwrite-mode overwrite
        --no-prompt

  octopus_release:
    title: Create Octopus release VERSION (project <app>, channel Default)
    stage: handoff
    image: *ci_dotnet
    registry_context: acr-platform-pull
    shell: bash
    fail_fast: false
    strict_fail_fast: true
    when:
      steps:
        - name: octopus_build_info
          on:
            - success
    # Explicit packages and no default package version (step 0 deploys platform-wake);
    # --ignore-existing: a rerun of the same commit creates no second release (CAP-CF-008).
    commands:
      - |-
        octopus release create --space "${OCTOPUS_SPACE_ID}" \
          --project <app> \
          --channel Default \
          --version "${VERSION}" \
          --package "apps\/<app>\/web:${VERSION}" \
          --package "apps\/<app>\/migrator:${VERSION}" \
          --git-ref refs/heads/main \
          --release-notes-file "${ARTIFACTS_DIR}/octopus-release-notes.md" \
          --ignore-existing \
          --no-prompt

hooks:
  on_finish:
    exec:
      image: "alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8"
      commands:
        # Shell variables with defaults: a build that stops before prepare has no VERSION, and an
        # unresolved ${{VERSION}} reaches /bin/sh as a bad substitution.
        - echo "<app>/release ${VERSION:-(no version)} for ${CF_REVISION:-(no revision)}"
