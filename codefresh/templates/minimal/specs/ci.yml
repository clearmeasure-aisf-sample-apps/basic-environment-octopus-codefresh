# STARTER minimal: copied to codefresh/apps/<app>/specs/ by `Platform.Onboarding scaffold`, then
# registered by codefresh/register.ps1 (--full or --app <app>).
version: "1.0"
kind: pipeline
metadata:
  name: <app>/ci
  project: <app>
spec:
  triggers:
    - type: git
      name: branch-push
      description: Every same-repo branch push of the app repo except <app-branch>; posts codefresh/ci
      repo: <app-repo>
      provider: github
      context: github-aisf-sample-apps
      events:
        - push.heads
      branchRegex: "/^(?!<app-branch>$).+/"
      branchRegexInput: regex
      # Fork pull requests never start a pipeline (handshake; CAP-CF-005).
      pullRequestAllowForkEvents: false
      commitStatusTitle: codefresh/ci
      disabled: false
  contexts: []
  runtimeEnvironment:
    name: aks-platform-build/codefresh
  specTemplate:
    location: git
    repo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
    path: codefresh/apps/<app>/pipelines/ci.yml
    revision: main
    context: github-aisf-sample-apps
  terminationPolicy:
    - type: branch
      event: onCreate
