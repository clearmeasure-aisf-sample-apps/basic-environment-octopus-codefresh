# Fixtures for require-mssql-express (CAP-AZ-003 offline counterpart of the live dry runs).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: express
  namespace: sandbox-prod
spec:
  serviceName: db-hl
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: MSSQL_PID
              value: Express
---
