# policies/kyverno/overlays/prod -> Argo CD Application kyverno-policies on argocd-prod
# (argocd/clusters/prod/addons/kyverno.yaml).
#
# Mode: Enforce (ADR-D11, ADR-IR34). Signatures, the registry path, the SQL edition and the baseline deny and fail
# closed; provenance stays in Audit (base). No preview path: previews never run in prod. CAP-AZ-001 to CAP-AZ-003 prove
# the enforcement with server-side dry runs in sandbox-prod.
#
# The base already enforces; the patches restate it so that a change to the base cannot silently relax prod.
# Emergency path: a time-bound PolicyException (docs/runbooks/break-glass.md), never an edit of this file.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      policies.platform/mode: Enforce
    includeSelectors: false
patches:
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ValidatingPolicy
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
      - op: replace
        path: /spec/failurePolicy
        value: Fail
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ImageValidatingPolicy
      name: verify-app-release-signatures
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Deny]
      - op: replace
        path: /spec/failurePolicy
        value: Fail
      - op: replace
        path: /spec/validationConfigurations
        value:
          mutateDigest: false
          verifyDigest: false
          required: true
  # The registry path never admits previews in prod.
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ValidatingPolicy
      name: restrict-app-image-paths
    patch: |-
      - op: test
        path: /spec/variables/3/name
        value: previewPrefixes
      - op: replace
        path: /spec/variables/3/expression
        value: "[]"
