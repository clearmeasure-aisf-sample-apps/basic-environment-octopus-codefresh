# policies/kyverno/overlays/nonprod -> Argo CD Application kyverno-policies on argocd-nonprod
# (argocd/clusters/nonprod/addons/kyverno.yaml).
#
# Mode: Audit (ADR-D11). Every policy reports to PolicyReports and never blocks; engine failures are ignored
# (failurePolicy Ignore), so a sleeping-then-waking Kyverno never stalls tdd or uat. Review with:
#   kubectl get policyreports -A
#   kubectl get imagevalidatingpolicies,validatingpolicies -L policies.platform/mode
#
# Previews (phase 6, ADR-C4): restrict-app-image-paths also admits <acr-name>.azurecr.io/apps-previews/<app>/ here.
# Their signer (the app's preview pipeline) is rendered per app by the tenant chart. Release images (apps/*) still
# need a release signature: a preview signature never satisfies verify-app-release-signatures.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
labels:
  - pairs:
      policies.platform/mode: Audit
    includeSelectors: false
patches:
  # Baseline, registry path and SQL edition: report only.
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ValidatingPolicy
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Audit]
      - op: replace
        path: /spec/failurePolicy
        value: Ignore
  # Release signatures: report only. Admission never rewrites a tag to a digest (ADR-D11), in any tier.
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ImageValidatingPolicy
      name: verify-app-release-signatures
    patch: |-
      - op: replace
        path: /spec/validationActions
        value: [Audit]
      - op: replace
        path: /spec/failurePolicy
        value: Ignore
      - op: replace
        path: /spec/validationConfigurations
        value:
          mutateDigest: false
          verifyDigest: false
          required: true
  # Registry path: previews of the same app. The test op fails the build if the variable moved.
  - target:
      group: policies.kyverno.io
      version: v1
      kind: ValidatingPolicy
      name: restrict-app-image-paths
    patch: |-
      - op: test
        path: /spec/variables/3/name
        value: previewPrefixes
      - op: replace
        path: /spec/variables/3/expression
        value: "['<acr-name>.azurecr.io/apps-previews/' + variables.app + '/']"
