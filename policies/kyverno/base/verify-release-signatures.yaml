# policies/kyverno/base/verify-release-signatures.yaml
#
# Supply-chain admission (ADR-D11, ADR-IR34; CAP-AZ-001). Two app-neutral ImageValidatingPolicies:
#
#   verify-app-release-signatures   every acrplatformi3aldz.azurecr.io/apps/* image in an app namespace carries a keyless
#                                   cosign signature from a release pipeline of an app of this Codefresh account.
#                                   Deny in prod, Audit in nonprod (overlays).
#   audit-app-release-provenance    the same images should carry a SLSA provenance attestation signed the same way.
#                                   Audit everywhere: the predicate is step-authored (SLSA level 2 at most).
#
# The per-app rule is stricter and lives in the tenant chart (gitops/platform/tenant, §7.0 "Signer policy"): app X's
# images must be signed by app X's own release pipeline, subjectRegExp
#   ^https://g\.codefresh\.io/clearmeasure/<app>(-[a-z0-9]+)?/release(-[a-z0-9-]+)?:66327682d5f6e0bfd0ef936a/[0-9a-f]{24}$
# Security owners review that template. The rule below is its app-neutral floor: it still holds when a tenant renders
# no signer policy, and it needs no change when an app is added. Previews (apps-previews/*, phase 6) are signed by
# the app's preview pipeline, but no signer rule checks them yet: this policy and the tenant chart's signer policy
# match only apps/, and restrict-app-image-paths admits apps-previews/<app>/ in nonprod only (overlays/nonprod).
#
# Signer identity (E33): Fulcio builds the Codefresh SAN from
#   {{.platform_url}}/{{.account_name}}/{{.pipeline_name}}:{{.account_id}}/{{.pipeline_id}}
# where pipeline_name is <project>/<pipeline>. Release pipelines are named release or release-<x> (§7.0), projects
# are <app> or <app>-<part>, and pipeline IDs are 24 hex digits. The issuer is the Codefresh OIDC issuer (E15).
#
# Verified against the Kyverno 1.19 documentation and CRD (2026-09-24):
#   - validationConfigurations.mutateDigest and verifyDigest default to true; both are false. A tag-to-digest rewrite
#     would make the live object differ from Git and fight Argo CD self-heal; tags are write-locked in the registry.
#   - The `images` extractors cover bare Pods, the pod templates of Deployments, StatefulSets, DaemonSets, Jobs and
#     Rollouts, and the job template of CronJobs. A Rollout with workloadRef has no template; its Deployment is checked.
#   - verifyImageSignatures returns 0 for an image outside matchImageReferences, so each validation filters to the
#     apps/ path first. matchImageReferences globs match across "/" (gobwas/glob without separators).
#   - Admission only (ADR-IR30): only kyverno-admission-controller is federated to id-kyverno-<tier> for registry reads.
#
# Break-glass: a time-bound PolicyException (docs/runbooks/break-glass.md).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-app-release-signatures
  annotations:
    policies.kyverno.io/title: Verify app release signatures
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Images from acrplatformi3aldz.azurecr.io/apps/ in app namespaces must be signed keyless by a Codefresh release pipeline
      of the platform account. The tenant chart narrows this to the app's own pipeline. No digest mutation.
spec:
  # Enforce by default; overlays/nonprod switches to Audit.
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        tier: app
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      # Argo Rollouts arrives in phase 6 [VERIFY that Kyverno accepts the rule before the CRD exists].
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  matchConditions:
    - name: skip-controller-owned-pods
      expression: "object.kind != 'Pod' || object.metadata.?ownerReferences.orValue([]).size() == 0"
  images:
    - name: containers
      expression: >-
        (object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        object.spec.?template.?spec.orValue({}))).?containers.orValue([]).map(c, c.image)
    - name: initContainers
      expression: >-
        (object.kind == 'Pod' ? object.spec :
        (object.kind == 'CronJob' ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        object.spec.?template.?spec.orValue({}))).?initContainers.orValue([]).map(c, c.image)
  matchImageReferences:
    - glob: "acrplatformi3aldz.azurecr.io/apps/*"
  credentials:
    # Workload identity of the admission controller (id-kyverno-<tier>, AcrPull; §7.0).
    providers: [azure]
  attestors:
    - name: appReleasePipelines
      cosign:
        keyless:
          identities:
            - issuer: https://oidc.codefresh.io
              subjectRegExp: '^https://g\.codefresh\.io/clearmeasure/[a-z][a-z0-9]{2,11}(-[a-z][a-z0-9]{1,11})?/release(-[a-z0-9-]+)?:66327682d5f6e0bfd0ef936a/[0-9a-f]{24}$'
        ctlog:
          url: https://rekor.sigstore.dev
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: true
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('acrplatformi3aldz.azurecr.io/apps/'))
        .all(i, verifyImageSignatures(i, [attestors.appReleasePipelines]) > 0)
      message: >-
        An apps/ image is not signed by a Codefresh release pipeline of the platform account. Deploy only releases
        created by the app's release pipeline (docs/runbooks/break-glass.md for emergencies).
    - expression: >-
        images.initContainers.filter(i, i.startsWith('acrplatformi3aldz.azurecr.io/apps/'))
        .all(i, verifyImageSignatures(i, [attestors.appReleasePipelines]) > 0)
      message: >-
        An apps/ init-container image is not signed by a Codefresh release pipeline of the platform account.
---
# Provenance: reported, never enforced (ADR-D11).
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: audit-app-release-provenance
  annotations:
    policies.kyverno.io/title: Audit app release provenance
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      Reports apps/ images without a SLSA provenance attestation signed by an app release pipeline. The predicate is
      step-authored (SLSA level 2 at most), so this policy stays in Audit.
spec:
  validationActions: [Audit]
  failurePolicy: Ignore
  webhookConfiguration:
    timeoutSeconds: 15
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        tier: app
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE, UPDATE]
        resources: [rollouts]
  images:
    - name: containers
      expression: >-
        (object.kind == 'CronJob' ? object.spec.?jobTemplate.?spec.?template.?spec.orValue({}) :
        object.spec.?template.?spec.orValue({})).?containers.orValue([]).map(c, c.image)
  matchImageReferences:
    - glob: "acrplatformi3aldz.azurecr.io/apps/*"
  credentials:
    providers: [azure]
  attestors:
    - name: appReleasePipelines
      cosign:
        keyless:
          identities:
            - issuer: https://oidc.codefresh.io
              subjectRegExp: '^https://g\.codefresh\.io/clearmeasure/[a-z][a-z0-9]{2,11}(-[a-z][a-z0-9]{1,11})?/release(-[a-z0-9-]+)?:66327682d5f6e0bfd0ef936a/[0-9a-f]{24}$'
        ctlog:
          url: https://rekor.sigstore.dev
  attestations:
    # `cosign attest --type slsaprovenance1` maps to this predicate type (sigstore/cosign predicate.go, checked
    # 2026-09-24).
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
  validationConfigurations:
    mutateDigest: false
    verifyDigest: false
    required: false
  validations:
    - expression: >-
        images.containers.filter(i, i.startsWith('acrplatformi3aldz.azurecr.io/apps/'))
        .all(i, verifyAttestationSignatures(i, attestations.provenance, [attestors.appReleasePipelines]) > 0)
      message: >-
        An apps/ image has no provenance attestation signed by an app release pipeline.
