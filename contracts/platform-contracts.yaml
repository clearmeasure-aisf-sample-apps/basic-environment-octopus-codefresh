  - {root: catalogue/capabilities.d/kit.yaml, package: pragmatist}
  - {root: tests/Platform.Conformance.Tests/Kit/, package: pragmatist}
  - {root: tests/Platform.Conformance.Offline/Kit/, package: pragmatist}
