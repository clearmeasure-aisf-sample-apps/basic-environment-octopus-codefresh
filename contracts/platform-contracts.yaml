# Machine-readable platform contracts: design/platform-design.md §7.0 (ADR-IR34, binding).
#
# Platform names and the handshake only. Per-app facts live in the app descriptors apps/<app>.yaml
# (schema apps/schema.json) and in each app's own files; nothing here names an app except the conformance
# fixture `sandbox` (a platform component) and the retired names that the checks hunt for.
#
# Readers: the Offline tests Kit/Consistency (checks C01 to C25) and Kit/Boundaries (rules TB01 to TB23), tools/Platform.Onboarding.
# Change a name here only in the same pull request that changes §7.0 of the design.
#
# Conventions
#   - Paths are relative to the environment-repo root; app repositories hold no platform file (ADR-D18).
#   - `{app}`, `{env}`, `{tier}`, `{e}`, `{part}`, `{deployable}`, `{image}`, `{project}` and `{n}` are template
#     variables: `{app}` and `{part}` come from a descriptor, the others from `expansions`.
#   - Angle-bracket values such as `<acr-name>` are §7.0/§7.1 placeholders and stay literal in committed files.
#   - `[VERIFY]` marks product behaviour that provisioning (P1, ADR-IR34) must prove.
schemaVersion: 2
design: design/platform-design.md

expansions:
  env: [tdd, uat, prod]
  tier: [nonprod, prod]
  tierOfEnv: {tdd: nonprod, uat: nonprod, prod: prod}   # fixed; descriptors cannot change it
  eOfEnv: {tdd: t, uat: u, prod: p}
  infraEnvOfTier: {nonprod: infra-nonprod, prod: infra-prod}
  tierOfInfraEnv: {infra-nonprod: nonprod, infra-prod: prod}

# §7.0 and surviving §7.1 placeholders (literal in committed files). Consistency check C21 warns on any other `<...>`
# token and fails on a retired one.
placeholders:
  - "<AZURE_TENANT_ID>"
  - "<AZURE_SUBSCRIPTION_ID>"
  - "<azure-region>"
  - "<acr-name>"
  - "<kv-platform-{tier}>"
  - "<tfstate-storage-account-global>"
  - "<tfstate-storage-account-{tier}>"
  - "<backup-storage-account-{tier}>"
  - "<apps-domain-{tier}>"
  - "<ingress-ip-dashed-{tier}>"
  - "<cf-runtime>"
  - "<sandbox-app-repo>"
  - "<object-id-of-platform-operator>"
  - "<OCTOPUS_URL>"
  - "<OCTOPUS_HOST>"
  - "<octopus-space>"
  - "<octopus-space-slug>"
  - "<octopus-space-id>"
  - "<space-slug>"
  - "<CF_ACCOUNT_ID>"
  - "<cf-account-name>"
  - "<ENV_REPO_URL>"
  - "<ci-image-version>"
  - "<ci-image-digest>"
  - "<argocd-{tier}-host>"
  - "<argocd-sso-app>"
  - "<gateway-name>"
  - "<gateway-namespace>"
  - "<gateway-class>"
  - "<platform-bots-author-regex>"
  - "<provisioner-secret-expires-on>"
  - "<github-status-app-id>"
  - "<github-status-app-installation-id>"
  - "<octopus-cloud-static-ips>"
  - "<VERSION>"
  - "<sha7>"
  - "<package-version>"
  - "<org>"
  # Used by app #1's own configuration (gitops/apps/workorders/**).
  - "<azure-openai-endpoint>"
  - "<model-deployment-name>"

# Placeholder families (ADR-IR12). `*` matches one or more of [A-Za-z0-9._-].
placeholderPatterns:
  - "<*-chart-version>"
  - "<*-version>"
  - "<*-digest>"
  - "<*-sha256>"
  - "<client-id-of-*>"
  - "<entra-group-object-id-*>"
  - "<object-id-of-*>"

# Notation in names and descriptions (`k8s-<env>`, `kv-<app>-<e>-<hash4>`); never a value to substitute.
notationTokens:
  - "<app>"
  - "<part>"
  - "<deployable>"
  - "<image>"
  - "<project>"
  - "<env>"
  - "<e>"
  - "<tier>"
  - "<hash4>"
  - "<n>"
  - "<x>"
  - "<sha>"
  - "<run-id>"
  - "<name>"
  - "<number>"
  - "<release>"
  - "<40-hex sha>"
  - "<UTC timestamp>"
  - "<database>"
  - "<channel>"
  - "<subscription>"
  - "<serviceAccount>"

# §7.0 "Retired". A retired placeholder in a committed platform file is a failure (C21).
retiredPlaceholders:
  - "<kv-workorders-{env}>"
  - "<kv-workorders-platform-{tier}>"
  - "<sql-workorders-{env}>"
  - "<sqldb-workorders-{env}>"
  - "<sql-admins-{tier}>"
  - "<{env}-hostname>"
  - "<previews-hostname-suffix>"
  - "<cf-runtime-ci>"
  - "<cf-runtime-release>"
  - "<aks-cluster-context>"
  - "<CF_RELEASE_PIPELINE_ID>"
  - "<CF_PREVIEW_PIPELINE_ID>"
  - "<tfstate-storage-account>"

envRepo:
  name: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
  url: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
  urlPlaceholder: "<ENV_REPO_URL>"
  defaultBranch: main
  visibility: private
  writers:
    human: pull request with CODEOWNERS review, merged to main
    octopusPin: "direct commit to main; only the pin fields under gitops/apps/{app}/envs/{env}/{deployable}/"
    octopusBranch: config-as-code edits on non-main branches, merged by people
  botTeam: platform-bots
  requiredStatus: codefresh/env-checks

# The app descriptor contract (§7.0 naming; ADR-IR34 decisions 10, 11, 14, 19, 28).
descriptors:
  path: "apps/{app}.yaml"
  glob: "apps/*.yaml"
  schema: apps/schema.json
  schemaVersion: 1
  appPattern: "^[a-z][a-z0-9]{2,11}$"
  partPattern: "^[a-z][a-z0-9]{1,11}$"
  reservedApps: [apps, argo, argocd, cert, default, external, infra, kube, kyverno, octopus, platform, system]
  fixtureApp: sandbox                        # reserved for the conformance fixture; `new` refuses it
  reservedDeployables: [db]                  # the database deployable
  reservedParts: [db, pr]                    # pr: preview namespaces <app>-pr-<n>
  statuses: [active, frozen]
  githubOrg: clearmeasure-aisf-sample-apps
  # An onboarding or app change touches only these paths (CAP-KIT-004, `Platform.Onboarding check --changes`).
  appScopedPaths:
    - "apps/{app}.yaml"
    - "codefresh/apps/{app}/"
    - ".octopus/apps/{app}/"
    - "gitops/apps/{app}/"
    - "containers/apps/{app}/"
  fixtureScopedPaths: ["fixtures/sandbox-app/"]
  # Names derived from a descriptor. The tenant chart, octopus/terraform, terraform/apps/* and the kit use these.
  derived:
    namespace: "{app}-{env}"
    partNamespace: "{app}-{part}-{env}"
    previewNamespace: "{app}-pr-{n}"
    host: "{app}-{env}.<apps-domain-{tier}>"
    partHost: "{app}-{part}-{env}.<apps-domain-{tier}>"
    tenantApplication: "tenant-{app}"
    appProject: "app-{app}"
    previewAppProject: "app-{app}-previews"
    application: "{app}-{deployable}-{env}"
    databaseApplication: "{app}-db-{env}"
    clusterSecretStore: "{app}-{env}"
    vault: "kv-{app}-{e}-{hash4}"
    disk: "disk-{app}-{env}-db"
    backupContainer: "{app}-{env}"
    backupCronJob: "db-backup-{app}-{env}"          # uat and prod
    restoreCronJob: "db-restore-{app}-{env}"        # suspended
    appInsights: "appi-{app}-{env}"
    sloAlert: "slo-fast-burn-{app}-{env}"
    octopusProjectGroup: "app-{app}"
    octopusProject: "{app} or {app}-{part}"
    octopusAppLifecycle: "app-{app}-{x}"            # optional; not in descriptor schema 1
    octopusAccount: "azure-{app}-{env}"             # octopus.azureAccount
    codefreshProject: "{app} or {app}-{part}"
    codefreshAppContext: "app-{app}-{x}"            # optional app-owned contexts, e.g. app-workorders-ci
    registryRepository: "apps/{app}/{image}"
    previewRepository: "apps-previews/{app}/{image}"
    deployIdentity: "id-{app}-{env}-deploy"         # octopus.azureAccount
    appIdentity: "id-{app}-{env}-app"               # azure.workloadIdentity
    appResourceGroup: "rg-app-{app}-{tier}"         # azure.resourceGroup
    appsTierState: "apps-{app}.tfstate"             # tier state account
    appGrantsState: "app-grants-{app}.tfstate"      # global state account
  # ADR-IR34 decision 8. Terraform (terraform/apps/tier), the tenant chart and the kit compute it identically.
  vaultName:
    format: "kv-{app}-{e}-{hash4}"
    hash4: "first 4 hex digits (lowercase) of sha1(\"<AZURE_SUBSCRIPTION_ID>/{app}/{env}\")"
    subscriptionIdForm: lowercase GUID, as ARM returns it
    maxLength: 24
  appVault:
    # Written by terraform/apps/tier; the app's ExternalSecrets read them through store {app}-{env}.
    platformKeys:
      - {name: db-sa-password, when: database}
      - {name: db-migrator-password, when: database}
      - {name: db-app-password, when: database}
      - {name: appinsights-connection-string, when: always}
      - {name: azure-client-id, when: azure.workloadIdentity}
    sqlLogins: [sa, "{app}_migrator", "{app}_app"]
    databaseName: "{app}"
  # Folders each app owns ("scaffold, then own"; ADR-IR34 decision 19).
  appPaths:
    codefreshPipelines: "codefresh/apps/{app}/pipelines/"
    codefreshSpecs: "codefresh/apps/{app}/specs/"
    octopusProject: ".octopus/apps/{app}/{project}/"
    gitopsDeployable: "gitops/apps/{app}/envs/{env}/{deployable}/"
    gitopsDatabase: "gitops/apps/{app}/envs/{env}/db/"
    containers: "containers/apps/{app}/"
  pinFiles:
    kustomize: "gitops/apps/{app}/envs/{env}/{deployable}/kustomization.yaml"   # images[].newTag
    helm: "gitops/apps/{app}/envs/{env}/{deployable}/values.yaml"             # values at image-replace-paths
    raw: "gitops/apps/{app}/envs/{env}/{deployable}/*.yaml"                   # image: fields
  bootstrapTag: 0.0.0-bootstrap

# Starters: examples copied once by `Platform.Onboarding scaffold`, then owned by the app (directive §9).
starters:
  codefresh: {root: codefresh/templates, names: [minimal, multi-image, dotnet-buildps1], target: "codefresh/apps/{app}/"}
  octopus: {root: octopus/templates, names: [deploy-minimal, deploy-with-db, db-runbooks], target: ".octopus/apps/{app}/{project}/", layered: true}
  gitops: {root: gitops/templates, names: [kustomize, helm, raw], target: "gitops/apps/{app}/"}
  # Tokens replaced in file contents and path segments. Both spellings work; the second suits files where
  # angle brackets are awkward. A path segment `<env>` or `<deployable>` is copied once per environment or
  # deployable of the descriptor; a segment `db` is copied only for apps that declare a database.
  tokens:
    - {token: "<app>", alias: __APP__, value: descriptor name}
    - {token: "<app-repo>", alias: __APP_REPO__, value: "repositories[0].name"}
    - {token: "<app-branch>", alias: __APP_BRANCH__, value: "repositories[0].defaultBranch"}
    - {token: "<project>", alias: __PROJECT__, value: Octopus project name (octopus starters, one copy per project)}
    - {token: "<deployable>", alias: __DEPLOYABLE__, value: deployable name (gitops path segment)}
    - {token: "<env>", alias: __ENV__, value: environment (gitops path segment)}
    - {token: "<namespace>", alias: __NAMESPACE__, value: "{app}-{env} or {app}-{part}-{env} (files under an expanded <env> segment)"}
  skippedFiles: [README.md]                  # a starter's README describes the starter, not the app

azure:
  subscriptionRegion: "<azure-region>"
  foreignResourceGroups: [NetworkWatcherRG, ai-model]   # never touched, never inventoried
  resourceGroups:
    global: [rg-platform-global]
    build: [rg-platform-build, rg-platform-build-aks-nodes]
    tier: ["rg-platform-{tier}-shared", "rg-platform-{tier}-aks", "rg-platform-{tier}-aks-nodes", "rg-platform-{tier}-data", "rg-platform-{tier}-apps"]
    app: ["rg-app-{app}-{tier}"]
  clusters:
    nonprod: {name: aks-platform-nonprod, resourceGroup: rg-platform-nonprod-aks, nodeResourceGroup: rg-platform-nonprod-aks-nodes, environments: [tdd, uat], sleeps: true}
    prod: {name: aks-platform-prod, resourceGroup: rg-platform-prod-aks, nodeResourceGroup: rg-platform-prod-aks-nodes, environments: [prod], sleeps: true}
    build: {name: aks-platform-build, resourceGroup: rg-platform-build, nodeResourceGroup: rg-platform-build-aks-nodes, sleeps: false, buildsPool: builds, buildsPoolMin: 0}
  clusterTier: Free
  network:
    vnet: "vnet-platform-{tier}"
    subnet: "snet-aks-{tier}"
    egressIp: "pip-platform-{tier}-egress"
    ingressIp: "pip-platform-{tier}-ingress"
    peering: none
  registry:
    name: "<acr-name>"
    loginServer: "<acr-name>.azurecr.io"
    resourceGroup: rg-platform-build
    sku: Standard
    adminUser: false
    anonymousPull: false
    repositories: ["apps/{app}/{image}", "apps-previews/{app}/{image}", "platform/{image}"]
  workspaces: ["log-platform-{tier}"]
  platformVault: "<kv-platform-{tier}>"
  storage:
    globalState: {account: "<tfstate-storage-account-global>", container: tfstate, resourceGroup: rg-platform-global}
    tierState: {account: "<tfstate-storage-account-{tier}>", container: tfstate, resourceGroup: "rg-platform-{tier}-shared"}
    backups: {account: "<backup-storage-account-{tier}>", container: "{app}-{env}", resourceGroup: "rg-platform-{tier}-shared"}
  databaseDisks:
    name: "disk-{app}-{env}-db"
    resourceGroup: "rg-platform-{tier}-data"
    sku: StandardSSD_LRS
    sizeGiB: {tdd: 8, uat: 8, prod: 32}
  monitoring:
    appInsights: "appi-{app}-{env}"
    sloAlert: "slo-fast-burn-{app}-{env}"
    actionGroup: ag-platform-oncall
    sleepRule: {name: "apr-sleep-{tier}", resourceGroup: "rg-platform-{tier}-aks", toggledBy: [env-wake, env-sleep]}
  budgets:
    - {name: budget-platform-build, resourceGroups: [rg-platform-global, rg-platform-build, rg-platform-build-aks-nodes]}
    - {name: budget-platform-nonprod, filter: "resource-group name rg-platform-nonprod-* and rg-app-*-nonprod"}
    - {name: budget-platform-prod, filter: "resource-group name rg-platform-prod-* and rg-app-*-prod"}
  tags:
    platform: [platform-tier, platform-component]
    perApp: [platform-app, platform-env]
  locks: {kind: CanNotDelete, appliedBy: "docs/owner/Grant-ProvisionerRights.ps1 -ApplyLocks", resourceGroups: [rg-platform-global, rg-platform-build, rg-platform-prod-data]}
  identities:
    provisioner: {name: sp-automation-mvp-sub, octopusAccount: Azure Runtime Provisioner, usedBy: operator sessions only}
    lifecycle: {name: "id-platform-lifecycle-{tier}", octopusAccount: "azure-platform-lifecycle-{tier}", subject: "space:<space-slug>:project:platform-infrastructure:environment:infra-{tier}"}
    controlPlane: "id-aks-{tier}-controlplane"
    kubelet: "id-aks-{tier}-kubelet"
    kyverno: {name: "id-kyverno-{tier}", subject: "system:serviceaccount:kyverno:kyverno-admission-controller"}
    eso: {name: "id-eso-platform-{tier}", subject: "system:serviceaccount:external-secrets:external-secrets"}
    backup: {name: "id-db-backup-{tier}", subject: "system:serviceaccount:platform-backup:db-backup"}
    octopusAcrPull: {name: id-octopus-acr-pull, feed: acr-apps, subject: "space:<space-slug>:feed:acr-apps"}   # [VERIFY format]
    conformance: {name: sp-platform-conformance, context: platform-conformance, secretDays: 90}
    operators: {group: platform-operators, member: "<object-id-of-platform-operator>"}
    deploy: {name: "id-{app}-{env}-deploy", when: octopus.azureAccount, subject: "space:<space-slug>:project:{project}:environment:{env}", maxFederatedCredentials: 20}
    app: {name: "id-{app}-{env}-app", when: azure.workloadIdentity, subject: "system:serviceaccount:{app}-{env}:<service-account>"}
    buildCluster: system-assigned; no role assignment outside rg-platform-build-aks-nodes (TB2)
  federationAudience: api://AzureADTokenExchange
  # ABAC-constrained RBAC Administrator of the provisioner (ADR-IR34 owner-script change): 12 roles.
  assignableRoles:
    - AcrPull
    - Reader
    - Contributor
    - Key Vault Secrets Officer
    - Key Vault Secrets User
    - Storage Blob Data Contributor
    - Azure Kubernetes Service RBAC Cluster Admin
    - Network Contributor
    - Managed Identity Operator
    - Azure Kubernetes Service Cluster User Role
    - Azure Kubernetes Service RBAC Reader
    - Azure Kubernetes Service RBAC Writer
  appRoleAllowList: [Reader, Contributor, Key Vault Secrets User, Key Vault Secrets Officer, Storage Blob Data Contributor]
  terraform:
    layers:
      - {path: terraform/foundation, state: foundation.tfstate, stateAccount: global, appliedBy: provisioner (operator session)}
      - {path: terraform/build, state: build.tfstate, stateAccount: global, appliedBy: provisioner (operator session), roleAssignments: none}
      - {path: terraform/tier, state: "tier-{tier}.tfstate", stateAccount: tier, appliedBy: "env-* runbooks as id-platform-lifecycle-{tier}", roleAssignments: none}
      - {path: terraform/apps/tier, state: "apps-{app}.tfstate", stateAccount: tier, appliedBy: "apps-apply as id-platform-lifecycle-{tier}", roleAssignments: none}
      - {path: terraform/apps/grants, state: "app-grants-{app}.tfstate", stateAccount: global, appliedBy: provisioner, onlyFor: apps with azure access}
      - {path: octopus/terraform, state: octopus-space.tfstate, stateAccount: global, appliedBy: a Space Manager}
    # Tier layers create no grant (every grant is the provisioner's; ADR-IR34 decision 3).
    noRoleAssignments: [terraform/tier, terraform/apps/tier, terraform/build]
    forbiddenInTierLayers: [azurerm_role_assignment, azurerm_role_definition, azurerm_management_lock]

octopus:
  space: {name: "<octopus-space>", slug: "<octopus-space-slug>", id: "<octopus-space-id>"}
  gitCredential: GitHub clearmeasure-aisf-sample-apps     # stored; restricted to the environment repo (R3)
  environments: [tdd, uat, prod, infra-nonprod, infra-prod]
  appEnvironments: [tdd, uat, prod]
  infraEnvironments: [infra-nonprod, infra-prod]
  lifecycles:
    - name: platform-standard
      phases:
        - {name: TDD, environments: [tdd], automatic: tdd_auto_deploy}
        - {name: UAT, environments: [uat], automatic: false}
        - {name: Prod, environments: [prod], automatic: false}
    - name: platform-hotfix
      phases:
        - {name: UAT, environments: [uat]}
        - {name: Prod, environments: [prod]}
    - name: platform-infrastructure
      phases:
        - {name: Infra Nonprod, environments: [infra-nonprod], optional: true}
        - {name: Infra Prod, environments: [infra-prod], optional: true}
    - name: platform-wake                   # one phase: any application environment, any order
      phases:
        - {name: Application environments, environments: [tdd, uat, prod]}
  appLifecyclePattern: "app-{app}-{x}"
  projectGroups: {platform: Platform, app: "app-{app}"}
  platformProjects:
    - name: platform-infrastructure
      group: Platform
      lifecycle: platform-infrastructure
      basePath: .octopus/platform-infrastructure
      runbooksOnly: true
      libraryVariableSets: [Platform Infrastructure]
    - {name: platform-wake, group: Platform, lifecycle: platform-wake, basePath: .octopus/platform-wake, libraryVariableSets: [Platform Automation], projectVariables: none, step: run-env-wake}
  appProjects:
    basePath: ".octopus/apps/{app}/{project}"
    shellsBy: octopus/terraform (for_each over apps/*.yaml)
    libraryVariableSets: [Platform Environment]
    channels: {default: [Default, Hotfix], hotfixLifecycle: platform-hotfix, sandboxExtra: Strict}
    defaultBranch: main
  libraryVariableSets:
    - name: Platform Environment
      includedIn: app projects
      variables: [Platform.AppsDomain, Platform.WorkerPool, Platform.Registry, Platform.AutomationUsername, Platform.InterventionTestMode, Platform.SoDMode]
      defaults: {Platform.InterventionTestMode: "true", Platform.SoDMode: single-operator}
    - name: Platform Infrastructure
      includedIn: [platform-infrastructure]
    - name: Platform Automation
      includedIn: [platform-wake]
      variables: [PlatformWake.OctopusApiKey]      # sensitive; never in an app project
  storedLibraryVariableSets: [Azure Runtime Provisioning, GitHub AISF Sample Apps]   # included nowhere
  sodModes: [single-operator, enforce]
  accounts:
    lifecycle: [{name: azure-platform-lifecycle-nonprod, environments: [infra-nonprod]}, {name: azure-platform-lifecycle-prod, environments: [infra-prod]}]
    app: "azure-{app}-{env}"
    stored: [{name: Azure Runtime Provisioner, slug: azure-runtime-provisioner, usedBy: none}]
    subjectKeys: [space, project, environment]
  lifecycleAccountVariable: {name: Azure.LifecycleAccount, value: "azure-platform-lifecycle-{tier}"}
  feeds:
    - {name: acr-apps, url: "https://<acr-name>.azurecr.io", oidcIdentity: id-octopus-acr-pull, packages: "apps/{app}/{image}"}
    - {name: docker-hub, url: https://index.docker.io}
    - {name: built-in}
  workerPools: {dynamic: hosted-ubuntu, kubernetes: [k8s-tdd, k8s-uat, k8s-prod], workerNamespaces: "octopus-worker-{env}", perApp: none}
  stepTemplates: [platform-sod-guard, platform-db-backup, platform-pin-writer]
  stepTemplateScripts: [octopus/step-templates/sod-guard.ps1, octopus/step-templates/db-backup.ps1, octopus/step-templates/pin-writer.ps1]
  runbooks:
    project: platform-infrastructure
    files: .octopus/platform-infrastructure/runbooks/{name}.ocl
    list:
      - {name: env-plan, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/tier}
      - {name: env-apply, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/tier}
      - {name: env-destroy, environments: [infra-nonprod], terraformDirectory: terraform/tier}
      - {name: apps-plan, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/apps/tier, prompted: [App.Name]}
      - {name: apps-apply, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/apps/tier, prompted: [App.Name]}
      - {name: rotate-db-passwords, environments: [infra-nonprod, infra-prod], prompted: [App.Name]}
      - {name: env-wake, environments: [infra-nonprod, infra-prod]}
      - {name: env-sleep, environments: [infra-nonprod, infra-prod], prompted: [Sleep.Force, Sleep.DryRun, Sleep.NowOverride]}
    forbidden: [{name: env-destroy, environments: [infra-prod, prod]}]
    retired: [rotate-sql-passwords, provisioner-credential-check, db-backup, db-restore-pitr]
  triggers:
    - {name: env-sleep-hourly-nonprod, project: platform-infrastructure, runbook: env-sleep, environment: infra-nonprod, cron: "0 * * * *", octopusCron: "0 0 * * * *"}
    - {name: env-sleep-hourly-prod, project: platform-infrastructure, runbook: env-sleep, environment: infra-prod, cron: "0 * * * *", octopusCron: "0 0 * * * *"}
  teams: [Platform Engineers, Release Managers, UAT Approvers, Prod Approvers, SRE On-call, Developers, CI Release Publishers]
  teamScope: environments only (a new app needs no team change)
  automationUser:
    name: AISF-Service-Account
    role: Space Manager
    credential: API key (the only Octopus key; ADR-IR32)
    approverTeams: [UAT Approvers, Prod Approvers]
    stores:
      - Codefresh context platform-octopus (release and conformance pipelines)
      - library variable set Platform Automation (PlatformWake.OctopusApiKey, platform-wake only)
      - step-scoped project variable Platform.OctopusApiKey of platform-infrastructure
      - "<kv-platform-{tier}> octopus-gateway-registration-token (both Argo CD gateways)"
  freeze: {name: prod-weekend-freeze, environments: [prod], projects: every app project}
  argoInstances: [{name: argocd-nonprod, tier: nonprod, environments: [tdd, uat]}, {name: argocd-prod, tier: prod, environments: [prod]}]
  pinStep:
    actionType: Octopus.ArgoCDUpdateImageTags   # Preview [VERIFY]; fallback step template platform-pin-writer
    writes: tags only; digests deleted
  testabilityHooks: [Sleep.Force, Sleep.DryRun, Sleep.NowOverride, Wake.WaitMinutes, Platform.InterventionTestMode, Platform.SoDMode]

codefresh:
  account: {name: "<cf-account-name>", id: "<CF_ACCOUNT_ID>", plan: BASIC_1}
  runtime: {name: "<cf-runtime>", value: aks-platform-build/codefresh, accountDefault: true, everySpecSets: runtimeEnvironment}
  runner:
    chart: "oci://quay.io/codefresh/cf-runtime"
    chartVersion: 10.5.6
    values: codefresh/runner/values.yaml
    namespace: codefresh
    tokenSecret: "global.codefreshTokenSecretKeyRef (never committed)"
  platformProject: platform-env
  platformPipelines:
    - {name: env-checks, yaml: codefresh/platform/pipelines/env-checks.yml, spec: codefresh/platform/specs/env-checks.yml, status: codefresh/env-checks}
    - {name: ci-image-dotnet, yaml: codefresh/platform/pipelines/ci-image-dotnet.yml, spec: codefresh/platform/specs/ci-image-dotnet.yml}
    - {name: conformance-arm, yaml: codefresh/platform/pipelines/conformance-arm.yml, spec: codefresh/platform/specs/conformance-arm.yml}
    - {name: conformance, yaml: codefresh/platform/pipelines/conformance.yml, spec: codefresh/platform/specs/conformance.yml}
    - {name: conformance-destructive, yaml: codefresh/platform/pipelines/conformance-destructive.yml, spec: codefresh/platform/specs/conformance-destructive.yml}
    - {name: registry-retention, yaml: codefresh/platform/pipelines/registry-retention.yml, spec: codefresh/platform/specs/registry-retention.yml}
    - {name: fixtures, yaml: codefresh/platform/pipelines/fixtures.yml, spec: codefresh/platform/specs/fixtures.yml}
  appPipelines:
    yaml: "codefresh/apps/{app}/pipelines/"
    specs: "codefresh/apps/{app}/specs/"
    projects: "{app} or {app}-{part}"
    releasePipelineName: "^release(-[a-z0-9-]+)?$"
  register: {script: codefresh/register.sh, modes: ["--preview", "--full", "--app <app>"]}
  contexts:
    - {name: platform-octopus, keys: [OCTOPUS_URL, OCTOPUS_SPACE_ID, OCTOPUS_API_KEY], attachedTo: [app release pipelines, conformance pipelines]}
    - {name: platform-registry, keys: [ACR_REGISTRY, ACR_TOKEN_NAME, ACR_TOKEN_PASSWORD], values: {ACR_TOKEN_NAME: cf-apps-release}, attachedTo: [app release pipelines]}
    - {name: platform-registry-retention, attachedTo: [platform-env/registry-retention]}
    - {name: platform-conformance, keys: [AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, GITHUB_TOKEN], optionalKeys: [CODEFRESH_API_KEY], attachedTo: [conformance pipelines]}
  appContextPattern: "app-{app}-{x}"
  storedContexts: [github-aisf-sample-apps-token]      # kept; attached to nothing (its token also goes into platform-conformance)
  retiredContexts: [workorders-octopus, workorders-ci, workorders-release, azure-runtime-provisioner]
  registryIntegrations:
    - {name: acr-apps-release, token: cf-apps-release, repositories: "apps/*", access: push}
    - {name: acr-apps-preview, token: cf-apps-preview, repositories: "apps-previews/*", access: push}
    - {name: acr-platform-ci, token: cf-platform-ci, repositories: "platform/*", access: push}
    - {name: acr-platform-pull, token: cf-platform-pull, repositories: "platform/*", access: pull}
  retentionToken: {token: cf-platform-retention, repositories: ["apps/*", "apps-previews/*"], access: [read, delete, metadata write]}
  tokenExpiryDays: 90
  gitIntegration: github-aisf-sample-apps
  # The handshake every app release pipeline meets (§7.0; directive §9). Nothing else about app pipelines is fixed.
  handshake:
    M1: images at apps/{app}/{image} (previews at apps-previews/{app}/{image})
    M2: a keyless signature and an SBOM from a release pipeline of that app
    M3: the Octopus release through octopus_release, with explicit PACKAGES and no PACKAGE_VERSION
    M4: never deploy (no deploy, helm, kubectl, argocd or az step; no cluster or Azure credential)
    forkEvents: off in every trigger
  # M3 in both forms: the typed step, and the Octopus CLI command that the starters and apps use.
  releaseStep:
    type: octopusdeploy-create-release
    required: [PACKAGES]
    forbidden: [PACKAGE_VERSION, RELEASE_NOTES]
    cli:
      command: octopus release create
      required: ["--package"]
      forbidden: ["--package-version", "--default-package-version", "--packageversion", "--defaultpackageversion"]
  forbiddenStepTypes: [deploy, approval, helm, launch-composition]
  statuses: [codefresh/ci, codefresh/release, codefresh/preview, codefresh/env-checks]

registry:
  tags: ["<VERSION>", "sha-<sha7>"]
  previewTag: "pr-<n>-<sha>"
  forbiddenTags: [latest]
  locked: after signing (writeEnabled false, deleteEnabled false)
  signer:
    kind: ImageValidatingPolicy
    renderedBy: gitops/platform/tenant
    issuer: https://oidc.codefresh.io
    subjectRegExp: "^https://g\\.codefresh\\.io/<cf-account-name>/{app}(-[a-z0-9]+)?/release(-[a-z0-9-]+)?:<CF_ACCOUNT_ID>/[0-9a-f]{24}$"
    modes: {nonprod: Audit, prod: Enforce}
  retention:
    pipeline: platform-env/registry-retention
    keepLast: 10
    keepPinnedUnder: "gitops/apps/*/envs/**"
    keepFixture: "apps/sandbox/unsigned:0.0.0-fixture"
    deleteAfterDays: {apps: 30, apps-previews: 7}
  pins:
    kustomize: images[].newTag
    helm: values at argo.octopus.com/image-replace-paths
    raw: image fields
    digests: never (V3)

argocd:
  version: {app: 3.5.3, chart: argo/argo-cd}
  instances: {nonprod: argocd-nonprod, prod: argocd-prod}
  roots: {nonprod: argocd/clusters/nonprod, prod: argocd/clusters/prod}
  rootApplication: {name: platform-root, project: platform-addons, valuesFile: "argocd/bootstrap/root-app-{tier}.yaml", path: "argocd/clusters/{tier}"}
  bootstrapValues: "argocd/bootstrap/values-{tier}.yaml"
  applicationSet:
    name: apps
    file: "argocd/clusters/{tier}/appset-apps.yaml"
    generator: git files over apps/*.yaml
    values: {cluster: "{tier}"}
    applicationsSync: create-update
    preserveResourcesOnDeletion: true
    creates: "tenant-{app} (project platform-tenants)"
  appProjects:
    platform: [platform-addons, platform-tenants, default]
    perApp: ["app-{app}", "app-{app}-previews (nonprod)"]
    appProjectDenies: [SecretStore, ClusterSecretStore, ResourceQuota, LimitRange, NetworkPolicy, "kyverno.io/*", "policies.kyverno.io/*", cluster-scoped kinds]
  platformFiles: [namespaces.yaml, projects.yaml, platform-secrets.yaml, storage.yaml, appset-apps.yaml]
  addons: [argocd, external-secrets, octopus-argocd-gateway, kyverno, cert-manager]
  tenantChart: gitops/platform/tenant
  annotations:
    keys: [argo.octopus.com/project, argo.octopus.com/environment, argo.octopus.com/image-replace-paths]
    renderedOnlyBy: gitops/platform/tenant
    forbidden: [argo.octopus.com/tenant]
  forbidden: [syncWindows, argocd-image-updater]
  gatewayPolicies:
    - "p, octopus, applications, get, app-*/*, allow"
    - "p, octopus, logs, get, app-*/*, allow"
  config: {timeoutReconciliation: 120s, adminEnabled: false, gatewayAccount: octopus}

kubernetes:
  platformNamespaces: [argocd, external-secrets, kyverno, cert-manager, octopus-argocd-gateway, platform-ingress, platform-backup]
  bootstrapNamespaces: [argocd]              # created by the Argo CD bootstrap install, not by argocd/clusters/<tier>/namespaces.yaml
  workerNamespaces: "octopus-worker-{env}"
  namespaceLabels:
    app: {platform/app: "{app}", environment: "{env}", tier: app}
    platform: {tier: platform}
  database:
    application: "{app}-db-{env}"
    label: {platform/role: database}
    component: gitops/platform/components/db/mssql-2022-express
    credentialComponents: [gitops/platform/components/db-credentials/keyvault, gitops/platform/components/db-credentials/generated]
    backupComponent: gitops/platform/components/backup/mssql
    statefulSet: db
    services: [db, db-hl]
    port: 1433
    secrets: [db-sa, db-migrator, db-app]
    certificate: db-tls
    edition: {MSSQL_PID: Express, memoryRequest: 2Gi, memoryLimit: 2560Mi, MSSQL_MEMORY_LIMIT_MB: "2048"}
  migrations: {job: db-migrate, hook: PreSync, readyTimeoutVariable: MIGRATION_DB_READY_TIMEOUT_SECONDS}
  storageClass: {name: platform-retain, provisioner: disk.csi.azure.com, sku: StandardSSD_LRS, resourceGroup: "rg-platform-{tier}-data", reclaimPolicy: Retain, binding: WaitForFirstConsumer}
  ingress:
    gateway: {name: platform-gateway, namespace: platform-ingress}
    clusterIssuers: [letsencrypt-http01, platform-internal-ca]
    httpRedirectsToHttps: true
    diagnosticsDeniedIn: [uat, prod]
  quotaDefaults: {memoryGiB: 4, cpu: 2, pvcs: 3, storageGiB: 50, loadBalancers: 0, nodePorts: 0}
  networkPolicy:
    default: deny
    allow: [same app namespaces, platform-ingress, "database from platform-backup", "database from octopus-worker-{env} when database.octopusWorkerAccess"]

sleepWake:
  stoppable: [aks-platform-nonprod, aks-platform-prod]
  scalesToZero: {cluster: aks-platform-build, pool: builds, idleMinutes: 10}
  clusterOfInfraEnv: {infra-nonprod: aks-platform-nonprod, infra-prod: aks-platform-prod}
  infraEnvOfAppEnv: {tdd: infra-nonprod, uat: infra-nonprod, prod: infra-prod}
  runbooks:
    wake: {project: platform-infrastructure, name: env-wake, file: .octopus/platform-infrastructure/runbooks/env-wake.ocl}
    sleep: {project: platform-infrastructure, name: env-sleep, file: .octopus/platform-infrastructure/runbooks/env-sleep.ocl}
  clusterPowerFiles:
    - .octopus/platform-infrastructure/runbooks/env-wake.ocl
    - .octopus/platform-infrastructure/runbooks/env-sleep.ocl
  runbookPool: hosted-ubuntu
  wakeProject: {name: platform-wake, process: .octopus/platform-wake/deployment_process.ocl, step: run-env-wake, reads: "PlatformWake.* and system variables only"}
  appWake:
    deploymentProcess: step 0 of every app process that touches a cluster is a Deploy a Release of platform-wake, condition Always
    runbooks: a keyless wait guard with Wake.WaitMinutes (default 30)
  releaseWake: {step: wake_nonprod, runs: {project: platform-infrastructure, runbook: env-wake, environment: infra-nonprod}, blocking: false}
  platformKeyVariables:
    platformInfrastructure: Platform.OctopusApiKey        # step-scoped project variable
    platformWake: PlatformWake.OctopusApiKey              # library set Platform Automation
  runbookRunCallers:
    - ".octopus/platform-infrastructure/runbooks/*.ocl"
    - ".octopus/platform-wake/deployment_process.ocl (step run-env-wake)"
    - "codefresh/apps/{app}/pipelines/release*.yml (step wake_nonprod)"
    - "codefresh/templates/{starter}/pipelines/release*.yml (step wake_nonprod)"
    - "codefresh/platform/pipelines/conformance*.yml (force-sleep and wake through the runbooks)"
    - "codefresh/platform/scripts/octopus-runbook.sh (run only by the conformance pipelines)"
  variables: [Sleep.Enabled, Sleep.TimeZone, Sleep.WorkDays, Sleep.WorkdayStart, Sleep.WorkdayEnd, Sleep.IdleMinutes, Wake.TimeoutMinutes]
  concurrencyTag: {variable: Octopus.Task.ConcurrencyTag, value: "cluster-power/#{Octopus.Environment.Id}", processes: [env-wake, env-sleep]}

conformance:
  solution: tests/Platform.Conformance.sln
  settings: tests/platform.settings.json
  catalogue: {main: catalogue/capabilities.yaml, fragments: "catalogue/capabilities.d/{role}.yaml", rendered: docs/capabilities.md, renderer: "Platform.Conformance.Report render-catalogue"}
  areas: {codefresh: CAP-CF, octopus: CAP-OCT, gitops: CAP-GIT, azure: CAP-AZ, kit: CAP-KIT, harness: CAP-HARNESS}
  categories: [Live, Offline, Destructive, Slow, NonProd, Prod, Build]
  pipelines: [platform-env/conformance-arm, platform-env/conformance, platform-env/conformance-destructive]
  fixtureApp:
    name: sandbox
    repository: "<sandbox-app-repo>"
    source: fixtures/sandbox-app/
    images: [apps/sandbox/web, apps/sandbox/migrator]
    unsignedImage: "apps/sandbox/unsigned:0.0.0-fixture"
    octopusProject: sandbox
    channels: [Default, Hotfix, Strict]
    namespaces: "sandbox-{env}"
  runLabel: "conformance-run=<run-id>"
  resultsBranch: conformance-results
  endToEnd:
    # CAP-KIT-009 (operator-run, [Explicit]): app #1 by default (PLATFORM_E2E_APP); repository and base branch come
    # from the descriptor's first repository (PLATFORM_E2E_REPO overrides the repository).
    repositoryOwner: clearmeasure-aisf-sample-apps   # asserted; never the upstream ClearMeasureLabs repository
    test: Platform.Conformance.Tests.Kit.EndToEndTests
  onboardingTool: tools/Platform.Onboarding

statuses:
  appRequiredMergeCheck: codefresh/ci
  envRepoRequired: codefresh/env-checks
  octopus: [platform/tdd]

# §11.8 rename map: once a package has moved its files, the old path must be gone (C20).
retiredPaths:
  - {path: .octopus/workorders, now: .octopus/apps/workorders/workorders, package: octopus-architect}
  - {path: .octopus/workorders-infrastructure, now: .octopus/platform-infrastructure, package: octopus-architect}
  - {path: codefresh/workorders, now: codefresh/apps/workorders, package: codefresh-engineer}
  - {path: codefresh/pipelines/env-checks.yml, now: codefresh/platform/pipelines/env-checks.yml, package: codefresh-engineer}
  - {path: codefresh/specs/platform-env-checks.yml, now: codefresh/platform/specs/env-checks.yml, package: codefresh-engineer}
  - {path: codefresh/images/ci-dotnet/Dockerfile, now: containers/platform/ci-dotnet/Dockerfile, package: codefresh-engineer}
  - {path: codefresh/preview/register-preview.sh, now: codefresh/register.sh, package: codefresh-engineer}
  - {path: containers/workorders, now: containers/apps/workorders, package: codefresh-engineer}
  - {path: gitops/workorders, now: gitops/apps/workorders, package: gitops-architect}
  - {path: argocd/clusters/nonprod/apps, now: rendered by gitops/platform/tenant, package: gitops-architect}
  - {path: argocd/clusters/prod/apps, now: rendered by gitops/platform/tenant, package: gitops-architect}
  - {path: argocd/optional/workorders-previews-appset.yaml, now: rendered by gitops/platform/tenant, package: gitops-architect}
  - {path: terraform/environment, now: terraform/tier, package: sre-security}
  - {path: docs/runbooks/database-restore-pitr.md, now: docs/runbooks/database-backup-and-restore.md, package: sre-security}

# Pre-ADR-IR34 names that must leave every platform file other than Markdown and the design (C20). App names
# themselves are caught by the name lint (tool-boundary rule TB22).
retiredNames:
  - workorders-infrastructure
  - workorders-standard
  - workorders-hotfix
  - WorkOrders Environment
  - WorkOrders Infrastructure
  - WorkOrders Platform Automation
  - workorders-octopus
  - acr-workorders
  - cf-workorders-release
  - azure-oidc-deploy-
  - azure-oidc-env-lifecycle-
  - id-env-lifecycle-
  - id-octopus-deploy-
  - aks-workorders-
  - rg-workorders-
  - log-workorders
  - rotate-sql-passwords
  - provisioner-credential-check
  - db-restore-pitr
  - secret-writers
# Retired display names that an app may still use for itself (app #1's product name): checked outside app-scoped paths.
retiredDisplayNames:
  - Work Orders
# A line that must name an app or a retired name (a migration record, such as a list of objects to delete) carries
# the marker `name-lint: allow` in a trailing comment; tool-boundary rule TB22 and consistency check C20 skip it. A
# labelled example ("for example <app>", "e.g. <app>", "such as <app>") is allowed too.
nameLintAllowMarker: "name-lint: allow"

# Package that owns each path root (§11.10). The consistency checks attribute findings with it; longest prefix wins.
ownership:
  - {root: codefresh/, package: codefresh-engineer}
  - {root: containers/, package: codefresh-engineer}
  - {root: fixtures/, package: codefresh-engineer}
  - {root: docs/preview-codefresh.md, package: codefresh-engineer}
  - {root: catalogue/capabilities.d/codefresh.yaml, package: codefresh-engineer}
  - {root: tests/Platform.Conformance.Tests/Codefresh/, package: codefresh-engineer}
  - {root: tests/Platform.Conformance.Offline/Codefresh/, package: codefresh-engineer}
  - {root: .octopus/, package: octopus-architect}
  - {root: octopus/, package: octopus-architect}
  - {root: docs/preview-octopus.md, package: octopus-architect}
  - {root: catalogue/capabilities.d/octopus.yaml, package: octopus-architect}
  - {root: tests/Platform.Conformance.Tests/Octopus/, package: octopus-architect}
  - {root: tests/Platform.Conformance.Offline/Octopus/, package: octopus-architect}
  - {root: argocd/, package: gitops-architect}
  - {root: gitops/, package: gitops-architect}
  - {root: catalogue/capabilities.d/gitops.yaml, package: gitops-architect}
  - {root: tests/Platform.Conformance.Tests/GitOps/, package: gitops-architect}
  - {root: tests/Platform.Conformance.Offline/GitOps/, package: gitops-architect}
  - {root: terraform/, package: sre-security}
  - {root: policies/, package: sre-security}
  - {root: docs/runbooks/, package: sre-security}
  - {root: docs/owner/, package: sre-security}
  - {root: .gitleaks.toml, package: sre-security}
  - {root: catalogue/capabilities.d/azure.yaml, package: sre-security}
  - {root: tests/Platform.Conformance.Tests/Azure/, package: sre-security}
  - {root: tests/Platform.Conformance.Offline/Azure/, package: sre-security}
  - {root: README.md, package: pragmatist}
  - {root: CODEOWNERS, package: pragmatist}
  - {root: .yamllint.yaml, package: pragmatist}
  - {root: contracts/, package: pragmatist}
  - {root: scripts/, package: pragmatist}
  - {root: tools/, package: pragmatist}
  - {root: apps/, package: pragmatist}
