# Machine-readable interface contracts: design/platform-design.md §7 (binding).
#
# Single source of names for scripts/checks/consistency.sh and tool-boundaries.sh.
# Change a name here only in the same pull request that changes §7 of the design.
#
# Conventions
#   - Paths are relative to the environment-repo root. The environment repo holds every
#     platform file, including codefresh/ and containers/; the application repo
#     (appRepo below) holds none. `app:` marks application-repo paths in descriptions.
#   - `{env}`, `{cluster}` and `{class}` are template variables that the checks
#     expand from `expansions`. Angle-bracket values such as `<acr-name>` are §7.1
#     placeholders and stay literal in committed files.
#   - `[VERIFY]` marks product behaviour that the phase-2 TDD spike must prove.
schemaVersion: 1
design: design/platform-design.md

expansions:
  env: [tdd, uat, prod]
  cluster: [nonprod, prod]
  class: [nonprod, prod]
  clusterOfEnv: {tdd: nonprod, uat: nonprod, prod: prod}
  classOfInfraEnv: {infra-nonprod: nonprod, infra-prod: prod}

# §7.1 placeholders (literal in committed files) plus the per-item placeholders
# that other §7 tables use. consistency.sh warns on any other `<...>` token.
placeholders:
  - "<AZURE_TENANT_ID>"
  - "<AZURE_SUBSCRIPTION_ID>"
  - "<azure-region>"
  - "<acr-name>"
  - "<kv-workorders-{env}>"
  - "<kv-workorders-platform-{cluster}>"
  - "<sql-workorders-{env}>"
  - "<sqldb-workorders-{env}>"
  - "<tfstate-storage-account>"
  - "<{env}-hostname>"
  - "<gateway-name>"
  - "<gateway-namespace>"
  - "<gateway-class>"
  - "<OCTOPUS_URL>"
  - "<octopus-space>"
  - "<octopus-space-slug>"
  - "<octopus-space-id>"
  - "<space-slug>"
  - "<CF_ACCOUNT_ID>"
  - "<cf-account-name>"
  - "<CF_RELEASE_PIPELINE_ID>"
  - "<cf-runtime-ci>"
  - "<cf-runtime-release>"
  - "<CF_PREVIEW_PIPELINE_ID>"
  - "<aks-cluster-context>"
  - "<ENV_REPO_URL>"
  - "<ci-image-version>"
  - "<argo-cd-chart-version>"
  - "<argocd-apps-chart-version>"
  - "<external-secrets-chart-version>"
  - "<kyverno-chart-version>"
  - "<octopus-argocd-gateway-chart-version>"
  - "<kubernetes-agent-chart-version>"
  - "<argo-rollouts-chart-version>"
  - "<worker-tools-version>"
  - "<azure-openai-endpoint>"
  - "<model-deployment-name>"
  # Client IDs of user-assigned identities: <client-id-of-<uami name>> (ADR-IR7); the
  # terraform/foundation outputs supply the values.
  - "<client-id-of-id-workorders-{env}-app>"
  - "<client-id-of-id-workorders-{env}-eso>"
  - "<client-id-of-id-eso-platform-{cluster}>"
  - "<client-id-of-id-kyverno-{cluster}>"
  - "<sql-admins-{class}>"
  - "<argocd-sso-app>"
  - "<argocd-{cluster}-host>"
  - "<OCTOPUS_HOST>"
  - "<previews-hostname-suffix>"
  - "<platform-bots-author-regex>"
  - "<provisioner-secret-expires-on>"
  - "<github-status-app-id>"
  - "<github-status-app-installation-id>"
  - "<octopus-cloud-static-ips>"
  - "<VERSION>"
  - "<sha7>"
  - "<package-version>"
  - "<org>"

# Notation the design itself uses in names and descriptions (`k8s-<env>`,
# `MC_<rg>_<cluster>_<region>`); never a value to substitute.
notationTokens:
  - "<env>"
  - "<class>"
  - "<cluster>"
  - "<rg>"
  - "<region>"
  - "<n>"
  - "<number>"
  - "<sha>"
  - "<release>"
  - "<database>"
  - "<UTC timestamp>"
  - "<name>"
  - "<object_id>"

# Placeholder families (ratified, ADR-IR12): versions, digests, identity client IDs and
# Entra group object IDs. `*` matches one or more of [A-Za-z0-9._-].
placeholderPatterns:
  - "<*-chart-version>"
  - "<*-version>"
  - "<*-digest>"
  - "<*-sha256>"
  - "<client-id-of-*>"
  - "<entra-group-object-id-*>"

envRepo:
  name: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
  url: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh.git
  urlPlaceholder: "<ENV_REPO_URL>"
  defaultBranch: main
  visibility: private                      # R2, done 2026-09-24
  writers:
    human: pull request with CODEOWNERS review, merged to main
    octopusPin: direct commit to main; only images[].newTag of gitops/workorders/envs/{env}/kustomization.yaml
    octopusBranch: config-as-code edits on non-main branches, merged by people
  botTeam: platform-bots
  requiredStatus: codefresh/env-checks

appRepo:
  name: clearmeasure-aisf-sample-apps/20260923-001
  url: https://github.com/clearmeasure-aisf-sample-apps/20260923-001
  defaultBranch: master
  visibility: public                       # a fork; GitHub Actions stays disabled (ADR-IR26)
  origin: ClearMeasureLabs/bootcamp-palermo-workorders   # legacy origin of the copy, untouched
  platformFiles: none

environments:
  application: [tdd, uat, prod]
  infrastructure: [infra-nonprod, infra-prod]
  octopusOrder: [tdd, uat, prod, infra-nonprod, infra-prod]

azure:
  resourceGroups:
    - rg-workorders-shared
    - rg-workorders-aks-nonprod
    - rg-workorders-aks-prod
    - rg-workorders-tdd
    - rg-workorders-uat
    - rg-workorders-prod
  clusters: {nonprod: aks-workorders-nonprod, prod: aks-workorders-prod}
  clusterTiers: {nonprod: Free, prod: Standard}
  logAnalytics: log-workorders
  appInsights: appi-workorders-{env}
  keyVaults:
    environment: "<kv-workorders-{env}>"
    platform: "<kv-workorders-platform-{cluster}>"
  sql:
    server: "<sql-workorders-{env}>"
    database: "<sqldb-workorders-{env}>"
    fqdn: "<sql-workorders-{env}>.database.windows.net"
    migratorUser: workorders_migrator
    acceptanceUser: workorders_acceptance   # tdd only
  uamis:
    - id-workorders-{env}-app
    - id-workorders-{env}-eso
    - id-workorders-{env}-migrator
    - id-eso-platform-{cluster}
    - id-kyverno-{cluster}
    - id-octopus-deploy-{env}
    - id-env-lifecycle-{class}
    - id-octopus-acr-pull
    - id-aks-{class}-controlplane
    - id-aks-{class}-kubelet
  workloadFederatedSubjects:
    - {subject: "system:serviceaccount:workorders-{env}:ui-server", uami: "id-workorders-{env}-app"}
    - {subject: "system:serviceaccount:workorders-{env}:worker", uami: "id-workorders-{env}-app"}
    - {subject: "system:serviceaccount:workorders-{env}:workorders-eso", uami: "id-workorders-{env}-eso"}
    - {subject: "system:serviceaccount:external-secrets:external-secrets", uami: "id-eso-platform-{cluster}"}
    - {subject: "system:serviceaccount:kyverno:kyverno-admission-controller", uami: "id-kyverno-{cluster}"}
  federationAudience: api://AzureADTokenExchange
  # Sleep/wake contract: suppresses the SLO and other alerts while a cluster sleeps. Created disabled by
  # terraform/environment; only env-sleep (enable) and env-wake (disable) toggle it.
  alertProcessingRule:
    name: apr-sleep-{cluster}
    resource: azurerm_monitor_alert_processing_rule_suppression
    scope: the environment resource groups of the cluster
    enabled: false
    ignoreChanges: [enabled]
    toggledBy: [env-wake, env-sleep]
  terraform:
    foundation:
      path: terraform/foundation
      stateKey: foundation.tfstate
      # R6 done: the provisioner applies it with the Owner-script grants. Two passes on the same state until the
      # split into terraform/foundation-owner (ADR-D10 status): the provisioner first, then an Owner or User Access
      # Administrator for the resources that neither Contributor nor RBAC Administrator can create (E52).
      appliedBy: provisioner service principal (Azure Runtime Provisioner) under the Owner grants of R6
      ownerOnly:
        - {file: terraform/foundation/governance.tf, resources: [azurerm_management_lock, azurerm_resource_group_policy_assignment]}
        - {file: terraform/foundation/role-assignments.tf, resources: [azurerm_pim_eligible_role_assignment]}
      ownerOnlyAppliedBy: human Owner or User Access Administrator (PIM)
    environment:
      path: terraform/environment
      stateKey: environment-{class}.tfstate
      appliedBy: Octopus runbooks env-plan, env-apply, env-destroy
      forbiddenResources:
        - azurerm_role_assignment
        - azurerm_role_definition
        - azurerm_management_lock
    stateResourceGroup: rg-workorders-shared
    stateStorageAccount: "<tfstate-storage-account>"
    stateContainer: tfstate

octopus:
  space: {name: "<octopus-space>", slug: "<octopus-space-slug>"}
  projectGroup: Work Orders
  platformProjectGroup: Platform               # platform-owned projects that app projects call (ADR-IR33)
  gitCredential: GitHub clearmeasure-aisf-sample-apps
  # owner: app projects never hold a platform secret or an Azure right that starts a cluster (ADR-IR33, user rule:
  # platform secrets never enter app projects). Platform projects may hold Platform.OctopusApiKey (credential below).
  projects:
    - name: workorders
      slug: workorders
      owner: app
      lifecycle: workorders-standard
      tenanted: false
      basePath: .octopus/workorders
      defaultBranch: main
      protectedBranches: [main]
      libraryVariableSets: [WorkOrders Environment]
      allowDeploymentsToNoTargets: true
    - name: workorders-infrastructure
      slug: workorders-infrastructure
      owner: platform
      lifecycle: workorders-infrastructure
      runbooksOnly: true
      basePath: .octopus/workorders-infrastructure
      defaultBranch: main
      protectedBranches: [main]
      libraryVariableSets: [WorkOrders Infrastructure]   # the key arrives as a step-scoped project variable (S5)
    # Deployed by app deployments (Deploy a Release) to wake their cluster without a key. One step, no runbooks,
    # no project variables: a parent deployment's passed variables would override them.
    - name: platform-wake
      slug: platform-wake
      owner: platform
      projectGroup: Platform
      lifecycle: platform-wake
      tenanted: false
      basePath: .octopus/platform-wake
      defaultBranch: main
      protectedBranches: [main]
      libraryVariableSets: [WorkOrders Platform Automation]
      allowDeploymentsToNoTargets: true
      projectVariables: none
      releases: "0.0.<n>, created from main by a Platform Engineer after each change; before the first workorders release"
  environments: [tdd, uat, prod, infra-nonprod, infra-prod]
  lifecycles:
    - name: workorders-standard
      phases:
        - {name: TDD, environments: [tdd], automatic: tdd_auto_deploy}
        - {name: UAT, environments: [uat], automatic: false}
        - {name: Prod, environments: [prod], automatic: false}
    - name: workorders-hotfix
      phases:
        - {name: UAT, environments: [uat]}
        - {name: Prod, environments: [prod]}
    - name: workorders-infrastructure
      phases:
        - {name: Infra Nonprod, environments: [infra-nonprod], optional: true}
        - {name: Infra Prod, environments: [infra-prod], optional: true}
    # ADR-IR33: one phase, so a Deploy a Release step can deploy platform-wake to any application environment.
    - name: platform-wake
      phases:
        - {name: Application environments, environments: [tdd, uat, prod]}
  terraformVariables:
    tddAutoDeploy: tdd_auto_deploy
  channels:
    - name: Default
      default: true
      lifecycle: workorders-standard
      gitReferenceRule: refs/heads/main
      packageVersionTag: "^$"
      releasesCreatedBy: AISF-Service-Account   # automation user, Codefresh workorders/release (ADR-IR32)
    - name: Hotfix
      lifecycle: workorders-hotfix
      gitReferenceRule: refs/heads/main
      releaseNumberPattern: "<package-version>-hotfix.<n>"
      releasesCreatedBy: Release Managers
  freezes:
    - name: prod-weekend-freeze
      environments: [prod]
      projects: [workorders]
      recurrence: Saturday-Sunday   # project freeze, weekly recurring schedule; window length [VERIFY]
      overrideTeam: Release Managers
  # Scheduled runbook triggers created by octopus/terraform (sleep/wake contract). Registered once both projects
  # load from Git: the runbook lives in config-as-code [VERIFY provider resource and Git-runbook support, design §12 Q27].
  # Octopus cron has a leading seconds field: cron "0 * * * *" is written "0 0 * * * *" (octopusCron).
  triggers:
    - {name: env-sleep-hourly-nonprod, project: workorders-infrastructure, runbook: env-sleep, environment: infra-nonprod, cron: "0 * * * *", octopusCron: "0 0 * * * *", timezone: America/Chicago}
    - {name: env-sleep-hourly-prod, project: workorders-infrastructure, runbook: env-sleep, environment: infra-prod, cron: "0 * * * *", octopusCron: "0 0 * * * *", timezone: America/Chicago}
  # octopus/terraform creates every scheduled trigger only when this is true (after the runbooks are on main).
  triggersEnabledBy: runbook_triggers_enabled
  # Runbooks a schedule may run. A schedule never wakes a cluster: only the first job does.
  scheduledRunbooks: [env-sleep, rotate-sql-passwords, provisioner-credential-check]
  terraformInputs:
    - {name: platform_octopus_api_key, sensitive: true, suppliedAs: TF_VAR_platform_octopus_api_key, committed: false}
  deploymentProcess:
    project: workorders
    steps:
      # ADR-IR33: the first step, every channel; order 0 keeps the §7.2 numbers 1-12. Keyless: it deploys the
      # platform-owned project platform-wake to this environment and waits (Deploy a Release, condition Always).
      - order: 0
        slug: wake-environment
        name: Wake environment
        type: Octopus.DeployRelease
        environments: [tdd, uat, prod]
        deploysProject: platform-wake
        deploymentCondition: Always
        feed: octopus-project-feed
        packages: [platform-wake]
      - {order: 1, slug: hotfix-justification, name: Hotfix justification, type: manual-intervention, team: Release Managers, channels: [Hotfix]}
      - {order: 2, slug: prod-go-no-go, name: Prod go/no-go, type: manual-intervention, team: Prod Approvers, environments: [prod]}
      - {order: 3, slug: sod-guard, name: Separation-of-duties guard, type: script-bash, environments: [prod], workerPool: "#{WorkerPool}"}
      - order: 4
        slug: read-deployment-secrets
        name: Read deployment secrets
        type: azure-cli-bash
        account: "#{Azure.DeployAccount}"
        environments: [tdd, uat, prod]
        workerPool: "#{WorkerPool}"
        sensitiveOutputs: {all: [MigratorPassword], tdd: [AcceptancePassword, OpenAIKey]}
      - {order: 5, slug: db-copy-pre-release, name: Copy prod database, type: azure-cli-bash, environments: [prod], workerPool: "#{WorkerPool}"}
      - order: 6
        slug: migrate-database
        name: Migrate database (DbUp update)
        type: script-bash
        environments: [tdd, uat, prod]
        workerPool: "#{WorkerPool}"
        container: "#{StepImage.CiDotnet}"
        packages: [ChurchBulletin.Database]
        retries: 1
        timeoutVariable: Migration.TimeoutSeconds
      - order: 7
        slug: update-argo-cd-image-tags
        name: Update Argo CD image tags
        type: Octopus.ArgoCDUpdateImageTags   # ADR-IR21 [VERIFY against an OCL export]
        environments: [tdd, uat, prod]
        packages: [workorders/ui-server, workorders/worker]
        feed: acr-workorders
        commitMethod: direct
        triggerSync: false
        verification: Argo CD Application is healthy
        timeoutVariable: Argo.VerificationTimeoutSeconds
        retries: 1
      - {order: 8, slug: verify-version, name: Verify version, type: script, environments: [tdd, uat, prod], endpoint: /_version}
      - {order: 9, slug: smoke-test, name: Smoke test, type: script, environments: [tdd, uat, prod], endpoint: /_healthcheck}
      - order: 10
        slug: acceptance-tests
        name: Acceptance tests (TDD only)
        type: script-powershell
        environments: [tdd]
        workerPool: k8s-tdd
        container: "#{StepImage.CiDotnet}"
        packages: [ChurchBulletin.AcceptanceTests]
        timeoutMinutes: 30
      - {order: 11, slug: uat-signoff, name: UAT sign-off, type: manual-intervention, team: UAT Approvers, environments: [uat]}
      - {order: 12, slug: report-commit-status, name: Report platform/tdd status, type: script, environments: [tdd], runCondition: always}
  runbooks:
    - {project: workorders, name: db-backup, environments: [uat, prod]}
    - {project: workorders, name: db-restore-pitr, environments: [uat, prod]}
    - {project: workorders, name: run-acceptance-tests, environments: [tdd]}
    - {project: workorders-infrastructure, name: env-plan, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/environment}
    - {project: workorders-infrastructure, name: env-apply, environments: [infra-nonprod, infra-prod], terraformDirectory: terraform/environment}
    - {project: workorders-infrastructure, name: env-destroy, environments: [infra-nonprod], terraformDirectory: terraform/environment}
    - {project: workorders-infrastructure, name: rotate-sql-passwords, environments: [infra-nonprod, infra-prod]}
    - {project: workorders-infrastructure, name: provisioner-credential-check, environments: [infra-nonprod]}
    # Sleep/wake contract: the only runbooks that start or stop a cluster.
    - {project: workorders-infrastructure, name: env-wake, environments: [infra-nonprod, infra-prod]}
    - {project: workorders-infrastructure, name: env-sleep, environments: [infra-nonprod, infra-prod]}
  forbiddenRunbooks:
    - {name: env-destroy, environments: [infra-prod, prod]}
  variables:
    # Non-sensitive project variables stored in Git (config-as-code).
    - {name: WorkerPool, file: .octopus/workorders/variables.ocl, type: WorkerPool, values: {tdd: k8s-tdd, uat: k8s-uat, prod: k8s-prod}}
    - {name: Azure.DeployAccount, file: .octopus/workorders/variables.ocl, type: AzureAccount, values: {tdd: azure-oidc-deploy-tdd, uat: azure-oidc-deploy-uat, prod: azure-oidc-deploy-prod}}
    - {name: StepImage.CiDotnet, file: .octopus/workorders/variables.ocl, type: String, value: "<acr-name>.azurecr.io/platform/ci-dotnet:<ci-image-version>@sha256:<ci-image-digest>"}
    - {name: Smoke.FailOnDegraded, file: .octopus/workorders/variables.ocl, type: String, values: {tdd: "True", uat: "False", prod: "False"}}
    - {name: Argo.VerificationTimeoutSeconds, file: .octopus/workorders/variables.ocl, type: String, value: "900"}
    - {name: Migration.TimeoutSeconds, file: .octopus/workorders/variables.ocl, type: String, value: "900"}
    - {name: Acceptance.AllowDestructiveReset, file: .octopus/workorders/variables.ocl, type: String, values: {tdd: "True"}}
    - {name: GitHub.StatusEnabled, file: .octopus/workorders/variables.ocl, type: String, value: "False"}
    - {name: GitHub.StatusContext, file: .octopus/workorders/variables.ocl, type: String, value: platform/tdd}
    - {name: GitHub.AppRepository, file: .octopus/workorders/variables.ocl, type: String, value: clearmeasure-aisf-sample-apps/20260923-001}
    - {name: GitHub.StatusAppId, file: .octopus/workorders/variables.ocl, type: String, value: "<github-status-app-id>"}
    - {name: GitHub.StatusAppInstallationId, file: .octopus/workorders/variables.ocl, type: String, value: "<github-status-app-installation-id>"}
    - {name: Platform.AutomationUsername, file: .octopus/workorders/variables.ocl, type: String, value: AISF-Service-Account}   # ADR-IR32, sod-guard
    - name: Azure.LifecycleAccount
      file: .octopus/workorders-infrastructure/variables.ocl
      type: AzureAccount
      values:
        infra-nonprod: azure-runtime-provisioner   # phases 1-2, then azure-oidc-env-lifecycle-nonprod
        infra-prod: azure-oidc-env-lifecycle-prod
    - {name: Provisioner.SecretExpiresOn, file: .octopus/workorders-infrastructure/variables.ocl, type: String, value: "<provisioner-secret-expires-on>"}
    # Defined in each project, identical everywhere (ADR-IR11; consistency.sh C14 compares them).
    - {name: StepImage.CiDotnet, file: .octopus/workorders-infrastructure/variables.ocl, type: String, value: "<acr-name>.azurecr.io/platform/ci-dotnet:<ci-image-version>@sha256:<ci-image-digest>"}
    # Sleep/wake contract: one value for each infrastructure environment (consistency.sh C23).
    - {name: Sleep.Enabled, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "true", infra-prod: "true"}}
    - {name: Sleep.TimeZone, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: America/Chicago, infra-prod: America/Chicago}}
    - {name: Sleep.WorkDays, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "Mon,Tue,Wed,Thu,Fri", infra-prod: "Mon,Tue,Wed,Thu,Fri"}}
    - {name: Sleep.WorkdayStart, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "07:00", infra-prod: "07:00"}}
    - {name: Sleep.WorkdayEnd, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "19:00", infra-prod: "19:00"}}
    - {name: Sleep.IdleMinutes, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "120", infra-prod: "120"}}
    - {name: Wake.TimeoutMinutes, file: .octopus/workorders-infrastructure/variables.ocl, type: String, values: {infra-nonprod: "20", infra-prod: "20"}}
    # ADR-IR33 risk 1: env-wake and env-sleep share one tag per infrastructure environment, so a caller in the same
    # project never queues behind its own wake. Process-scoped to those two runbooks only [VERIFY, design §12 Q23].
    - {name: Octopus.Task.ConcurrencyTag, file: .octopus/workorders-infrastructure/variables.ocl, type: String, value: "cluster-power/#{Octopus.Environment.Id}", processes: [env-wake, env-sleep]}
  promptedVariables:
    # Prompted at run time (§7.2 runbook table).
    - {name: RestorePointInTime, file: .octopus/workorders/variables.ocl, runbook: db-restore-pitr}
    # ADR-IR33: True in a manual run skips the window and idle rules, never Sleep.Enabled or the task check.
    - {name: Sleep.Force, file: .octopus/workorders-infrastructure/variables.ocl, runbook: env-sleep, value: "False"}
  sensitiveVariables:
    # Stored in the Octopus database only; never in Git.
    - {name: GitHub.StatusAppPrivateKey, project: workorders}              # ADR-IR27
    - {name: Octopus.WorkerRegistrationToken, project: workorders-infrastructure, terraformInput: octopus_worker_registration_token}
    - {name: ArgoCD.RepoReadCredential, project: workorders-infrastructure, terraformInput: argocd_repo_read_credential}   # ADR-IR15
    # ADR-IR33: the automation user's key (ADR-IR32), set by octopus/terraform from TF_VAR_platform_octopus_api_key at
    # apply time (never committed). Platform projects only, and only the steps that call the Octopus REST API (S5):
    # platform-wake has one step and includes the library set; workorders-infrastructure gets a project variable
    # scoped to its REST-calling steps [VERIFY scope IDs for runbooks stored in Git, design §12 Q26].
    - {name: Platform.OctopusApiKey, librarySet: WorkOrders Platform Automation, octopusTerraformInput: platform_octopus_api_key}
    - {name: Platform.OctopusApiKey, project: workorders-infrastructure, octopusTerraformInput: platform_octopus_api_key, steps: [wake-environment, wait-for-workers-and-gateway, decide-sleep, stop-cluster]}
  libraryVariableSets:
    new:
      - name: WorkOrders Environment
        managedBy: octopus/terraform
        variables:
          App.BaseUrl: "https://<{env}-hostname>"
          App.InternalUrl: "http://ui-server.workorders-{env}.svc.cluster.local:8080"
          Azure.ResourceGroup: rg-workorders-{env}
          KeyVault.Name: "<kv-workorders-{env}>"
          Sql.ServerName: "<sql-workorders-{env}>"
          Sql.ServerFqdn: "<sql-workorders-{env}>.database.windows.net"
          Sql.Database: "<sqldb-workorders-{env}>"
          Sql.MigratorUser: workorders_migrator
          Sql.AcceptanceUser: workorders_acceptance   # tdd only
          AI.OpenAIUrl: "<azure-openai-endpoint>"
          AI.OpenAIModel: "<model-deployment-name>"
      - name: WorkOrders Infrastructure
        managedBy: octopus/terraform
        variables:
          Environment.Class: "{class}"
          Terraform.StateResourceGroup: rg-workorders-shared
          Terraform.StateStorageAccount: "<tfstate-storage-account>"
          Terraform.StateContainer: tfstate
          Terraform.StateKey: environment-{class}.tfstate
      - name: WorkOrders Platform Automation     # sleep/wake contract (ADR-IR33)
        managedBy: octopus/terraform
        includedIn: [platform-wake]              # never an app project; workorders-infrastructure: step-scoped (S5)
        variables:
          # Sensitive. Used only to run runbooks and read tasks through the Octopus REST API.
          Platform.OctopusApiKey: "(sensitive; TF_VAR_platform_octopus_api_key at apply time)"
    stored:
      # Looked up by name, never created; included in no project.
      - Azure Runtime Provisioning
      - GitHub AISF Sample Apps
  workerPools:
    kubernetes: [k8s-tdd, k8s-uat, k8s-prod]
    dynamic: Hosted Ubuntu
    dynamicSlug: hosted-ubuntu              # env-wake, env-sleep, platform-wake and the keyed wake steps run here
    terraformContainer: "octopusdeploy/worker-tools:<worker-tools-version>"
    terraformContainerFeed: docker-hub      # ADR-IR6: Docker Hub feed created by octopus/terraform/feeds.tf
    workerNamespaces: {tdd: octopus-worker-tdd, uat: octopus-worker-uat, prod: octopus-worker-prod}
  accounts:
    stored:
      - {name: Azure Runtime Provisioner, slug: azure-runtime-provisioner, allowedEnvironments: [infra-nonprod]}
    new:
      - {name: azure-oidc-deploy-tdd, environments: [tdd], uami: id-octopus-deploy-tdd}
      - {name: azure-oidc-deploy-uat, environments: [uat], uami: id-octopus-deploy-uat}
      - {name: azure-oidc-deploy-prod, environments: [prod], uami: id-octopus-deploy-prod}
      - {name: azure-oidc-env-lifecycle-nonprod, environments: [infra-nonprod], uami: id-env-lifecycle-nonprod}
      - {name: azure-oidc-env-lifecycle-prod, environments: [infra-prod], uami: id-env-lifecycle-prod}
    executionSubjectKeys: [space, project, environment]
    audience: api://AzureADTokenExchange
  feeds:
    builtIn:
      packages: [ChurchBulletin.Database, ChurchBulletin.AcceptanceTests]
    dockerHub: {name: Docker Hub, slug: docker-hub, url: https://index.docker.io}
    acr:
      name: acr-workorders
      url: https://<acr-name>.azurecr.io
      oidcIdentity: id-octopus-acr-pull
      subjectKeys: [space, feed]
      packages: [workorders/ui-server, workorders/worker]
  # ADR-IR32 (user directive): one Octopus credential, the Space Manager API key of the existing user below, in
  # the prototype space only. No service accounts, no OIDC identity, no custom user roles.
  automationUser:
    name: AISF-Service-Account
    role: Space Manager                     # prototype space only; no UserEdit, no UserRoleEdit
    credential: API key
    lookedUpBy: octopus/terraform data "octopusdeploy_users" (never created)
    usedBy:
      - {consumer: codefresh workorders/release, store: Codefresh secret context workorders-octopus}
      - {consumer: octopus-argocd-gateway registration, store: "<kv-workorders-platform-{cluster}> octopus-gateway-registration-token"}
      - {consumer: "platform-wake, the one step of the keyless app wake (ADR-IR33)", store: "library variable set WorkOrders Platform Automation (Platform.OctopusApiKey)"}
      - {consumer: "workorders-infrastructure steps wake-environment, wait-for-workers-and-gateway, decide-sleep, stop-cluster (ADR-IR33)", store: "step-scoped sensitive project variable Platform.OctopusApiKey (S5)"}
    rotation: docs/runbooks/credential-rotation.md   # a rotation also re-applies octopus/terraform (R23)
  serviceAccounts: []
  teams:
    - Platform Engineers
    - Release Managers
    - UAT Approvers
    - Prod Approvers
    - SRE On-call
    - Developers
    - CI Release Publishers
  userRoles: []                            # built-in roles only (ADR-IR32)
  teamRoles:
    Platform Engineers: [{role: Space Manager}]
    # The teams that deploy workorders also deploy platform-wake, its keyless first step (ADR-IR33) [VERIFY which
    # identity creates the child deployment, design §12 Q31]. platform-wake has no runbooks, so the role adds nothing.
    Release Managers:
      - {role: Project Deployer, projects: [workorders]}
      - {role: Release Creator, projects: [workorders]}
      - {role: Deployment Creator, projects: [platform-wake], environments: [tdd, uat, prod]}
    UAT Approvers:
      - {role: Project Deployer, projects: [workorders], environments: [uat]}
      - {role: Deployment Creator, projects: [platform-wake], environments: [uat]}
    Prod Approvers:
      - {role: Project Deployer, projects: [workorders], environments: [prod]}
      - {role: Deployment Creator, projects: [platform-wake], environments: [prod]}
    SRE On-call:
      - {role: Runbook Consumer, projects: [workorders], environments: [uat, prod]}
      - {role: Runbook Consumer, projects: [workorders-infrastructure], environments: [infra-nonprod, infra-prod]}   # force-wake, force-sleep (ADR-IR33)
      - {role: Project Viewer, projectGroups: [Work Orders]}
    Developers: [{role: Project Viewer, projectGroups: [Work Orders]}]
    CI Release Publishers: [{role: Release Creator, projects: [workorders]}, {role: Package Publisher}]
  systemObjects: {}                        # nothing needs System Manager (ADR-IR32)
  terraform:
    path: octopus/terraform
    stateKey: octopus-space.tfstate          # ADR-IR9
    appliedBy: platform engineer or the automation user (Space Manager); no System Manager step (ADR-IR32)
  argoInstances:
    - {name: argocd-nonprod, cluster: nonprod, environments: [tdd, uat]}
    - {name: argocd-prod, cluster: prod, environments: [prod]}

argocd:
  version: {app: 3.5.3, chart: argo/argo-cd}
  instances: {nonprod: argocd-nonprod, prod: argocd-prod}
  rootApplication:
    name: platform-root
    project: platform-addons
    valuesFile: argocd/bootstrap/root-app-{cluster}.yaml
    path: argocd/clusters/{cluster}
    directoryRecurse: true
    targetRevision: main
  bootstrapValues: argocd/bootstrap/values-{cluster}.yaml
  appProjects:
    nonprod: [platform-addons, workorders-nonprod, workorders-previews, default]
    prod: [platform-addons, workorders-prod, default]
  appProjectDetail:
    workorders-nonprod:
      destinations: [workorders-tdd, workorders-uat]
      roles: [sre-oncall]
    workorders-prod:
      destinations: [workorders-prod]
      roles: [oncall]
    workorders-previews:
      destinations: ["workorders-pr-*"]
    default:
      locked: true
  namespacedKindAllowList:
    - ConfigMap
    - Secret
    - Service
    - ServiceAccount
    - Deployment
    - Job
    - PodDisruptionBudget
    - NetworkPolicy
    - HTTPRoute
    - SecretStore
    - ExternalSecret
    - Rollout
    - AnalysisTemplate
  applications:
    - name: workorders-tdd
      cluster: nonprod
      env: tdd
      file: argocd/clusters/nonprod/apps/workorders-tdd.yaml
      project: workorders-nonprod
      path: gitops/workorders/envs/tdd
      namespace: workorders-tdd
    - name: workorders-uat
      cluster: nonprod
      env: uat
      file: argocd/clusters/nonprod/apps/workorders-uat.yaml
      project: workorders-nonprod
      path: gitops/workorders/envs/uat
      namespace: workorders-uat
    - name: workorders-prod
      cluster: prod
      env: prod
      file: argocd/clusters/prod/apps/workorders-prod.yaml
      project: workorders-prod
      path: gitops/workorders/envs/prod
      namespace: workorders-prod
  applicationDefaults:
    destinationServer: https://kubernetes.default.svc
    targetRevision: main
    annotations:
      argo.octopus.com/project: workorders
      argo.octopus.com/environment: "{env}"
    syncPolicy:
      automated: {prune: true, selfHeal: true}
      syncOptions: [PruneLast=true]
      retry: {limit: 5, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
    finalizers: []
  addons:
    - {name: argocd, file: "argocd/clusters/{cluster}/addons/argocd.yaml"}
    - {name: external-secrets, file: "argocd/clusters/{cluster}/addons/external-secrets.yaml"}
    - {name: octopus-argocd-gateway, file: "argocd/clusters/{cluster}/addons/octopus-argocd-gateway.yaml"}
    - {name: kyverno, file: "argocd/clusters/{cluster}/addons/kyverno.yaml"}
    - {name: kyverno-policies, file: "argocd/clusters/{cluster}/addons/kyverno.yaml", path: "policies/kyverno/overlays/{cluster}"}
  annotationRules:
    allowedOnlyOn: [workorders-tdd, workorders-uat, workorders-prod]
    forbiddenKeys: [argo.octopus.com/tenant]
  forbidden: [syncWindows, argocd-image-updater]
  previews:
    applicationSet: workorders-previews
    file: argocd/optional/workorders-previews-appset.yaml
    project: workorders-previews
    appName: "workorders-pr-{{.number}}"
    path: gitops/workorders/previews
    labels: [preview]
    requeueAfterSeconds: 300
    imageTag: "pr-{{.number}}-{{.head_sha}}"
    phase: 6
  config:
    timeoutReconciliation: 120s
    adminEnabled: false
    gatewayAccount: octopus
    gatewayPolicies:
      - "p, octopus, applications, get, workorders-*/*, allow"
      - "p, octopus, logs, get, workorders-*/*, allow"
      - "p, octopus, clusters, get, *, allow"

kubernetes:
  namespaces:
    nonprod:
      bootstrap: [argocd]
      addons: [external-secrets, kyverno, octopus-argocd-gateway]
      apps: [workorders-tdd, workorders-uat]
      terraformWorkers: [octopus-worker-tdd, octopus-worker-uat]
      phase6: [argo-rollouts, "workorders-pr-<number>"]
    prod:
      bootstrap: [argocd]
      addons: [external-secrets, kyverno, octopus-argocd-gateway]
      apps: [workorders-prod]
      terraformWorkers: [octopus-worker-prod]
      phase6: [argo-rollouts]
  appNamespaceLabels: {environment: "{env}", tier: app}
  platformNamespaceLabels: {tier: platform}
  workloadObjects:
    Deployment: [ui-server, worker]
    Service: [ui-server]
    ServiceAccount: [ui-server, worker, workorders-eso]
    PodDisruptionBudget: [ui-server]
    HTTPRoute: [ui-server]
    SecretStore: [key-vault]
    ExternalSecret: [workorders-app]
    ConfigMap: [workorders-config]
  servicePort: 8080
  labels:
    ui-server: {app.kubernetes.io/name: ui-server, app.kubernetes.io/part-of: workorders, app.kubernetes.io/component: web}
    worker: {app.kubernetes.io/name: worker, app.kubernetes.io/part-of: workorders, app.kubernetes.io/component: message-handler}
  workloadIdentity:
    serviceAccountAnnotation: azure.workload.identity/client-id
    podLabel: {azure.workload.identity/use: "true"}
  syncWaves: {SecretStore: "-2", ExternalSecret: "-1", workloads: "0"}
  workerReplicasUntilEnabled: 0

images:
  registry: "<acr-name>.azurecr.io"
  release:
    - {repository: workorders/ui-server, kustomizeName: "<acr-name>.azurecr.io/workorders/ui-server", octopusPackageId: workorders/ui-server, pinned: true}
    - {repository: workorders/worker, kustomizeName: "<acr-name>.azurecr.io/workorders/worker", octopusPackageId: workorders/worker, pinned: true}
    - {repository: workorders/db-migrator, kustomizeName: "<acr-name>.azurecr.io/workorders/db-migrator", octopusPackageId: workorders/db-migrator, pinned: false, buildInformationOnly: true}
  previews:
    - {repository: workorders-previews/ui-server, tag: "pr-<number>-<40-hex head sha>"}
    - {repository: workorders-previews/worker, tag: "pr-<number>-<40-hex head sha>"}
    - {repository: workorders-previews/db-migrator, tag: "pr-<number>-<40-hex head sha>"}   # ADR-IR8
  ciToolchain:
    repository: platform/ci-dotnet
    tag: "<ci-image-version>"
    # Pinned by digest everywhere it is used (ADR-IR19).
    reference: "<acr-name>.azurecr.io/platform/ci-dotnet:<ci-image-version>@sha256:<ci-image-digest>"
    source: https://github.com/clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
  releaseTags: ["<VERSION>", "sha-<sha7>"]
  forbiddenTags: [latest]
  ociLabels:
    org.opencontainers.image.source: https://github.com/clearmeasure-aisf-sample-apps/20260923-001
    org.opencontainers.image.revision: "<sha>"
    org.opencontainers.image.version: "<VERSION>"

packages:
  octopusBuiltIn: [ChurchBulletin.Database, ChurchBulletin.AcceptanceTests]
  notPushed: [ChurchBulletin.UI, ChurchBulletin.Script]
  buildInformationPackageIds:
    - workorders/ui-server
    - workorders/worker
    - workorders/db-migrator
    - ChurchBulletin.Database
    - ChurchBulletin.AcceptanceTests

version:
  master: "2.5.<first-parent height>"
  branch: "2.5.<n>-ci.<sha7>"
  hotfix: "<package-version>-hotfix.<n>"
  versionFile: codefresh/workorders/version.env
  major: 2
  minor: 5
  producer: codefresh/workorders/scripts/version.sh

pins:
  file: gitops/workorders/envs/{env}/kustomization.yaml
  writer: update-argo-cd-image-tags
  writableField: images[].newTag
  bootstrapTag: 0.0.0-bootstrap
  shape:
    apiVersion: kustomize.config.k8s.io/v1beta1
    kind: Kustomization
    resources: [config]
    images:
      - {name: "<acr-name>.azurecr.io/workorders/ui-server", newTag: "0.0.0-bootstrap"}
      - {name: "<acr-name>.azurecr.io/workorders/worker", newTag: "0.0.0-bootstrap"}
  configDir: gitops/workorders/envs/{env}/config
  configBase: ../../../base
  baseDir: gitops/workorders/base
  componentsDir: gitops/workorders/components
  unreferencedComponents: [bluegreen]

codefresh:
  projects: [workorders, platform-env]
  pipelines:
    # Every spec loads its YAML from `main` of the environment repo (specTemplate); the
    # workorders/* triggers watch the application repo (ADR-D18).
    - name: workorders/ci
      project: workorders
      spec: codefresh/workorders/specs/workorders-ci.yml
      yaml: codefresh/workorders/pipelines/ci.yml
      revision: main
      triggerRepo: clearmeasure-aisf-sample-apps/20260923-001
      gitIntegration: github-aisf-sample-apps
      runtime: "<cf-runtime-ci>"
      contexts: [workorders-ci]
      status: codefresh/ci
    - name: workorders/release
      project: workorders
      spec: codefresh/workorders/specs/workorders-release.yml
      yaml: codefresh/workorders/pipelines/release.yml
      revision: main
      triggerRepo: clearmeasure-aisf-sample-apps/20260923-001
      gitIntegration: github-aisf-sample-apps
      runtime: "<cf-runtime-release>"
      contexts: [workorders-ci, workorders-release, workorders-octopus]
      registry: acr-workorders-release
      concurrency: 1
      status: codefresh/release
    - name: workorders/preview
      project: workorders
      spec: codefresh/workorders/specs/workorders-preview.yml
      yaml: codefresh/workorders/pipelines/preview.yml
      revision: main
      triggerRepo: clearmeasure-aisf-sample-apps/20260923-001
      gitIntegration: github-aisf-sample-apps
      runtime: "<cf-runtime-ci>"
      contexts: []
      registry: acr-workorders-preview
      status: codefresh/preview
      phase: 6
    - name: workorders/ci-image
      project: workorders
      spec: codefresh/workorders/specs/workorders-ci-image.yml
      yaml: codefresh/workorders/pipelines/ci-image.yml
      revision: main
      triggerRepo: clearmeasure-aisf-sample-apps/basic-environment-octopus-codefresh
      gitIntegration: github-aisf-sample-apps
      runtime: "<cf-runtime-release>"
      contexts: []
      registry: acr-platform-ci
    - name: platform-env/env-checks
      project: platform-env
      spec: codefresh/specs/platform-env-checks.yml
      yaml: codefresh/pipelines/env-checks.yml
      gitIntegration: github-aisf-sample-apps
      runtime: "<cf-runtime-ci>"
      contexts: []
      status: codefresh/env-checks
      validateAllSubcommands: [yaml, kustomize, kubeconform, terraform, boundaries, consistency, secrets]
  contexts:
    - name: workorders-ci
      type: secret
      keys: [CI_SQL_SA_PASSWORD, AI_OPENAI_APIKEY, AI_OPENAI_URL, AI_OPENAI_MODEL]
    - name: workorders-release
      type: secret                           # ADR-IR10: the ACR token password; no Octopus key since ADR-IR32
      keys: [ACR_REGISTRY, ACR_TOKEN_NAME, ACR_TOKEN_PASSWORD]
      values: {ACR_REGISTRY: "<acr-name>.azurecr.io", ACR_TOKEN_NAME: cf-workorders-release}
    - name: workorders-octopus
      type: secret                           # ADR-IR32: the automation user's Space Manager API key
      keys: [OCTOPUS_URL, OCTOPUS_SPACE_ID, OCTOPUS_API_KEY]
      attachedTo: [workorders/release]
  unattachedStores: [azure-runtime-provisioner, github-aisf-sample-apps-token]
  # ACR token behind each registry integration (terraform/foundation/registry.tf).
  registryIntegrations: [acr-workorders-release, acr-workorders-preview, acr-platform-ci, acr-platform-pull]
  registryTokens:
    acr-workorders-release: {token: cf-workorders-release, repositories: "workorders/*", access: push}
    acr-workorders-preview: {token: cf-workorders-preview, repositories: "workorders-previews/*", access: push}
    acr-platform-ci: {token: cf-platform-ci, repositories: "platform/*", access: push, usedBy: [workorders/ci-image]}
    acr-platform-pull: {token: cf-platform-pull, repositories: "platform/*", access: pull, usedBy: [workorders/ci, workorders/release, workorders/preview]}   # ADR-IR19
  gitIntegrations:
    app: github-aisf-sample-apps             # the stored integration covers the org (directive F)
    envRepo: github-aisf-sample-apps
  exportedVariables: [VERSION, BUILD_BUILDNUMBER, CODE_CHANGED, IS_RELEASE]
  gateSteps: [main_clone, prepare, build_sql, build_sqlite, code_analysis, qodana, security_scan, acceptance, gate]
  advisorySteps: [security_scan]
  releaseOnlySteps:
    - wake_nonprod                           # sleep/wake contract: early, non-blocking
    - package
    - stage_images
    - ui_image
    - worker_image
    - migrator_image
    - supply_chain
    - octopus_preflight
    - octopus_packages
    - octopus_build_info
    - octopus_release
  handoff:
    # ADR-IR32: every Octopus step authenticates with the API key from context workorders-octopus.
    - {step: octopusdeploy-push-package, arguments: {OVERWRITE_MODE: ignore, OCTOPUS_API_KEY: "${{OCTOPUS_API_KEY}}", OCTOPUS_SPACE: "${{OCTOPUS_SPACE_ID}}"}}
    - {step: octopusdeploy-push-build-information, arguments: {OVERWRITE_MODE: overwrite, OCTOPUS_API_KEY: "${{OCTOPUS_API_KEY}}", OCTOPUS_SPACE: "${{OCTOPUS_SPACE_ID}}"}}
    - step: octopusdeploy-create-release
      version: 1.0.1
      arguments:
        OCTOPUS_API_KEY: "${{OCTOPUS_API_KEY}}"
        OCTOPUS_SPACE: "${{OCTOPUS_SPACE_ID}}"
        PROJECT: workorders
        CHANNEL: Default
        RELEASE_NUMBER: "${{VERSION}}"
        GIT_REF: refs/heads/main
        IGNORE_EXISTING: true
      # ADR-IR33: every workorders package gets VERSION explicitly (PACKAGES, "<package>:<version>"). A default
      # PACKAGE_VERSION would also be applied to step wake-environment, whose "package" is a platform-wake release
      # (0.0.<n>), and fail the release [VERIFY]; left out, platform-wake resolves to its latest release.
      packagesAtVersion: [ChurchBulletin.Database, ChurchBulletin.AcceptanceTests, workorders/ui-server, workorders/worker]
      # RELEASE_NOTES is rendered unescaped into the step's generated YAML, so the notes come
      # from a file (ADR-IR23; E18).
      forbiddenArguments: [GIT_COMMIT, RELEASE_NOTES, PACKAGE_VERSION]
      releaseNotes:
        argument: RELEASE_NOTES_FILE
        writer: codefresh/workorders/scripts/buildinfo.sh
        firstLine: "app-commit: <40-hex sha>"
  forbiddenStepTypes: [deploy, approval, helm, launch-composition]
  # Sleep/wake contract: the only Codefresh step that wakes anything.
  wakeStep:
    pipeline: workorders/release
    yaml: codefresh/workorders/pipelines/release.yml
    step: wake_nonprod
    runs: {project: workorders-infrastructure, runbook: env-wake, environment: infra-nonprod}
    context: workorders-octopus
    blocking: false                          # fail_fast false, never strict_fail_fast, no dependent step
  noWake: [codefresh/workorders/pipelines/ci.yml, codefresh/workorders/pipelines/ci-image.yml, codefresh/pipelines/env-checks.yml]
  commentedWake: [codefresh/workorders/pipelines/preview.yml]   # phase 6: a commented wake step and a note only

keyVault:
  environmentSecrets:
    # N8: env-apply writes an obvious non-key value; a member of the secret-writers group replaces it (ADR-IR29).
    - {name: workorders-ai-openai-apikey, consumer: eso, writer: "env-apply (stand-in), then the secret-writers group", secretKeys: [AI_OpenAI_ApiKey]}
    - {name: workorders-api-validation-key, consumer: eso, writer: terraform/environment, secretKeys: [ApiKeyAuthentication__ValidationKey]}
    - {name: workorders-appinsights-connection-string, consumer: eso, writer: terraform/environment, secretKeys: [ApplicationInsights__ConnectionString, APPLICATIONINSIGHTS_CONNECTION_STRING]}
    - {name: workorders-sql-migrator-password, consumer: octopus read-deployment-secrets, writer: env-apply}
  tddOnlySecrets:
    - {name: workorders-sql-acceptance-password, consumer: octopus read-deployment-secrets, writer: env-apply}
  platformSecrets:
    - {name: argocd-repo-read-credential, targetSecret: argocd-repo-creds, namespace: argocd, label: "argocd.argoproj.io/secret-type: repo-creds", writer: secret-writers group}
    - {name: argocd-octopus-gateway-token, targetSecret: argocd-octopus-token, key: token, namespace: octopus-argocd-gateway, writer: secret-writers group}
    - name: octopus-gateway-registration-token
      targetSecret: octopus-gateway-registration
      key: token
      namespace: octopus-argocd-gateway
      writer: secret-writers group
      value: "API key of AISF-Service-Account (ADR-IR32)"
    - {name: argocd-sso-client-secret, targetNamespace: argocd, onlyIfFederationUnavailable: true, writer: secret-writers group}
  # Human writers: Entra group <entra-group-object-id-secret-writers>, PIM-eligible Key Vault
  # Secrets Officer on the environment and cluster resource groups (ADR-IR29).
  humanWriters: secret-writers
  eso:
    secretStore: {name: key-vault, syncWave: "-2", authType: WorkloadIdentity, serviceAccountRef: workorders-eso, vaultUrl: "https://<kv-workorders-{env}>.vault.azure.net"}
    externalSecret: {name: workorders-app, syncWave: "-1", refreshInterval: 1h, target: workorders-app, creationPolicy: Owner}
    clusterSecretStore: {name: platform-keyvault, namespaces: [argocd, octopus-argocd-gateway], serviceAccount: external-secrets/external-secrets}
    previewPasswordGenerator: {kind: Password, name: mssql-sa, phase: 6}

health:
  probe: {path: /alive, port: 8080, probes: [startupProbe, livenessProbe, readinessProbe]}
  futureReadiness: /ready   # WI-01
  smoke: /_healthcheck      # Octopus smoke-test only; never a probe
  version: /_version
  metadata: /api/version
  redirectedInUatProd: [/_healthcheck/detailed, /_demo, /_diagnostics, /mcp]
  workerProbes: none        # until WI-04

config:
  configMap: workorders-config
  literals:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    # Escaped line break: the value is one line with no space at the join.
    ConnectionStrings__SqlConnectionString: "Server=tcp:<sql-workorders-{env}>.database.windows.net,1433;Database=<sqldb-workorders-{env}>;\
      Authentication=Active Directory Workload Identity;Encrypt=True;"
    AI_OpenAI_Url: "<azure-openai-endpoint>"
    AI_OpenAI_Model: "<model-deployment-name>"
    ApiKeyAuthentication__Enabled: "false"   # until WI-10
  workerOnly:
    RemotableBus__ApiUrl: "http://ui-server.workorders-{env}.svc.cluster.local:8080/api/blazor-wasm-single-api"
  secretKeys:
    - AI_OpenAI_ApiKey
    - ApiKeyAuthentication__ValidationKey
    - ApplicationInsights__ConnectionString
    - APPLICATIONINSIGHTS_CONNECTION_STRING
  connectionStringPrefix: "Server="
  forbiddenConnectionStringPrefix: "Data Source="

kyverno:
  imageValidatingPolicy:
    file: policies/kyverno/base/verify-release-signatures.yaml
    images: "<acr-name>.azurecr.io/workorders/*"
    issuer: https://oidc.codefresh.io
    subject: "https://g.codefresh.io/<cf-account-name>/workorders/release:<CF_ACCOUNT_ID>/<CF_RELEASE_PIPELINE_ID>"
    mutateDigest: false
  modes: {nonprod: Audit, prod: Enforce}
  overlays: policies/kyverno/overlays/{cluster}

# Sleep by default, wake on the first Codefresh or Octopus job (user directive; sleep/wake contract).
# consistency.sh C23 and tool-boundaries.sh TB17-TB19 read this section.
sleepWake:
  stoppable: [aks-workorders-nonprod, aks-workorders-prod]
  notStoppable:
    - Azure SQL (DTU tiers cannot pause; serverless costs more at this usage)
    - ACR, Key Vault, Log Analytics, Terraform state storage (no compute)
    - the cluster load balancer and public IP, and the private endpoints (billed while stopped)
    - the Codefresh runner cluster (another subscription; recommendation only)
  clusterOfInfraEnv: {infra-nonprod: aks-workorders-nonprod, infra-prod: aks-workorders-prod}
  infraEnvOfAppEnv: {tdd: infra-nonprod, uat: infra-nonprod, prod: infra-prod}
  workerPoolsOfInfraEnv: {infra-nonprod: [k8s-tdd, k8s-uat], infra-prod: [k8s-prod]}
  runbooks:
    wake: {project: workorders-infrastructure, name: env-wake, file: .octopus/workorders-infrastructure/runbooks/env-wake.ocl}
    sleep: {project: workorders-infrastructure, name: env-sleep, file: .octopus/workorders-infrastructure/runbooks/env-sleep.ocl}
  runbookPool: hosted-ubuntu                # never an in-cluster pool
  runbookAccount: "#{Azure.LifecycleAccount}"
  wakeOutput: Wake.CompletedAt
  # Only these two files may start or stop a cluster or toggle the suppression rule (TB17).
  clusterPowerFiles:
    - .octopus/workorders-infrastructure/runbooks/env-wake.ocl
    - .octopus/workorders-infrastructure/runbooks/env-sleep.ocl
  wakeStep: wake-environment
  # Keyless app wake (ADR-IR33; user rule: platform secrets never enter app projects). platform-wake is
  # platform-owned; its one step runs env-wake with the key. App deployments deploy it with Deploy a Release.
  wakeProject:
    name: platform-wake
    process: .octopus/platform-wake/deployment_process.ocl
    variables: .octopus/platform-wake/variables.ocl      # declares no variable: a parent's passed variables override
    step: run-env-wake
    environments: [tdd, uat, prod]
    literals: ["<OCTOPUS_URL>", "<octopus-space-id>"]    # written in the script, never read from variables
  appProjects: [workorders]                    # never the key, its library set or an Azure start right
  platformProjects: [workorders-infrastructure, platform-wake]
  # Every process or runbook that needs a cluster runs wake-environment first (C23), in the form its owner allows.
  wakeFirst:
    - .octopus/workorders/deployment_process.ocl
    - .octopus/workorders/runbooks/db-backup.ocl
    - .octopus/workorders/runbooks/db-restore-pitr.ocl
    - .octopus/workorders/runbooks/run-acceptance-tests.ocl
    - .octopus/workorders-infrastructure/runbooks/env-plan.ocl
    - .octopus/workorders-infrastructure/runbooks/env-apply.ocl
    - .octopus/workorders-infrastructure/runbooks/env-destroy.ocl
    - .octopus/workorders-infrastructure/runbooks/rotate-sql-passwords.ocl
  wakeForms:
    # App deployment processes: Deploy a Release of platform-wake, condition Always, every channel. Keyless.
    deployRelease: [.octopus/workorders/deployment_process.ocl]
    # App runbooks: Deploy a Release is not available in runbooks [VERIFY, design §12 Q32], so a keyless guard waits
    # until the environment answers and names both ways to wake it (deploy platform-wake; env-wake by SRE On-call).
    waitGuard:
      - .octopus/workorders/runbooks/db-backup.ocl
      - .octopus/workorders/runbooks/db-restore-pitr.ocl
      - .octopus/workorders/runbooks/run-acceptance-tests.ocl
    # Platform runbooks: run env-wake through the Octopus REST API with the key, wait, and fail on failure.
    runbookRun:
      - .octopus/workorders-infrastructure/runbooks/env-plan.ocl
      - .octopus/workorders-infrastructure/runbooks/env-apply.ocl
      - .octopus/workorders-infrastructure/runbooks/env-destroy.ocl
      - .octopus/workorders-infrastructure/runbooks/rotate-sql-passwords.ocl
  # The three Terraform runbooks skip the wake while the cluster does not exist; the first env-apply creates it.
  skipWhenNoCluster: [env-plan, env-apply, env-destroy]
  # Never wake: a daily credential check, the sleeper itself, and env-wake (no recursion).
  neverWake: [provisioner-credential-check, env-sleep, env-wake]
  # Octopus REST calls that run runbooks may appear only here (TB18).
  runbookRunCallers:
    - ".octopus/platform-wake/deployment_process.ocl (step run-env-wake)"
    - ".octopus/workorders-infrastructure/runbooks/*.ocl"
    - "codefresh/workorders/pipelines/release.yml (step wake_nonprod)"
  variables: [Sleep.Enabled, Sleep.TimeZone, Sleep.WorkDays, Sleep.WorkdayStart, Sleep.WorkdayEnd, Sleep.IdleMinutes, Wake.TimeoutMinutes]
  sleepRule: >-
    Hourly: stop nothing when Sleep.Enabled is false or the cluster does not exist; skip while any deployment or
    runbook run of any project in the cluster's environments is Queued or Executing (itself excluded); otherwise
    sleep outside Sleep.WorkDays Sleep.WorkdayStart-Sleep.WorkdayEnd in Sleep.TimeZone, or when the last completed
    task or env-wake is older than Sleep.IdleMinutes. Sleep = enable apr-sleep-<cluster>, re-read the task list,
    then az aks stop; a failed stop disables the rule again and fails the run.
  # Prompted in env-sleep (ADR-IR33): True skips the window and idle rules, never Sleep.Enabled or the task check.
  forceVariable: Sleep.Force
  # ADR-IR33 risk 1: shared by env-wake and env-sleep only, never by a caller [VERIFY, design §12 Q23].
  concurrencyTag:
    variable: Octopus.Task.ConcurrencyTag
    value: "cluster-power/#{Octopus.Environment.Id}"
    processes: [env-wake, env-sleep]
  # Force-wake and force-sleep without a deployment (ADR-IR33); see octopus.teamRoles.
  forceRunners: {team: SRE On-call, role: Runbook Consumer, project: workorders-infrastructure, environments: [infra-nonprod, infra-prod]}
  # Sensitive Octopus credential (ADR-IR32 key, never in Git). It reaches only the steps that call the Octopus REST
  # API (S5): the one step of platform-wake (library set) and four step slugs of workorders-infrastructure
  # (step-scoped project variable) [VERIFY scope IDs, design §12 Q26]. Never an app project (TB20, C23).
  credential:
    variable: Platform.OctopusApiKey
    librarySet: WorkOrders Platform Automation
    librarySetProjects: [platform-wake]
    stepScoped:
      project: workorders-infrastructure
      processes: [env-wake, env-sleep, env-plan, env-apply, env-destroy, rotate-sql-passwords]
      steps: [wake-environment, wait-for-workers-and-gateway, decide-sleep, stop-cluster]
  # [VERIFY] settings: the Kubernetes worker machine policy tolerates sleeping workers (no alert, no removal);
  # terraform/environment registers every worker with it (chart value agent.machinePolicyName, S9).
  workerMachinePolicy:
    name: Sleep-tolerant Kubernetes workers
    tolerateUnavailable: true
    deleteUnavailable: false
    registeredBy: agent.machinePolicyName
  defaultPolicy: {infra-nonprod: sleeps, infra-prod: sleeps}   # a real production sets Sleep.Enabled false for infra-prod
  costEstimate:                                                # [UNVERIFIED] design §3.4, USD a month
    foundationPerMonth: 25                                     # ACR Standard about 20; DNS zones, state, vault operations
    privateEndpointsPerMonth: 58                               # 8 at about 7.30: 5 for nonprod (37), 3 for prod (22)
    nonprodAlwaysOnPerMonth: 515                               # per-cluster figures exclude the private endpoints
    prodAlwaysOnPerMonth: 1040
    nonprodSleepingPerMonth: 100
    prodSleepingPerMonth: 140                                  # 210-280 if the tier fee or OS disks bill while stopped
    platformAlwaysOnPerMonth: 1640                             # foundation 25, private endpoints 58, both clusters
    platformSleepingPerMonth: 325

statuses:
  requiredMergeCheck: codefresh/ci          # application repo, from day one (ADR-IR26)
  envRepoRequired: codefresh/env-checks     # environment repo, main
  codefresh: [codefresh/ci, codefresh/release, codefresh/preview, codefresh/env-checks]
  octopus: [platform/tdd]                   # posted once GitHub.StatusEnabled is True (ADR-IR27)

workItems: [WI-01, WI-02, WI-03, WI-04, WI-05, WI-06, WI-07, WI-08, WI-09, WI-10, WI-11, WI-12, WI-13]

# Package that owns each path root (design §11.6). Used to attribute findings.
ownership:
  - {root: codefresh/, package: codefresh-engineer}
  - {root: containers/, package: codefresh-engineer}
  - {root: argocd/, package: gitops-architect}
  - {root: gitops/, package: gitops-architect}
  - {root: .octopus/, package: octopus-architect}
  - {root: octopus/, package: octopus-architect}
  - {root: terraform/, package: sre-security}
  - {root: policies/, package: sre-security}
  - {root: docs/runbooks/, package: sre-security}
  - {root: docs/owner/, package: sre-security}
  - {root: docs/preview-codefresh.md, package: codefresh-engineer}
  - {root: docs/preview-octopus.md, package: octopus-architect}
  - {root: .gitleaks.toml, package: sre-security}
  - {root: design/, package: chief-architect}
  - {root: README.md, package: pragmatist}
  - {root: CODEOWNERS, package: pragmatist}
  - {root: .yamllint.yaml, package: pragmatist}
  - {root: contracts/, package: pragmatist}
  - {root: scripts/, package: pragmatist}
  - {root: docs/, package: pragmatist}
