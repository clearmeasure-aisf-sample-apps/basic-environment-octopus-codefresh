# .gitleaks.toml
#
# Secret scanning for the platform's environment repository (every app's platform files live here,
# ADR-D18, ADR-IR34). Run locally, in platform-env/env-checks and by CAP-KIT-007:
#
#   gitleaks dir . --config .gitleaks.toml --redact
#
# Policy (design §11.4, §6.2):
#   - Every default gitleaks rule applies; nothing is disabled.
#   - The only exception is an obvious placeholder: a finding whose whole secret is an
#     angle-bracket token such as <AZURE_TENANT_ID> or <kv-platform-nonprod>, or a ${...} or
#     ${{...}} template reference such as ${{VERSION}}. Real values never look like that.
#   - No path, file, commit or rule is allow-listed. A real finding is fixed by removing the value
#     and rotating it (docs/runbooks/credential-rotation.md), never by editing this file.
#   - Generated values (database passwords, app keys) never reach a file: terraform/apps/tier
#     writes them to the vaults as write-only values.
#
# Owner: security owners (CODEOWNERS). Format: [[allowlists]], tested with gitleaks 8.28.0.

title = "platform environment repository"

[extend]
useDefault = true

[[allowlists]]
description = "Placeholders only: <...> tokens and ${...} or ${{...}} references"
condition = "OR"
regexTarget = "secret"
regexes = [
  '''^<[A-Za-z0-9][A-Za-z0-9_.{}*/ -]{0,80}>$''',
  '''^\$\{\{?[A-Za-z0-9_. -]{1,80}\}?\}$''',
]
