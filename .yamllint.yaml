# yamllint configuration for the environment repo.
# Used by `scripts/checks/validate-all.ps1 yaml` and by `platform-env/env-checks`.
# Compatible with Kubernetes manifests, Kustomize files, Argo CD Applications and ApplicationSets, Helm values,
# Kyverno policies, Codefresh pipeline YAML and specs, app descriptors and the capability catalogue.
extends: default

yaml-files:
  - "*.yaml"
  - "*.yml"
  - ".yamllint"

# Helm chart templates (the tenant chart, vendored app charts, the Helm starter) are Go templates, not YAML; the
# rendered output is validated instead. Build output of the .NET harness and tools is never linted.
ignore: |
  .git/
  .terraform/
  node_modules/
  bin/
  obj/
  TestResults/
  gitops/**/templates/*.yaml
  gitops/**/templates/**/*.yaml

rules:
  # Kubernetes and Codefresh YAML routinely carry long image references,
  # URLs, regexes and inline scripts.
  line-length:
    max: 200
    level: warning
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # `---` is optional: single-document files omit it, multi-document files use it.
  document-start: disable
  document-end: disable

  # Both `key:\n  - item` and `key:\n- item` appear in generated and hand-written YAML.
  indentation:
    spaces: consistent
    indent-sequences: whatever
    check-multi-line-strings: false

  # Inline comments such as `newTag: "0.0.0-bootstrap"  # written by Octopus only`.
  comments:
    require-starting-space: true
    min-spaces-from-content: 1
  comments-indentation: disable

  # Codefresh `${{VAR}}` expressions and Argo CD `{{.number}}` templates are quoted
  # scalars; flow collections such as `[preview]` stay allowed.
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  brackets:
    min-spaces-inside: 0
    max-spaces-inside: 1

  # Kubernetes needs quoted "true"/"false" in labels and annotations; keys such as
  # `on` in third-party YAML are not flagged.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
    level: warning

  empty-lines:
    max: 2
    max-start: 0
    max-end: 1

  # Duplicate keys silently drop Kubernetes fields: always an error.
  key-duplicates: enable
  new-line-at-end-of-file: enable
  trailing-spaces: enable
  # File modes such as `defaultMode: 0440` are the Kubernetes idiom: the API server's YAML 1.1 parser reads them as
  # octal. A YAML 1.2 reader would not, so they stay visible as warnings; decimal (288) is the portable spelling.
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: false
    level: warning
